# Isolated, port-free fixtures for the real integrated-replica CI acceptance.
# Everything here is CI-only and uses the public fixture credential
# `replica_fixture`; production dependency values must never be mounted or
# interpolated into this stack. The wrapper owns the unique project name,
# network and teardown (`docker compose -p ... down -v`).
services:
  source-pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: replica_fixture
      POSTGRES_PASSWORD: replica_fixture
      POSTGRES_DB: replica_source
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=20
      - -c
      - max_wal_senders=20
      - -c
      - shared_buffers=64MB
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replica_fixture -d replica_source"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: "no"

  source-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: replica_fixture
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: acceptance
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --server-id=1
      - --skip-name-resolve
      - --innodb-buffer-pool-size=64M
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -preplica_fixture --silent"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    restart: "no"

  target-pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: replica_fixture
      POSTGRES_PASSWORD: replica_fixture
      POSTGRES_DB: replica_target
    command:
      - postgres
      - -c
      - shared_buffers=64MB
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replica_fixture -d replica_target"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: "no"
