# Shared WeKnora app definition for the local stack. Production uses the
# equivalent definition in docker-compose.prod.yml with generated secrets.
x-weknora-app: &weknora-app-base
  image: ${WEKNORA_APP_IMAGE:?weknora app image is required}
  environment: &weknora-app-environment
    TZ: ${TZ:-Asia/Shanghai}
    GIN_MODE: release
    AUTO_MIGRATE: "true"
    DB_DRIVER: postgres
    RETRIEVE_DRIVER: postgres
    DB_HOST: weknora-db
    DB_PORT: "5432"
    DB_USER: ${WEKNORA_DB_USER:-weknora}
    DB_PASSWORD: ${WEKNORA_DB_PASSWORD:-weknora-local-password}
    DB_NAME: ${WEKNORA_DB_NAME:-weknora}
    REDIS_ADDR: weknora-redis:6379
    REDIS_PASSWORD: ${WEKNORA_REDIS_PASSWORD:-weknora-local-redis-password}
    DOCREADER_ADDR: weknora-docreader:50051
    DOCREADER_TRANSPORT: grpc
    STORAGE_TYPE: local
    LOCAL_STORAGE_BASE_DIR: /data/files
    MAX_FILE_SIZE_MB: ${WEKNORA_MAX_FILE_SIZE_MB:-50}
    JWT_SECRET: ${WEKNORA_JWT_SECRET:-weknora-local-jwt-secret-change-me}
    SYSTEM_AES_KEY: ${WEKNORA_SYSTEM_AES_KEY:-weknora-local-aes-key-32-bytes!!}
    SYSTEM_SIGNING_KEY: ${WEKNORA_SYSTEM_SIGNING_KEY:-weknora-local-signing-key-change-me}
    APP_EXTERNAL_URL: ${WEKNORA_WEB_URL:-http://127.0.0.1:8089}
    FRONTEND_BASE_URL: ${WEKNORA_WEB_URL:-http://127.0.0.1:8089}
    WEKNORA_BOOTSTRAP_SYSTEM_ADMIN_EMAIL: ${WEKNORA_ADMIN_EMAIL:-admin@weknora.local}
    WEKNORA_TENANT_ENABLE_RBAC: "true"
    WEKNORA_SANDBOX_DOCKER_ENABLED: "false"
    WEKNORA_TRUSTED_PROXIES: ""
    SSRF_WHITELIST_EXTRA: weknora-app,weknora-docreader
    DISABLE_REGISTRATION: "true"
  volumes:
    - weknora_data:/data/files
    - weknora_docreader_tmp:/tmp/docreader:ro
  depends_on:
    weknora-db:
      condition: service_healthy
    weknora-redis:
      condition: service_healthy
    weknora-docreader:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 90s
  networks:
    - weknora_internal
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

# Docker Compose merges `environment` on top of `env_file`, so an explicit
# empty value is the only way to keep the bootstrap-only WeKnora credentials
# that live in the shared .env out of long-running platform containers. Merge
# this block verbatim into every service that loads .env; the bootstrap, verify
# and WeKnora stack keep reading the real values. Only the administrator,
# database, cache and token-signing secrets are masked. The Hindsight DB
# password belongs to the hindsight stack only and is masked the same way.
# The Multica stack secrets follow the same rule: MULTICA_DEFAULT_PAT,
# MULTICA_JWT_SECRET and MULTICA_POSTGRES_PASSWORD belong to the multica
# containers only. `backend` and `pipeline_executor` re-declare the real PAT
# for the default multica integration and the AutoLoop worker (explicit keys
# win over merge keys); all other runtime containers keep the empty PAT mask,
# and every platform process keeps the empty JWT/DB-secret masks. The fixed
# sign-in code MULTICA_DEV_VERIFICATION_CODE is likewise masked everywhere
# except the multica API container.
# `backend` re-declares KANEO_ADMIN_PASSWORD and WEKNORA_ADMIN_PASSWORD with
# the real local values for the one-click SSO relays; all other runtime
# containers keep the empty masks.
x-platform-runtime-weknora-secret-blocks: &platform-runtime-weknora-secret-blocks
  WEKNORA_ADMIN_PASSWORD: ""
  WEKNORA_DB_PASSWORD: ""
  WEKNORA_REDIS_PASSWORD: ""
  WEKNORA_JWT_SECRET: ""
  WEKNORA_SYSTEM_AES_KEY: ""
  WEKNORA_SYSTEM_SIGNING_KEY: ""
  KANEO_ADMIN_PASSWORD: ""
  KANEO_DB_PASSWORD: ""
  KANEO_AUTH_SECRET: ""
  HINDSIGHT_DB_PASSWORD: ""
  MULTICA_DEFAULT_PAT: ""
  MULTICA_JWT_SECRET: ""
  MULTICA_POSTGRES_PASSWORD: ""
  MULTICA_DEV_VERIFICATION_CODE: ""

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ontoprompt
      POSTGRES_USER: ontoprompt
      POSTGRES_PASSWORD: ontoprompt
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontoprompt"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ontopromptredis123}
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:alpine
    command: ["-js", "--store_dir", "/data", "-m", "8222"]
    ports: ["4222:4222"]
    volumes: [nats_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.20-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/ontoprompt123
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio_data:/data]
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WeKnora local stack. The formal app always has registration disabled; use
  # the profile-gated init/bootstrap pair below when initializing a fresh local
  # knowledge base (see docs/development/setup.md).
  weknora-db:
    image: ${WEKNORA_POSTGRES_IMAGE:?weknora postgres image is required}
    environment:
      POSTGRES_DB: ${WEKNORA_DB_NAME:-weknora}
      POSTGRES_USER: ${WEKNORA_DB_USER:-weknora}
      POSTGRES_PASSWORD: ${WEKNORA_DB_PASSWORD:-weknora-local-password}
    volumes:
      - weknora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - weknora_internal
    restart: unless-stopped

  weknora-redis:
    image: ${WEKNORA_REDIS_IMAGE:?weknora redis image is required}
    environment:
      WEKNORA_REDIS_PASSWORD: ${WEKNORA_REDIS_PASSWORD:-weknora-local-redis-password}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${WEKNORA_REDIS_PASSWORD}\""]
    volumes:
      - weknora_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${WEKNORA_REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - weknora_internal
    restart: always

  weknora-docreader:
    image: ${WEKNORA_DOCREADER_IMAGE:?weknora docreader image is required}
    expose:
      - "50051"
    volumes:
      - weknora_docreader_tmp:/tmp/docreader
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      MAX_FILE_SIZE_MB: ${WEKNORA_MAX_FILE_SIZE_MB:-50}
      SSRF_WHITELIST_EXTRA: weknora-app
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - weknora_internal
    restart: unless-stopped

  # Local dev mirrors production's two-app sequence so the formal app is
  # created only after the registration-open initializer has registered the
  # administrator (the first formal-app start promotes it via
  # WEKNORA_BOOTSTRAP_SYSTEM_ADMIN_EMAIL). Both apps share the isolated WeKnora
  # DB and have no host port; the initializer is removed by the user or left
  # idle on the private network after bootstrap.
  weknora-app-init:
    <<: *weknora-app-base
    environment:
      <<: *weknora-app-environment
      DISABLE_REGISTRATION: "false"
    restart: "no"

  weknora-app:
    <<: *weknora-app-base
    # Loopback-only API/MCP reachability for a host-side source backend and
    # the local config center. This is not the public Web entry; the gateway
    # remains the only externally published port and still 404s /mcp.
    ports:
      - "127.0.0.1:${WEKNORA_APP_LOOPBACK_PORT:-18080}:8080"
    environment:
      <<: *weknora-app-environment
      DISABLE_REGISTRATION: "true"
    depends_on:
      weknora-db:
        condition: service_healthy
      weknora-redis:
        condition: service_healthy
      weknora-docreader:
        condition: service_healthy
      weknora-bootstrap:
        condition: service_completed_successfully

  weknora-ui:
    image: ${WEKNORA_UI_IMAGE:?weknora ui image is required}
    expose:
      - "80"
    environment:
      MAX_FILE_SIZE_MB: ${WEKNORA_MAX_FILE_SIZE_MB:-50}
      DEFAULT_LOCALE: ${WEKNORA_DEFAULT_LOCALE:-zh-CN}
      APP_HOST: weknora-app
      APP_PORT: "8080"
      APP_SCHEME: http
    depends_on:
      weknora-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - weknora_internal
    restart: unless-stopped

  weknora-bootstrap:
    build: ./backend
    # Runs automatically on local `up` against the private initializer. The
    # formal app below starts only after this exits successfully, so its
    # startup hook can promote the registered administrator. Registration is
    # idempotent and never resets an existing password.
    command: python -m app.super_assistant.weknora.bootstrap
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WEKNORA_BOOTSTRAP_BASE_URL: http://weknora-app-init:8080
      WEKNORA_BASE_URL: http://weknora-app:8080
      WEKNORA_ADMIN_USER: ${WEKNORA_ADMIN_USER:-admin}
      WEKNORA_ADMIN_EMAIL: ${WEKNORA_ADMIN_EMAIL:-admin@weknora.local}
      WEKNORA_ADMIN_PASSWORD: ${WEKNORA_ADMIN_PASSWORD:-localWeKnoraAdmin2026@}
      WEKNORA_TIMEOUT_SECONDS: ${WEKNORA_TIMEOUT_SECONDS:-15}
    depends_on:
      weknora-app-init:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv
    networks:
      - weknora_internal
    restart: "no"

  weknora-verify:
    build: ./backend
    # Runs after the formal app starts; logs in as the promoted system admin
    # and persists invite_only. Gateway and platform backend depend on this
    # completing successfully. It reads no state file and touches no model.
    command: python -m app.super_assistant.weknora.bootstrap --verify
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WEKNORA_BOOTSTRAP_BASE_URL: http://weknora-app:8080
      WEKNORA_BASE_URL: http://weknora-app:8080
      WEKNORA_ADMIN_USER: ${WEKNORA_ADMIN_USER:-admin}
      WEKNORA_ADMIN_EMAIL: ${WEKNORA_ADMIN_EMAIL:-admin@weknora.local}
      WEKNORA_ADMIN_PASSWORD: ${WEKNORA_ADMIN_PASSWORD:-localWeKnoraAdmin2026@}
      WEKNORA_TIMEOUT_SECONDS: ${WEKNORA_TIMEOUT_SECONDS:-15}
    depends_on:
      weknora-app:
        condition: service_healthy
      weknora-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/.venv
    networks:
      - weknora_internal
    restart: "no"

  weknora-ssl-init:
    image: ${ALPINE_IMAGE:-alpine:3.20}
    volumes:
      - weknora_ssl_certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /certs/server.crt ] && [ -f /certs/server.key ]; then
          exit 0
        fi
        apk add --no-cache openssl >/dev/null
        openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
          -keyout /certs/server.key -out /certs/server.crt \
          -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
        chmod 600 /certs/server.key

  weknora-gateway:
    image: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${WEKNORA_HTTP_PORT:-8089}:80"
      - "${WEKNORA_HTTPS_PORT:-8444}:443"
    volumes:
      - ./docker/weknora/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/weknora/weknora-proxy.inc:/etc/nginx/weknora-proxy.inc:ro
      - weknora_ssl_certs:/etc/nginx/certs:ro
    depends_on:
      weknora-ui:
        condition: service_healthy
      weknora-app:
        condition: service_healthy
      weknora-verify:
        condition: service_completed_successfully
      weknora-ssl-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - weknora_internal
    restart: unless-stopped

  # Kaneo owns its database and native account. Bootstrap completes privately
  # before the public gateway is opened; HTTP only redirects to HTTPS.
  kaneo-db:
    image: ${KANEO_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${KANEO_DB_NAME:-kaneo}
      POSTGRES_USER: ${KANEO_DB_USER:-kaneo}
      POSTGRES_PASSWORD: ${KANEO_DB_PASSWORD:-kaneo-local-db-password}
    volumes:
      - kaneo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kaneo_internal
    restart: unless-stopped

  kaneo-app:
    image: ${KANEO_APP_IMAGE:-ghcr.io/usekaneo/kaneo:2.49.0@sha256:cd1826b1aba3ce736015cadf6f6c975d923aac00f4b6aaa7aedb29bc722dae49}
    ports:
      - "127.0.0.1:${KANEO_APP_LOOPBACK_PORT:-18090}:5173"
    environment:
      NODE_ENV: production
      KANEO_CLIENT_URL: ${KANEO_WEB_URL:-https://localhost:8445}
      KANEO_API_URL: ${KANEO_WEB_URL:-https://localhost:8445}/api
      POSTGRES_HOST: kaneo-db
      POSTGRES_DB: ${KANEO_DB_NAME:-kaneo}
      POSTGRES_USER: ${KANEO_DB_USER:-kaneo}
      POSTGRES_PASSWORD: ${KANEO_DB_PASSWORD:-kaneo-local-db-password}
      AUTH_SECRET: ${KANEO_AUTH_SECRET:-kaneo-local-auth-secret-change-me-2026}
      DISABLE_REGISTRATION: "true"
      DISABLE_GUEST_ACCESS: "true"
      DISABLE_EMAIL_OTP_SIGN_IN: "true"
      TRUSTED_PROXIES: 127.0.0.0/8,::1/128
    volumes:
      - kaneo_data:/var/lib/kaneo
    depends_on:
      kaneo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 20
    networks:
      - kaneo_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  kaneo-bootstrap:
    build: ./backend
    command: ["/bin/sh", "-ec", "python -m app.super_assistant.kaneo.bootstrap && python -m app.super_assistant.kaneo.bootstrap --verify"]
    environment:
      KANEO_BASE_URL: http://kaneo-app:5173
      KANEO_WEB_URL: ${KANEO_WEB_URL:-https://localhost:8445}
      KANEO_ADMIN_USER: ${KANEO_ADMIN_USER:-admin}
      KANEO_ADMIN_EMAIL: ${KANEO_ADMIN_EMAIL:-admin@kaneo.local}
      KANEO_ADMIN_PASSWORD: ${KANEO_ADMIN_PASSWORD:-localKaneoAdmin2026!}
      KANEO_TIMEOUT_SECONDS: ${KANEO_TIMEOUT_SECONDS:-15}
    depends_on:
      kaneo-app:
        condition: service_healthy
    networks:
      - kaneo_internal
    restart: "no"
    security_opt:
      - no-new-privileges:true

  kaneo-gateway:
    image: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${KANEO_HTTP_PORT:-8090}:80"
      - "${KANEO_HTTPS_PORT:-8445}:443"
    environment:
      KANEO_WEB_URL: ${KANEO_WEB_URL:-https://localhost:8445}
    volumes:
      - ./docker/kaneo/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/kaneo/kaneo-proxy.inc:/etc/nginx/kaneo-proxy.inc:ro
      - weknora_ssl_certs:/etc/nginx/certs:ro
    depends_on:
      kaneo-app:
        condition: service_healthy
      kaneo-bootstrap:
        condition: service_completed_successfully
      weknora-ssl-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - kaneo_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Grafana 监控看板（与生产同一固定 13.3.1 digest；无 provisioning 预置）。
  # 本地例外：仅绑定 127.0.0.1 的回环端口（GRAFANA_APP_LOOPBACK_PORT，默认
  # 13001），供宿主机源码运行的 backend/Vite 访问；不发布 0.0.0.0，也不影响
  # 生产（生产 Compose 不发布任何宿主端口）。
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf}
    ports:
      - "127.0.0.1:${GRAFANA_APP_LOOPBACK_PORT:-13001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # 本地默认仅用于本机开发；生产密码由 deploy-prod.sh 随机生成。
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-localGrafanaAdmin2026!}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana 界面默认简体中文（Grafana ≥9.3 内置 zh-Hans，官方标注
      # Preview：核心导航/常用操作已汉化，部分深层设置仍为英文）。
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 20
    networks:
      - grafana_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # 一次性 bootstrap（与生产同一入口/凭据边界；本地默认密码仅供本机开发）。
  grafana-bootstrap:
    build: ./backend
    command: ["/bin/sh", "-ec", "python -m app.operations.grafana.bootstrap && python -m app.operations.grafana.bootstrap --verify"]
    environment:
      GRAFANA_BASE_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-localGrafanaAdmin2026!}
      GRAFANA_TIMEOUT_SECONDS: ${GRAFANA_TIMEOUT_SECONDS:-15}
      GRAFANA_FOLDER_UID: ${GRAFANA_FOLDER_UID:-openontology}
      GRAFANA_FOLDER_TITLE: ${GRAFANA_FOLDER_TITLE:-OpenOntology 监控看板}
    depends_on:
      grafana:
        condition: service_healthy
    networks:
      - grafana_internal
    restart: "no"
    security_opt:
      - no-new-privileges:true

  # Hindsight 长期记忆栈（opt-in：docker compose --profile hindsight up -d，
  # 或在 .env 写 COMPOSE_PROFILES=hindsight）。它是可选特性，不是 backend 的
  # depends_on 依赖：LLM 代理懒加载、记忆调用失败只降级记忆特性，聊天与全局
  # readiness 不受影响。backend 也绝不能把它列为 healthy 依赖（Hindsight 的
  # LLM 指回 backend，构成环）。管理 UI（9999 控制面）与 API 都仅 loopback。
  hindsight-db:
    image: ${HINDSIGHT_POSTGRES_IMAGE:-pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f}
    profiles: ["hindsight"]
    environment:
      POSTGRES_DB: ${HINDSIGHT_DB_NAME:-hindsight}
      POSTGRES_USER: ${HINDSIGHT_DB_USER:-hindsight}
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:-hindsight-local-password}
    volumes:
      - hindsight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - hindsight_internal
    restart: unless-stopped

  # 一次性缓存卷属主修正：镜像以 uid 1000（hindsight 用户）运行，而新建命名
  # 卷默认 root 属主；不先 chown 的话 embedding 模型下载会 EACCES。有 egress
  # 时由 Hindsight 首启自行下载；无 egress 环境按 docs 预填同一卷后置
  # HINDSIGHT_HF_OFFLINE=1。
  hindsight-model-init:
    image: ${ALPINE_IMAGE:-alpine:3.20}
    profiles: ["hindsight"]
    command: ["sh", "-c", "mkdir -p /cache/huggingface && chown -R 1000:1000 /cache"]
    volumes:
      - hindsight_model_cache:/cache
    restart: "no"

  hindsight:
    image: ${HINDSIGHT_IMAGE:-ghcr.io/vectorize-io/hindsight:1.2.0@sha256:19d0c08f3df79acac29384826419a1ca158129e81ec527cdcbd8c97ff4ef76da}
    profiles: ["hindsight"]
    stop_grace_period: 75s
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HINDSIGHT_API_DATABASE_URL: postgresql://${HINDSIGHT_DB_USER:-hindsight}:${HINDSIGHT_DB_PASSWORD:-hindsight-local-password}@hindsight-db:5432/${HINDSIGHT_DB_NAME:-hindsight}
      # 租户鉴权：backend 必须携带同一 HINDSIGHT_API_KEY（Bearer）才可调用，
      # 匿名/错误 key 会被拒；该 key 不是任何真实模型 key。
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_KEY:-hindsight-local-api-key}
      # LLM 走平台内部 OpenAI 兼容代理（实际 POST {base}/chat/completions）。
      # key 是平台内部 service token（与 backend HINDSIGHT_SERVICE_TOKEN 同值），
      # 不是真实模型 key；LLM 懒加载，backend 未就绪不影响 Hindsight 启动。
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: http://backend:8000/api/v2/super-assistant/internal/memory/v1
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_SERVICE_TOKEN:-hindsight-local-service-token}
      # Hindsight 1.2.0 禁止 bank 级 llm_model 覆盖；固定平台别名，真实模型由
      # 平台记忆网关按用户 setting 解析（见 docs/operations/configuration.md）。
      HINDSIGHT_API_LLM_MODEL: oo-memory-default
      # embedding 固定字段：多语 intfloat/multilingual-e5-small（ONNX CPU）。
      # 模型不在镜像内，首启经 HuggingFace egress 下载，缓存在
      # hindsight_model_cache 卷；离线环境需预先填充该卷。
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: onnx
      HINDSIGHT_API_EMBEDDINGS_ONNX_MODEL_ID: intfloat/multilingual-e5-small
      HINDSIGHT_API_EMBEDDINGS_ONNX_FILE: onnx/model.onnx
      HINDSIGHT_API_EMBEDDINGS_ONNX_DIMENSIONS: "384"
      HINDSIGHT_API_EMBEDDINGS_ONNX_QUERY_PREFIX: "query: "
      HINDSIGHT_API_EMBEDDINGS_ONNX_PASSAGE_PREFIX: "passage: "
      # rerank 保持镜像预载默认（hindsight-ai/hs-rerank-1）；其中文效果未验证，
      # 属于效果门禁，部署侧不盲目更换模型。
      # 离线/无 egress 环境预填模型缓存后置 1（huggingface_hub 缓存优先）。
      HF_HOME: /hindsight-model-cache
      HF_HUB_OFFLINE: ${HINDSIGHT_HF_OFFLINE:-0}
    volumes:
      - hindsight_model_cache:/hindsight-model-cache
    depends_on:
      hindsight-db:
        condition: service_healthy
      hindsight-model-init:
        condition: service_completed_successfully
    healthcheck:
      # /health/ready 含数据库就绪；首启可能下载 embedding 模型，放宽启动期。
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8888/health/ready', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    ports:
      # loopback-only：宿主机源码 backend 与本地配置中心直连 API；9999 是
      # 管理 UI，同样仅 loopback，两者都不进公网。
      - "127.0.0.1:${HINDSIGHT_LOOPBACK_PORT:-18888}:8888"
      - "127.0.0.1:${HINDSIGHT_UI_LOOPBACK_PORT:-19999}:9999"
    networks:
      - hindsight_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Multica 默认服务（官方 v0.11.0 自托管栈，随标准本地栈默认启动）：
  # .env.example 自带 COMPOSE_PROFILES=multica，因此
  # `docker compose -f docker-compose.local.yml up` 默认包含这三项服务；
  # 显式关闭 = 把 .env 的 COMPOSE_PROFILES 置空/删掉该行（或改为只含
  # 其它 profile），显式单起 = --profile multica up -d multica multica-web。
  # 契约经上游 v0.11.0 源码树核验（tarball cb190810 + GHCR OCI config
  # 元数据，见 docs/operations/configuration.md「Multica 默认服务」）：
  # 官方 docker-compose.selfhost.yml 由 pgvector/pgvector:pg17 + backend
  # （ghcr.io/multica-ai/multica-backend，容器内监听 8080，/healthz=ready
  # /health=live）+ web（ghcr.io/multica-ai/multica-web，容器内监听 3000，
  # 经 REMOTE_API_URL 服务端代理 API）组成。GHCR 只发布 latest tag，因此
  # 镜像用与 v0.11.0 revision 标签（cb190810…）核验一致的多架构 digest
  # 钉扎。backend 容器入口自动执行 ./migrate up 后启动 server（空库自动
  # 建表，但绝不初始化账号/PAT/workspace）；上传持久化在 /app/data/uploads
  # 卷。空卷初始化边界：首个管理员必须在 web UI 用邮箱验证码注册（无
  # RESEND 配置时验证码打印在 multica 容器日志 `[DEV] Verification code`
  # 行），再创建 workspace、铸造 PAT，最后把五项 MULTICA_DEFAULT_* 回填
  # .env。
  multica-postgres:
    image: ${MULTICA_POSTGRES_IMAGE:-pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f}
    profiles: ["multica"]
    environment:
      POSTGRES_DB: ${MULTICA_POSTGRES_DB:-multica}
      POSTGRES_USER: ${MULTICA_POSTGRES_USER:-multica}
      # 本地默认口令仅供 loopback/内网开发；生产由 deploy-prod.sh 生成并
      # 写入服务器 .env（docker-compose.prod.yml 无此兜底）。
      POSTGRES_PASSWORD: ${MULTICA_POSTGRES_PASSWORD:-multica-local-password}
    volumes:
      - multica_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-multica} -d $${POSTGRES_DB:-multica}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  multica:
    # 官方 API 服务（上游服务名 backend；此处保留 multica 以维持平台
    # http://multica:8080 内网契约）。digest ↔ v0.11.0 已核验，可整体覆盖。
    image: ${MULTICA_BACKEND_IMAGE:-ghcr.io/multica-ai/multica-backend@sha256:099fd0d1eea8fc4cf03254c6dff86f7de206662ff71db8dc9a78e66726dd65a4}
    profiles: ["multica"]
    depends_on:
      multica-postgres:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      # 仅 loopback 直连（供宿主机源码运行的 backend/配置中心）；不发布
      # 公网端口。
      - "127.0.0.1:${MULTICA_API_LOOPBACK_PORT:-18101}:8080"
    volumes:
      # 官方 compose 契约：附件上传持久化卷挂 /app/data/uploads。
      - multica_uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://${MULTICA_POSTGRES_USER:-multica}:${MULTICA_POSTGRES_PASSWORD:-multica-local-password}@multica-postgres:5432/${MULTICA_POSTGRES_DB:-multica}?sslmode=disable
      PORT: "8080"
      # 本地开发兜底 JWT；生产无兜底（deploy-prod.sh 强制生成强随机值）。
      JWT_SECRET: ${MULTICA_JWT_SECRET:-multica-local-jwt-secret-change-me}
      APP_ENV: ${MULTICA_APP_ENV:-production}
      # 官方固定验证码（仅 APP_ENV 非 production 时生效）；留空即关闭。
      MULTICA_DEV_VERIFICATION_CODE: ${MULTICA_DEV_VERIFICATION_CODE:-}
      # 浏览器入口 = web 容器的 loopback 发布端口（web 在服务端代理 API）。
      FRONTEND_ORIGIN: ${MULTICA_FRONTEND_ORIGIN:-http://localhost:18100}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-http://localhost:18100}
      ALLOW_SIGNUP: ${MULTICA_ALLOW_SIGNUP:-true}
      MULTICA_DATABASE_STARTUP_TIMEOUT: ${MULTICA_DATABASE_STARTUP_TIMEOUT:-3m}
    healthcheck:
      # 官方健康契约：GET /healthz（ready，迁移完成后 200）。镜像基 alpine
      # 自带 busybox wget。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      # 空库首启先跑 ./migrate up，start_period 覆盖上游 3m DB 启动预算。
      start_period: 300s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  multica-web:
    # 官方 web（Next.js standalone，容器内 3000）。浏览器只需访问本服务
    # origin：API/WS 由 Next 服务端按 REMOTE_API_URL 代理，不需要后端
    # 发布任何浏览器可达端口。
    image: ${MULTICA_WEB_IMAGE:-ghcr.io/multica-ai/multica-web@sha256:ba8fd0fda94a9ec141e15d77e591db8ee4b246720a722d6f9dffd185ee48863b}
    profiles: ["multica"]
    depends_on:
      - multica
    ports:
      - "127.0.0.1:${MULTICA_WEB_LOOPBACK_PORT:-18100}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      REMOTE_API_URL: http://multica:8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  browser:
    image: openontology-browser:local
    build:
      context: ./docker/browser
      args:
        BROWSER_BASE_IMAGE: ${BROWSER_IMAGE:-chromedp/headless-shell:latest}
    command: ["--no-sandbox", "--disable-dev-shm-usage"]
    ports: ["9222:9222"]
    shm_size: 2gb
    healthcheck:
      # The browser image intentionally has no curl/wget. Bash's TCP socket
      # support verifies the real CDP endpoint without adding another package.
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222 && printf 'GET /json/version HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'webSocketDebuggerUrl' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Python 脚本流水线的执行网关（Jupyter Kernel Gateway）。用户脚本在其内核
  # 中执行，因此刻意不挂 env_file、不注入任何平台凭据环境变量，也不暴露
  # 宿主机端口——仅 backend 经 compose 内网访问。
  python_kernel_gateway:
    build: ./backend
    command: jupyter kernelgateway --KernelGatewayApp.ip=0.0.0.0 --KernelGatewayApp.port=8088 --KernelGatewayApp.auth_token=${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
    restart: unless-stopped

  migrate:
    build: ./backend
    env_file: .env
    environment:
      <<: *platform-runtime-weknora-secret-blocks
    depends_on:
      db:
        condition: service_healthy
    # ./backend 源码 bind mount 会盖掉镜像内安装依赖的 /app/.venv，必须像
    # frontend 的 /app/node_modules 一样用匿名卷保留镜像 venv，否则全新
    # 机器上 alembic/uvicorn 根本不在 PATH 里（镜像 venv 是 linux 二进制，
    # 宿主 macOS venv 也无法在容器内执行）。
    volumes: [./backend:/app, /app/.venv]
    command: alembic upgrade head
    restart: "no"

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    environment:
      <<: *platform-runtime-weknora-secret-blocks
      STEWARD_BROWSER_CDP_URL: http://browser:9222
      STEWARD_BROWSER_MAX_SESSIONS: ${STEWARD_BROWSER_MAX_SESSIONS:-8}
      STEWARD_BROWSER_MAX_SESSIONS_PER_USER: ${STEWARD_BROWSER_MAX_SESSIONS_PER_USER:-3}
      STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS: ${STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS:-900}
      STEWARD_BROWSER_REAPER_INTERVAL_SECONDS: ${STEWARD_BROWSER_REAPER_INTERVAL_SECONDS:-30}
      # 外部托管的 n8n 实例必须能解析该地址；默认 compose 内网地址仅供
      # n8n 与后端同网部署时使用，跨网部署在 .env 里覆盖为平台公网 origin。
      STEWARD_INTERNAL_PROXY_BASE_URL: ${STEWARD_INTERNAL_PROXY_BASE_URL:-http://backend:8000/api-hub/internal/interfaces}
      PYTHON_KERNEL_GATEWAY_URL: http://python_kernel_gateway:8088
      PYTHON_KERNEL_GATEWAY_AUTH_TOKEN: ${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
      # 流水线任务派发通道，仅 compose 内网可达；宿主机源码运行时使用
      # config/generated/local/.env 中的 NATS_URL（经 4222 宿主端口映射）。
      NATS_URL: nats://nats:4222
      # 本地栈同样只向 backend 暴露正式 WeKnora app 内网地址；DB/签名密钥
      # 只交给 bootstrap/verify 与 WeKnora 自身（管理员凭据是下方中继例外）。
      WEKNORA_BASE_URL: http://weknora-app:8080
      WEKNORA_WEB_URL: ${WEKNORA_WEB_URL:-http://127.0.0.1:8089}
      WEKNORA_TIMEOUT_SECONDS: ${WEKNORA_TIMEOUT_SECONDS:-15}
      # WeKnora 一键免登录中继（super_assistant/weknora/sso.py）：backend 用
      # 管理员邮箱/密码做服务端登录——显式覆盖上方掩码锚点的空值，默认值与
      # weknora-bootstrap 的本地默认保持一致；其余运行时容器仍被锚点掩码。
      WEKNORA_ADMIN_EMAIL: ${WEKNORA_ADMIN_EMAIL:-admin@weknora.local}
      WEKNORA_ADMIN_PASSWORD: ${WEKNORA_ADMIN_PASSWORD:-localWeKnoraAdmin2026@}
      KANEO_BASE_URL: http://kaneo-app:5173
      KANEO_WEB_URL: ${KANEO_WEB_URL:-https://localhost:8445}
      KANEO_TIMEOUT_SECONDS: ${KANEO_TIMEOUT_SECONDS:-15}
      # Kaneo 一键免登录中继（super_assistant/kaneo/sso.py）：backend 用管理员
      # 邮箱/密码做服务端 sign-in——显式覆盖上方掩码锚点的空值，默认值与
      # kaneo-bootstrap 的本地默认保持一致；其余运行时容器仍被锚点掩码。
      KANEO_ADMIN_EMAIL: ${KANEO_ADMIN_EMAIL:-admin@kaneo.local}
      KANEO_ADMIN_PASSWORD: ${KANEO_ADMIN_PASSWORD:-localKaneoAdmin2026!}
      # Grafana 监控看板：backend 用共享管理员凭据走内网 HTTP API；本地默认
      # 密码与 grafana/grafana-bootstrap 的本地默认保持一致。
      GRAFANA_BASE_URL: ${GRAFANA_BASE_URL:-http://grafana:3000}
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-localGrafanaAdmin2026!}
      GRAFANA_TIMEOUT_SECONDS: ${GRAFANA_TIMEOUT_SECONDS:-15}
      GRAFANA_FOLDER_UID: ${GRAFANA_FOLDER_UID:-openontology}
      GRAFANA_FOLDER_TITLE: ${GRAFANA_FOLDER_TITLE:-OpenOntology 监控看板}
      # 独立看板会话 cookie（oo_grafana_session）TTL；交付运行配置 28800 秒。
      GRAFANA_SESSION_TTL_SECONDS: ${GRAFANA_SESSION_TTL_SECONDS:-28800}
      SUPER_ASSISTANT_MCP_INTERNAL_BASE_URLS: http://weknora-app:8080/mcp
      # 本地默认也不在 backend 内直接执行用户插件；协议 fixture 可在
      # 源码测试中显式选择 direct_dev。
      SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE: ${SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE:-disabled}
      # 可选 Hindsight 长期记忆（profile `hindsight`）。默认指向 compose 内网
      # 地址；profile 未启用时连接快速失败、记忆特性自动降级，聊天不受影响。
      # 有意不加入 depends_on：Hindsight 的 LLM 回调 backend，属循环依赖。
      HINDSIGHT_BASE_URL: ${HINDSIGHT_BASE_URL:-http://hindsight:8888}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-hindsight-local-api-key}
      HINDSIGHT_TIMEOUT_SECONDS: ${HINDSIGHT_TIMEOUT_SECONDS:-5}
      HINDSIGHT_NAMESPACE: ${HINDSIGHT_NAMESPACE:-openontology}
      HINDSIGHT_SERVICE_TOKEN: ${HINDSIGHT_SERVICE_TOKEN:-hindsight-local-service-token}
      # 可选：管理员专用的 Hindsight 原生 Web 入口（.env 校验值，空=未启用）。
      # 仅 backend 显式映射并使用；其余 env_file 服务可能继承该非密钥值但不
      # 使用。UI 仍走 profile 的 loopback 映射，不新增任何发布端口。
      HINDSIGHT_WEB_URL: ${HINDSIGHT_WEB_URL:-}
      # 控制面一键免密中继（与生产同构）：容器内网地址固定，密钥来自 .env；
      # 本地不设 key 时中继 fail-closed，前端退回控制台自带密钥登录页。
      HINDSIGHT_CP_BASE_URL: http://hindsight:9999
      HINDSIGHT_CP_ACCESS_KEY: ${HINDSIGHT_CP_ACCESS_KEY:-}
      # Multica 默认服务（本地默认随 COMPOSE_PROFILES=multica 启动）。五项
      # 默认值完整时才启用部署级默认集成；未配置时超级助手按每用户自配
      # multica 独立工作。
      MULTICA_DEFAULT_BASE_URL: ${MULTICA_DEFAULT_BASE_URL:-}
      MULTICA_DEFAULT_WEB_URL: ${MULTICA_DEFAULT_WEB_URL:-}
      MULTICA_DEFAULT_WORKSPACE_ID: ${MULTICA_DEFAULT_WORKSPACE_ID:-}
      MULTICA_DEFAULT_WORKSPACE_NAME: ${MULTICA_DEFAULT_WORKSPACE_NAME:-}
      # 部署级 PAT：掩码锚点把它对 env_file 服务置空，这里显式取回真值
      # （仅 backend 与 pipeline_executor；task_worker/migrate 保持空掩码）。
      MULTICA_DEFAULT_PAT: ${MULTICA_DEFAULT_PAT:-}
      # Multica 内网地址允许清单，独立于 MCP 的清单，不共用信任面。
      SUPER_ASSISTANT_MULTICA_INTERNAL_BASE_URLS: ${SUPER_ASSISTANT_MULTICA_INTERNAL_BASE_URLS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      weknora-app:
        condition: service_healthy
      kaneo-app:
        condition: service_healthy
      kaneo-bootstrap:
        condition: service_completed_successfully
      weknora-verify:
        condition: service_completed_successfully
      # CDP availability participates in deep readiness and deployment
      # preflight, but does not prevent the API process from starting so an
      # operator can still inspect diagnostics when Chromium is unhealthy.
      browser:
        condition: service_started
      # Grafana 健康才允许 API 启动（部署级 fail-closed 由 grafana-bootstrap
      # 承担；运行期故障只影响 /health/ready 的 grafana 检查，不停止本服务）。
      grafana:
        condition: service_healthy
    # /app/.venv 匿名卷保留镜像 venv，原因同 migrate 服务。
    volumes: [./backend:/app, /app/.venv, ./uploads:/uploads]
    networks:
      - default
      - weknora_internal
      - kaneo_internal
      - hindsight_internal
      - grafana_internal
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


  # 流水线调度/手动异步触发的执行者：经 NATS JetStream 消费，与 Web 进程隔离。
  pipeline_executor:
    build: ./backend
    env_file: .env
    environment:
      <<: *platform-runtime-weknora-secret-blocks
      STEWARD_BROWSER_CDP_URL: http://browser:9222
      # 外部托管的 n8n 实例必须能解析该地址；默认 compose 内网地址仅供
      # n8n 与后端同网部署时使用，跨网部署在 .env 里覆盖为平台公网 origin。
      STEWARD_INTERNAL_PROXY_BASE_URL: ${STEWARD_INTERNAL_PROXY_BASE_URL:-http://backend:8000/api-hub/internal/interfaces}
      # executor 会执行整条流水线（含 python 脚本引擎），需要内核网关地址
      PYTHON_KERNEL_GATEWAY_URL: http://python_kernel_gateway:8088
      PYTHON_KERNEL_GATEWAY_AUTH_TOKEN: ${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
      NATS_URL: nats://nats:4222
      WEKNORA_BASE_URL: http://weknora-app:8080
      WEKNORA_WEB_URL: ${WEKNORA_WEB_URL:-http://127.0.0.1:8089}
      WEKNORA_TIMEOUT_SECONDS: ${WEKNORA_TIMEOUT_SECONDS:-15}
      KANEO_BASE_URL: http://kaneo-app:5173
      KANEO_WEB_URL: ${KANEO_WEB_URL:-https://localhost:8445}
      KANEO_TIMEOUT_SECONDS: ${KANEO_TIMEOUT_SECONDS:-15}
      SUPER_ASSISTANT_MCP_INTERNAL_BASE_URLS: http://weknora-app:8080/mcp
      SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE: ${SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE:-disabled}
      # 反思链路在 executor 进程内运行，与 backend 共享同一可选记忆配置。
      HINDSIGHT_BASE_URL: ${HINDSIGHT_BASE_URL:-http://hindsight:8888}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-hindsight-local-api-key}
      HINDSIGHT_TIMEOUT_SECONDS: ${HINDSIGHT_TIMEOUT_SECONDS:-5}
      HINDSIGHT_NAMESPACE: ${HINDSIGHT_NAMESPACE:-openontology}
      HINDSIGHT_SERVICE_TOKEN: ${HINDSIGHT_SERVICE_TOKEN:-hindsight-local-service-token}
      # AutoLoop 派发消费与内核执行链路在 executor 进程内调用 Multica：
      # 与 backend 共享同一可选默认集成。五项默认值共用同一 all-or-nothing
      # 完整性谓词（缺任一项（含 WEB_URL）即视为未配置，且会把 web 进程
      # 已物化的平台默认 profile 软删除），因此五项全部显式映射；
      # PAT 显式取回真值（同 backend 例外）。
      MULTICA_DEFAULT_BASE_URL: ${MULTICA_DEFAULT_BASE_URL:-}
      MULTICA_DEFAULT_WEB_URL: ${MULTICA_DEFAULT_WEB_URL:-}
      MULTICA_DEFAULT_WORKSPACE_ID: ${MULTICA_DEFAULT_WORKSPACE_ID:-}
      MULTICA_DEFAULT_WORKSPACE_NAME: ${MULTICA_DEFAULT_WORKSPACE_NAME:-}
      MULTICA_DEFAULT_PAT: ${MULTICA_DEFAULT_PAT:-}
      SUPER_ASSISTANT_MULTICA_INTERNAL_BASE_URLS: ${SUPER_ASSISTANT_MULTICA_INTERNAL_BASE_URLS:-}
      # 启用 task-agent profile（task_worker 独占消费任务实例控制面）时置 1，
      # 避免同一 durable 在无 docker.sock 的本进程间负载均衡。
      TASK_INSTANCES_CONTROL_EXCLUDE: ${TASK_INSTANCES_CONTROL_EXCLUDE:-0}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      weknora-app:
        condition: service_healthy
      kaneo-app:
        condition: service_healthy
      kaneo-bootstrap:
        condition: service_completed_successfully
      weknora-verify:
        condition: service_completed_successfully
    # /app/.venv 匿名卷保留镜像 venv，原因同 migrate 服务。
    volumes: [./backend:/app, /app/.venv, ./uploads:/uploads]
    networks:
      - default
      - weknora_internal
      - kaneo_internal
      - hindsight_internal
    command: python -m app.data_channel.pipeline_tasks.nats_executor
    healthcheck:
      # executor 没有进程内 ping 接口；主循环每 5 秒刷新心跳文件 mtime。
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/nats_executor.heartbeat')<30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 集成副本执行器：与生产同一服务形态（backend/Dockerfile.cdc 镜像，含
  # replica-smt.jar），随标准本地栈自动启动（无 profile/opt-in）；资源口径
  # 与偏移语义见 docs/operations/deployment.md 的「集成副本执行器」一节。
  integrated_replica_executor:
    build:
      context: ./backend
      dockerfile: Dockerfile.cdc
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://ontoprompt:ontoprompt@db:5432/ontoprompt}
      SECRET_KEY: ${SECRET_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Mirror the shared runtime Settings contract. Development uses local
      # defaults; production-only checks remain active only when the operator
      # explicitly sets ENVIRONMENT=production. No env_file is mounted.
      REDIS_URL: ${REDIS_URL:-redis://:ontopromptredis123@redis:6379/0}
      N8N_API_URL: ${N8N_API_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ontoprompt123}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      STEWARD_BROWSER_CDP_URL: http://browser:9222
      STEWARD_BROWSER_ALLOW_PRIVATE_NETWORKS: "false"
      WEKNORA_BASE_URL: http://weknora-app:8080
      WEKNORA_WEB_URL: ${WEKNORA_WEB_URL:-http://127.0.0.1:8089}
      KANEO_BASE_URL: http://kaneo-app:5173
      KANEO_WEB_URL: ${KANEO_WEB_URL:-https://localhost:8445}
      PIPELINE_FILE_PUBLIC_APP_BASE_URL: ${PIPELINE_FILE_PUBLIC_APP_BASE_URL:-http://localhost:5173}
      PIPELINE_FILE_PUBLIC_API_BASE_URL: ${PIPELINE_FILE_PUBLIC_API_BASE_URL:-http://localhost:8000}
      PYTHON_KERNEL_GATEWAY_AUTH_TOKEN: ${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      INTEGRATED_DBX_URL: ${INTEGRATED_DBX_URL:-}
      INTEGRATED_DBX_PASSWORD: ${INTEGRATED_DBX_PASSWORD:-}
      INTEGRATED_DBX_COMMIT: ${INTEGRATED_DBX_COMMIT:-}
      # 单宿主共享状态卷；每个 capture 由 SourceLease 单写者围栏。此上限是
      # 每个 executor 实例的并发捕获数（默认 2），数百源需增加实例/资源。
      REPLICA_STATE_ROOT: /var/lib/openontology-replicas
      REPLICA_MAX_CAPTURES: ${REPLICA_MAX_CAPTURES:-2}
      REPLICA_RECONCILE_INTERVAL_SECONDS: ${REPLICA_RECONCILE_INTERVAL_SECONDS:-0.5}
      REPLICA_HEARTBEAT_FILE: /tmp/integrated_replica_executor.heartbeat
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # ./backend 源码 bind mount 会盖掉镜像 venv，原因同 migrate/backend 服务。
    volumes:
      - integrated_replica_state:/var/lib/openontology-replicas
      - ./backend:/app
      - /app/.venv
    command: python -m app.data_channel.integrated.replica_executor
    mem_limit: ${REPLICA_EXECUTOR_MEM_LIMIT:-3g}
    cpus: ${REPLICA_EXECUTOR_CPUS:-2.0}
    pids_limit: 1024
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/integrated_replica_executor.heartbeat')<30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # 任务实例 agent 执行体（opt-in：--profile task-agent 启用）。
  # 挂载宿主 docker.sock，为每个 agent 节点起 openontology-task-agent 容器；
  # 镜像需先构建：docker build -t openontology-task-agent:local docker/task-agent
  task_worker:
    profiles: ["task-agent"]
    build: ./backend
    env_file: .env
    environment:
      <<: *platform-runtime-weknora-secret-blocks
      NATS_URL: nats://nats:4222
      TASK_INSTANCES_EXECUTOR: docker
      # 控制面独占开关在本服务必须显式归零：共享 .env 的 EXCLUDE 只应
      # 作用于让出方（pipeline_executor），不能把消费者自己也排除
      TASK_INSTANCES_CONTROL_EXCLUDE: "0"
      TASK_AGENT_IMAGE: ${TASK_AGENT_IMAGE:-openontology-task-agent:local}
      TASK_AGENT_NETWORK: ${TASK_AGENT_NETWORK:-bridge}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./uploads:/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    command: python -m app.data_channel.pipeline_tasks.nats_executor
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      # Vite dev 中间件代理 /grafana/ 的上游（校验端点走上方 API 代理目标）。
      # 宿主机源码运行时用 GRAFANA_APP_LOOPBACK_PORT 推导的回环地址覆盖。
      GRAFANA_PROXY_TARGET: ${GRAFANA_PROXY_TARGET:-http://grafana:3000}
    # /grafana/ 鉴权代理需要访问 grafana_internal 上的 grafana。
    networks:
      - default
      - grafana_internal
    depends_on:
      backend:
        condition: service_started
      grafana:
        condition: service_healthy
      grafana-bootstrap:
        condition: service_completed_successfully
    volumes: [./frontend:/app, /app/node_modules]
    command: npm run dev -- --host

volumes:
  kaneo_postgres_data:
  kaneo_data:
  pg_data:
  neo4j_data:
  minio_data:
  nats_data:
  weknora_postgres_data:
  weknora_redis_data:
  weknora_data:
  weknora_docreader_tmp:
  weknora_ssl_certs:
  hindsight_postgres_data:
  hindsight_model_cache:
  # Multica 官方自托管栈数据卷：PostgreSQL 数据 + backend 附件上传
  # （/app/data/uploads，官方 compose 契约）。
  multica_pgdata:
  multica_uploads:
  # integrated_replica_executor 的偏移/模式历史专用卷（单宿主共享，
  # 每 capture 由 SourceLease 单写者围栏）。
  integrated_replica_state:
  # Grafana 原生数据（SQLite/数据源/看板/用户）；与平台 PG 成对备份恢复。
  grafana_data:

networks:
  kaneo_internal:
    driver: bridge
  weknora_internal:
    driver: bridge
  # 独立 Hindsight 栈（普通 bridge：首启需 HuggingFace egress 下载 embedding
  # 模型，运行期需回调 backend 内部 LLM 代理）。不发布公网端口；仅 backend
  # 与 pipeline_executor 以成员身份访问。
  hindsight_internal:
    driver: bridge
  # Grafana 私网：成员限定为 grafana、grafana-bootstrap、backend、frontend
  # （vite dev）。宿主机源码运行的 backend/Vite 走 grafana 的 127.0.0.1
  # 回环端口（GRAFANA_APP_LOOPBACK_PORT），不加入该网络。
  grafana_internal:
    driver: bridge
