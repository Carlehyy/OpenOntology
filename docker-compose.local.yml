# Shared WeKnora app definition for the local stack. Production uses the
# equivalent definition in docker-compose.prod.yml with generated secrets.
x-weknora-app: &weknora-app-base
  image: ${WEKNORA_APP_IMAGE:?weknora app image is required}
  environment: &weknora-app-environment
    TZ: ${TZ:-Asia/Shanghai}
    GIN_MODE: release
    AUTO_MIGRATE: "true"
    DB_DRIVER: postgres
    RETRIEVE_DRIVER: postgres
    DB_HOST: weknora-db
    DB_PORT: "5432"
    DB_USER: ${WEKNORA_DB_USER:-weknora}
    DB_PASSWORD: ${WEKNORA_DB_PASSWORD:-weknora-local-password}
    DB_NAME: ${WEKNORA_DB_NAME:-weknora}
    REDIS_ADDR: weknora-redis:6379
    REDIS_PASSWORD: ${WEKNORA_REDIS_PASSWORD:-weknora-local-redis-password}
    DOCREADER_ADDR: weknora-docreader:50051
    DOCREADER_TRANSPORT: grpc
    STORAGE_TYPE: local
    LOCAL_STORAGE_BASE_DIR: /data/files
    MAX_FILE_SIZE_MB: ${WEKNORA_MAX_FILE_SIZE_MB:-50}
    JWT_SECRET: ${WEKNORA_JWT_SECRET:-weknora-local-jwt-secret-change-me}
    SYSTEM_AES_KEY: ${WEKNORA_SYSTEM_AES_KEY:-weknora-local-aes-key-32-bytes!!}
    SYSTEM_SIGNING_KEY: ${WEKNORA_SYSTEM_SIGNING_KEY:-weknora-local-signing-key-change-me}
    APP_EXTERNAL_URL: ${WEKNORA_WEB_URL:-http://127.0.0.1:8089}
    FRONTEND_BASE_URL: ${WEKNORA_WEB_URL:-http://127.0.0.1:8089}
    WEKNORA_BOOTSTRAP_SYSTEM_ADMIN_EMAIL: ${WEKNORA_ADMIN_EMAIL:-admin@weknora.local}
    WEKNORA_TENANT_ENABLE_RBAC: "true"
    WEKNORA_SANDBOX_DOCKER_ENABLED: "false"
    WEKNORA_TRUSTED_PROXIES: ""
    SSRF_WHITELIST_EXTRA: weknora-app,weknora-docreader
    DISABLE_REGISTRATION: "true"
  volumes:
    - weknora_data:/data/files
    - weknora_docreader_tmp:/tmp/docreader:ro
  depends_on:
    weknora-db:
      condition: service_healthy
    weknora-redis:
      condition: service_healthy
    weknora-docreader:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 90s
  networks:
    - weknora_internal
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

# Docker Compose merges `environment` on top of `env_file`, so an explicit
# empty value is the only way to keep the bootstrap-only WeKnora credentials
# that live in the shared .env out of long-running platform containers. Merge
# this block verbatim into every service that loads .env; the bootstrap, verify
# and WeKnora stack keep reading the real values. Only the administrator,
# database, cache and token-signing secrets are masked.
x-platform-runtime-weknora-secret-blocks: &platform-runtime-weknora-secret-blocks
  WEKNORA_ADMIN_PASSWORD: ""
  WEKNORA_DB_PASSWORD: ""
  WEKNORA_REDIS_PASSWORD: ""
  WEKNORA_JWT_SECRET: ""
  WEKNORA_SYSTEM_AES_KEY: ""
  WEKNORA_SYSTEM_SIGNING_KEY: ""

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ontoprompt
      POSTGRES_USER: ontoprompt
      POSTGRES_PASSWORD: ontoprompt
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontoprompt"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ontopromptredis123}
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:alpine
    command: ["-js", "--store_dir", "/data", "-m", "8222"]
    ports: ["4222:4222"]
    volumes: [nats_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.20-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/ontoprompt123
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio_data:/data]
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WeKnora local stack. The formal app always has registration disabled; use
  # the profile-gated init/bootstrap pair below when initializing a fresh local
  # knowledge base (see docs/development/setup.md).
  weknora-db:
    image: ${WEKNORA_POSTGRES_IMAGE:?weknora postgres image is required}
    environment:
      POSTGRES_DB: ${WEKNORA_DB_NAME:-weknora}
      POSTGRES_USER: ${WEKNORA_DB_USER:-weknora}
      POSTGRES_PASSWORD: ${WEKNORA_DB_PASSWORD:-weknora-local-password}
    volumes:
      - weknora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - weknora_internal
    restart: unless-stopped

  weknora-redis:
    image: ${WEKNORA_REDIS_IMAGE:?weknora redis image is required}
    environment:
      WEKNORA_REDIS_PASSWORD: ${WEKNORA_REDIS_PASSWORD:-weknora-local-redis-password}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${WEKNORA_REDIS_PASSWORD}\""]
    volumes:
      - weknora_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${WEKNORA_REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - weknora_internal
    restart: always

  weknora-docreader:
    image: ${WEKNORA_DOCREADER_IMAGE:?weknora docreader image is required}
    expose:
      - "50051"
    volumes:
      - weknora_docreader_tmp:/tmp/docreader
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      MAX_FILE_SIZE_MB: ${WEKNORA_MAX_FILE_SIZE_MB:-50}
      SSRF_WHITELIST_EXTRA: weknora-app
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - weknora_internal
    restart: unless-stopped

  # Local dev mirrors production's two-app sequence so the formal app is
  # created only after the registration-open initializer has registered the
  # administrator (the first formal-app start promotes it via
  # WEKNORA_BOOTSTRAP_SYSTEM_ADMIN_EMAIL). Both apps share the isolated WeKnora
  # DB and have no host port; the initializer is removed by the user or left
  # idle on the private network after bootstrap.
  weknora-app-init:
    <<: *weknora-app-base
    environment:
      <<: *weknora-app-environment
      DISABLE_REGISTRATION: "false"
    restart: "no"

  weknora-app:
    <<: *weknora-app-base
    # Loopback-only API/MCP reachability for a host-side source backend and
    # the local config center. This is not the public Web entry; the gateway
    # remains the only externally published port and still 404s /mcp.
    ports:
      - "127.0.0.1:${WEKNORA_APP_LOOPBACK_PORT:-18080}:8080"
    environment:
      <<: *weknora-app-environment
      DISABLE_REGISTRATION: "true"
    depends_on:
      weknora-db:
        condition: service_healthy
      weknora-redis:
        condition: service_healthy
      weknora-docreader:
        condition: service_healthy
      weknora-bootstrap:
        condition: service_completed_successfully

  weknora-ui:
    image: ${WEKNORA_UI_IMAGE:?weknora ui image is required}
    expose:
      - "80"
    environment:
      MAX_FILE_SIZE_MB: ${WEKNORA_MAX_FILE_SIZE_MB:-50}
      DEFAULT_LOCALE: ${WEKNORA_DEFAULT_LOCALE:-zh-CN}
      APP_HOST: weknora-app
      APP_PORT: "8080"
      APP_SCHEME: http
    depends_on:
      weknora-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - weknora_internal
    restart: unless-stopped

  weknora-bootstrap:
    build: ./backend
    # Runs automatically on local `up` against the private initializer. The
    # formal app below starts only after this exits successfully, so its
    # startup hook can promote the registered administrator. Registration is
    # idempotent and never resets an existing password.
    command: python -m app.super_assistant.weknora.bootstrap
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WEKNORA_BOOTSTRAP_BASE_URL: http://weknora-app-init:8080
      WEKNORA_BASE_URL: http://weknora-app:8080
      WEKNORA_ADMIN_USER: ${WEKNORA_ADMIN_USER:-admin}
      WEKNORA_ADMIN_EMAIL: ${WEKNORA_ADMIN_EMAIL:-admin@weknora.local}
      WEKNORA_ADMIN_PASSWORD: ${WEKNORA_ADMIN_PASSWORD:-localWeKnoraAdmin2026@}
      WEKNORA_TIMEOUT_SECONDS: ${WEKNORA_TIMEOUT_SECONDS:-15}
    depends_on:
      weknora-app-init:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv
    networks:
      - weknora_internal
    restart: "no"

  weknora-verify:
    build: ./backend
    # Runs after the formal app starts; logs in as the promoted system admin
    # and persists invite_only. Gateway and platform backend depend on this
    # completing successfully. It reads no state file and touches no model.
    command: python -m app.super_assistant.weknora.bootstrap --verify
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WEKNORA_BOOTSTRAP_BASE_URL: http://weknora-app:8080
      WEKNORA_BASE_URL: http://weknora-app:8080
      WEKNORA_ADMIN_USER: ${WEKNORA_ADMIN_USER:-admin}
      WEKNORA_ADMIN_EMAIL: ${WEKNORA_ADMIN_EMAIL:-admin@weknora.local}
      WEKNORA_ADMIN_PASSWORD: ${WEKNORA_ADMIN_PASSWORD:-localWeKnoraAdmin2026@}
      WEKNORA_TIMEOUT_SECONDS: ${WEKNORA_TIMEOUT_SECONDS:-15}
    depends_on:
      weknora-app:
        condition: service_healthy
      weknora-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/.venv
    networks:
      - weknora_internal
    restart: "no"

  weknora-ssl-init:
    image: ${ALPINE_IMAGE:-alpine:3.20}
    volumes:
      - weknora_ssl_certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /certs/server.crt ] && [ -f /certs/server.key ]; then
          exit 0
        fi
        apk add --no-cache openssl >/dev/null
        openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
          -keyout /certs/server.key -out /certs/server.crt \
          -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
        chmod 600 /certs/server.key

  weknora-gateway:
    image: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${WEKNORA_HTTP_PORT:-8089}:80"
      - "${WEKNORA_HTTPS_PORT:-8444}:443"
    volumes:
      - ./docker/weknora/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/weknora/weknora-proxy.inc:/etc/nginx/weknora-proxy.inc:ro
      - weknora_ssl_certs:/etc/nginx/certs:ro
    depends_on:
      weknora-ui:
        condition: service_healthy
      weknora-app:
        condition: service_healthy
      weknora-verify:
        condition: service_completed_successfully
      weknora-ssl-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - weknora_internal
    restart: unless-stopped

  browser:
    image: openontology-browser:local
    build:
      context: ./docker/browser
      args:
        BROWSER_BASE_IMAGE: ${BROWSER_IMAGE:-chromedp/headless-shell:latest}
    command: ["--no-sandbox", "--disable-dev-shm-usage"]
    ports: ["9222:9222"]
    shm_size: 2gb
    healthcheck:
      # The browser image intentionally has no curl/wget. Bash's TCP socket
      # support verifies the real CDP endpoint without adding another package.
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222 && printf 'GET /json/version HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'webSocketDebuggerUrl' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Python 脚本流水线的执行网关（Jupyter Kernel Gateway）。用户脚本在其内核
  # 中执行，因此刻意不挂 env_file、不注入任何平台凭据环境变量，也不暴露
  # 宿主机端口——仅 backend 经 compose 内网访问。
  python_kernel_gateway:
    build: ./backend
    command: jupyter kernelgateway --KernelGatewayApp.ip=0.0.0.0 --KernelGatewayApp.port=8088 --KernelGatewayApp.auth_token=${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
    restart: unless-stopped

  migrate:
    build: ./backend
    env_file: .env
    environment:
      <<: *platform-runtime-weknora-secret-blocks
    depends_on:
      db:
        condition: service_healthy
    # ./backend 源码 bind mount 会盖掉镜像内安装依赖的 /app/.venv，必须像
    # frontend 的 /app/node_modules 一样用匿名卷保留镜像 venv，否则全新
    # 机器上 alembic/uvicorn 根本不在 PATH 里（镜像 venv 是 linux 二进制，
    # 宿主 macOS venv 也无法在容器内执行）。
    volumes: [./backend:/app, /app/.venv]
    command: alembic upgrade head
    restart: "no"

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    environment:
      <<: *platform-runtime-weknora-secret-blocks
      STEWARD_BROWSER_CDP_URL: http://browser:9222
      STEWARD_BROWSER_MAX_SESSIONS: ${STEWARD_BROWSER_MAX_SESSIONS:-8}
      STEWARD_BROWSER_MAX_SESSIONS_PER_USER: ${STEWARD_BROWSER_MAX_SESSIONS_PER_USER:-3}
      STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS: ${STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS:-900}
      STEWARD_BROWSER_REAPER_INTERVAL_SECONDS: ${STEWARD_BROWSER_REAPER_INTERVAL_SECONDS:-30}
      # 外部托管的 n8n 实例必须能解析该地址；默认 compose 内网地址仅供
      # n8n 与后端同网部署时使用，跨网部署在 .env 里覆盖为平台公网 origin。
      STEWARD_INTERNAL_PROXY_BASE_URL: ${STEWARD_INTERNAL_PROXY_BASE_URL:-http://backend:8000/api-hub/internal/interfaces}
      PYTHON_KERNEL_GATEWAY_URL: http://python_kernel_gateway:8088
      PYTHON_KERNEL_GATEWAY_AUTH_TOKEN: ${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
      # 流水线任务派发通道，仅 compose 内网可达；宿主机源码运行时使用
      # config/generated/local/.env 中的 NATS_URL（经 4222 宿主端口映射）。
      NATS_URL: nats://nats:4222
      # 本地栈同样只向 backend 暴露正式 WeKnora app 内网地址；管理员/DB/
      # 签名密钥只交给 bootstrap/verify 与 WeKnora 自身。
      WEKNORA_BASE_URL: http://weknora-app:8080
      WEKNORA_WEB_URL: ${WEKNORA_WEB_URL:-http://127.0.0.1:8089}
      WEKNORA_TIMEOUT_SECONDS: ${WEKNORA_TIMEOUT_SECONDS:-15}
      SUPER_ASSISTANT_MCP_INTERNAL_BASE_URLS: http://weknora-app:8080/mcp
      # 本地默认也不在 backend 内直接执行用户插件；协议 fixture 可在
      # 源码测试中显式选择 direct_dev。
      SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE: ${SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE:-disabled}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      weknora-app:
        condition: service_healthy
      weknora-verify:
        condition: service_completed_successfully
      # CDP availability participates in deep readiness and deployment
      # preflight, but does not prevent the API process from starting so an
      # operator can still inspect diagnostics when Chromium is unhealthy.
      browser:
        condition: service_started
    # /app/.venv 匿名卷保留镜像 venv，原因同 migrate 服务。
    volumes: [./backend:/app, /app/.venv, ./uploads:/uploads]
    networks:
      - default
      - weknora_internal
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


  # 流水线调度/手动异步触发的执行者：经 NATS JetStream 消费，与 Web 进程隔离。
  pipeline_executor:
    build: ./backend
    env_file: .env
    environment:
      <<: *platform-runtime-weknora-secret-blocks
      STEWARD_BROWSER_CDP_URL: http://browser:9222
      # 外部托管的 n8n 实例必须能解析该地址；默认 compose 内网地址仅供
      # n8n 与后端同网部署时使用，跨网部署在 .env 里覆盖为平台公网 origin。
      STEWARD_INTERNAL_PROXY_BASE_URL: ${STEWARD_INTERNAL_PROXY_BASE_URL:-http://backend:8000/api-hub/internal/interfaces}
      # executor 会执行整条流水线（含 python 脚本引擎），需要内核网关地址
      PYTHON_KERNEL_GATEWAY_URL: http://python_kernel_gateway:8088
      PYTHON_KERNEL_GATEWAY_AUTH_TOKEN: ${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
      NATS_URL: nats://nats:4222
      WEKNORA_BASE_URL: http://weknora-app:8080
      WEKNORA_WEB_URL: ${WEKNORA_WEB_URL:-http://127.0.0.1:8089}
      WEKNORA_TIMEOUT_SECONDS: ${WEKNORA_TIMEOUT_SECONDS:-15}
      SUPER_ASSISTANT_MCP_INTERNAL_BASE_URLS: http://weknora-app:8080/mcp
      SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE: ${SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE:-disabled}
      # 启用 task-agent profile（task_worker 独占消费任务实例控制面）时置 1，
      # 避免同一 durable 在无 docker.sock 的本进程间负载均衡。
      TASK_INSTANCES_CONTROL_EXCLUDE: ${TASK_INSTANCES_CONTROL_EXCLUDE:-0}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      weknora-app:
        condition: service_healthy
      weknora-verify:
        condition: service_completed_successfully
    # /app/.venv 匿名卷保留镜像 venv，原因同 migrate 服务。
    volumes: [./backend:/app, /app/.venv, ./uploads:/uploads]
    networks:
      - default
      - weknora_internal
    command: python -m app.data_channel.pipeline_tasks.nats_executor
    healthcheck:
      # executor 没有进程内 ping 接口；主循环每 5 秒刷新心跳文件 mtime。
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/nats_executor.heartbeat')<30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 任务实例 agent 执行体（opt-in：--profile task-agent 启用）。
  # 挂载宿主 docker.sock，为每个 agent 节点起 openontology-task-agent 容器；
  # 镜像需先构建：docker build -t openontology-task-agent:local docker/task-agent
  task_worker:
    profiles: ["task-agent"]
    build: ./backend
    env_file: .env
    environment:
      <<: *platform-runtime-weknora-secret-blocks
      NATS_URL: nats://nats:4222
      TASK_INSTANCES_EXECUTOR: docker
      # 控制面独占开关在本服务必须显式归零：共享 .env 的 EXCLUDE 只应
      # 作用于让出方（pipeline_executor），不能把消费者自己也排除
      TASK_INSTANCES_CONTROL_EXCLUDE: "0"
      TASK_AGENT_IMAGE: ${TASK_AGENT_IMAGE:-openontology-task-agent:local}
      TASK_AGENT_NETWORK: ${TASK_AGENT_NETWORK:-bridge}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./uploads:/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    command: python -m app.data_channel.pipeline_tasks.nats_executor
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on: [backend]
    volumes: [./frontend:/app, /app/node_modules]
    command: npm run dev -- --host

volumes:
  pg_data:
  neo4j_data:
  minio_data:
  nats_data:
  weknora_postgres_data:
  weknora_redis_data:
  weknora_data:
  weknora_docreader_tmp:
  weknora_ssl_certs:

networks:
  weknora_internal:
    driver: bridge
