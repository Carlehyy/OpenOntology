services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ontoprompt
      POSTGRES_USER: ontoprompt
      POSTGRES_PASSWORD: ontoprompt
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontoprompt"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ontopromptredis123}
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:alpine
    command: ["-js", "--store_dir", "/data", "-m", "8222"]
    ports: ["4222:4222"]
    volumes: [nats_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.20-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/ontoprompt123
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio_data:/data]
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  browser:
    image: openontology-browser:local
    build:
      context: ./docker/browser
      args:
        BROWSER_BASE_IMAGE: ${BROWSER_IMAGE:-chromedp/headless-shell:latest}
    command: ["--no-sandbox", "--disable-dev-shm-usage"]
    ports: ["9222:9222"]
    shm_size: 2gb
    healthcheck:
      # The browser image intentionally has no curl/wget. Bash's TCP socket
      # support verifies the real CDP endpoint without adding another package.
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222 && printf 'GET /json/version HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'webSocketDebuggerUrl' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Python 脚本流水线的执行网关（Jupyter Kernel Gateway）。用户脚本在其内核
  # 中执行，因此刻意不挂 env_file、不注入任何平台凭据环境变量，也不暴露
  # 宿主机端口——仅 backend 经 compose 内网访问。
  python_kernel_gateway:
    build: ./backend
    command: jupyter kernelgateway --KernelGatewayApp.ip=0.0.0.0 --KernelGatewayApp.port=8088 --KernelGatewayApp.auth_token=${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
    restart: unless-stopped

  migrate:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes: [./backend:/app]
    command: alembic upgrade head
    restart: "no"

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    environment:
      STEWARD_BROWSER_CDP_URL: http://browser:9222
      STEWARD_BROWSER_MAX_SESSIONS: ${STEWARD_BROWSER_MAX_SESSIONS:-8}
      STEWARD_BROWSER_MAX_SESSIONS_PER_USER: ${STEWARD_BROWSER_MAX_SESSIONS_PER_USER:-3}
      STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS: ${STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS:-900}
      STEWARD_BROWSER_REAPER_INTERVAL_SECONDS: ${STEWARD_BROWSER_REAPER_INTERVAL_SECONDS:-30}
      # 外部托管的 n8n 实例必须能解析该地址；默认 compose 内网地址仅供
      # n8n 与后端同网部署时使用，跨网部署在 .env 里覆盖为平台公网 origin。
      STEWARD_INTERNAL_PROXY_BASE_URL: ${STEWARD_INTERNAL_PROXY_BASE_URL:-http://backend:8000/api-hub/internal/interfaces}
      PYTHON_KERNEL_GATEWAY_URL: http://python_kernel_gateway:8088
      PYTHON_KERNEL_GATEWAY_AUTH_TOKEN: ${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
      # 流水线任务派发通道，仅 compose 内网可达；宿主机源码运行时使用
      # config/generated/local/.env 中的 NATS_URL（经 4222 宿主端口映射）。
      NATS_URL: nats://nats:4222
      # 本地默认也不在 backend 内直接执行用户插件；协议 fixture 可在
      # 源码测试中显式选择 direct_dev。
      SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE: ${SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE:-disabled}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # CDP availability participates in deep readiness and deployment
      # preflight, but does not prevent the API process from starting so an
      # operator can still inspect diagnostics when Chromium is unhealthy.
      browser:
        condition: service_started
    volumes: [./backend:/app, ./uploads:/uploads]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


  # 流水线调度/手动异步触发的执行者：经 NATS JetStream 消费，与 Web 进程隔离。
  pipeline_executor:
    build: ./backend
    env_file: .env
    environment:
      STEWARD_BROWSER_CDP_URL: http://browser:9222
      # 外部托管的 n8n 实例必须能解析该地址；默认 compose 内网地址仅供
      # n8n 与后端同网部署时使用，跨网部署在 .env 里覆盖为平台公网 origin。
      STEWARD_INTERNAL_PROXY_BASE_URL: ${STEWARD_INTERNAL_PROXY_BASE_URL:-http://backend:8000/api-hub/internal/interfaces}
      # executor 会执行整条流水线（含 python 脚本引擎），需要内核网关地址
      PYTHON_KERNEL_GATEWAY_URL: http://python_kernel_gateway:8088
      PYTHON_KERNEL_GATEWAY_AUTH_TOKEN: ${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
      NATS_URL: nats://nats:4222
      SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE: ${SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE:-disabled}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes: [./backend:/app, ./uploads:/uploads]
    command: python -m app.data_channel.pipeline_tasks.nats_executor
    healthcheck:
      # executor 没有进程内 ping 接口；主循环每 5 秒刷新心跳文件 mtime。
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/nats_executor.heartbeat')<30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on: [backend]
    volumes: [./frontend:/app, /app/node_modules]
    command: npm run dev -- --host

volumes:
  pg_data:
  neo4j_data:
  minio_data:
  nats_data:
