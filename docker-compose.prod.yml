# Shared WeKnora app definition used by the formal service and the
# temporary registration-open initializer. Never add platform credentials here.
x-weknora-app: &weknora-app-base
  image: ${WEKNORA_APP_IMAGE:?weknora app image is required}
  environment: &weknora-app-environment
    TZ: ${TZ:-Asia/Shanghai}
    GIN_MODE: release
    AUTO_MIGRATE: "true"
    DB_DRIVER: postgres
    RETRIEVE_DRIVER: postgres
    DB_HOST: weknora-db
    DB_PORT: "5432"
    DB_USER: ${WEKNORA_DB_USER:?weknora db user is required}
    DB_PASSWORD: ${WEKNORA_DB_PASSWORD:?weknora db password is required}
    DB_NAME: ${WEKNORA_DB_NAME:?weknora db name is required}
    REDIS_ADDR: weknora-redis:6379
    REDIS_PASSWORD: ${WEKNORA_REDIS_PASSWORD:?weknora redis password is required}
    DOCREADER_ADDR: weknora-docreader:50051
    DOCREADER_TRANSPORT: grpc
    STORAGE_TYPE: local
    LOCAL_STORAGE_BASE_DIR: /data/files
    MAX_FILE_SIZE_MB: ${WEKNORA_MAX_FILE_SIZE_MB:-50}
    JWT_SECRET: ${WEKNORA_JWT_SECRET:?weknora jwt secret is required}
    SYSTEM_AES_KEY: ${WEKNORA_SYSTEM_AES_KEY:?weknora system aes key is required}
    SYSTEM_SIGNING_KEY: ${WEKNORA_SYSTEM_SIGNING_KEY:?weknora signing key is required}
    APP_EXTERNAL_URL: ${WEKNORA_WEB_URL:?weknora web url is required}
    FRONTEND_BASE_URL: ${WEKNORA_WEB_URL:?weknora web url is required}
    WEKNORA_BOOTSTRAP_SYSTEM_ADMIN_EMAIL: ${WEKNORA_ADMIN_EMAIL:-admin@weknora.local}
    WEKNORA_TENANT_ENABLE_RBAC: "true"
    WEKNORA_SANDBOX_DOCKER_ENABLED: "false"
    WEKNORA_TRUSTED_PROXIES: ""
    SSRF_WHITELIST_EXTRA: weknora-app,weknora-docreader
    DISABLE_REGISTRATION: "true"
  volumes:
    - weknora_data:/data/files
    - weknora_docreader_tmp:/tmp/docreader:ro
  depends_on:
    weknora-db:
      condition: service_healthy
    weknora-redis:
      condition: service_healthy
    weknora-docreader:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 90s
  networks:
    - weknora_internal
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

# Docker Compose merges `environment` on top of `env_file`, so an explicit
# empty value is the only way to keep the bootstrap-only WeKnora credentials
# that live in the shared .env out of long-running platform containers. Merge
# this block verbatim into every service that loads .env; the WeKnora stack
# and the one-shot bootstrap keep reading the real values from compose
# interpolation. Only secrets that still exist are masked; the platform never
# needs the WeKnora database, cache or token-signing keys (the administrator
# credentials are the sole SSO-relay exception below). The Hindsight DB
# password and the Control-Plane access key belong to the hindsight stack
# only (the key guards the published admin UI login) and are masked too.
# Two sanctioned exceptions: `backend` re-declares KANEO_ADMIN_PASSWORD and
# WEKNORA_ADMIN_PASSWORD with the real values for the one-click SSO relays
# (explicit keys win over merge keys); every other runtime container keeps the
# empty mask, and the Kaneo/WeKnora DB passwords and auth secrets stay masked
# everywhere.
x-platform-runtime-weknora-secret-blocks: &platform-runtime-weknora-secret-blocks
  WEKNORA_ADMIN_PASSWORD: ""
  WEKNORA_DB_PASSWORD: ""
  WEKNORA_REDIS_PASSWORD: ""
  WEKNORA_JWT_SECRET: ""
  WEKNORA_SYSTEM_AES_KEY: ""
  WEKNORA_SYSTEM_SIGNING_KEY: ""
  KANEO_ADMIN_PASSWORD: ""
  KANEO_DB_PASSWORD: ""
  KANEO_AUTH_SECRET: ""
  HINDSIGHT_DB_PASSWORD: ""
  HINDSIGHT_CP_ACCESS_KEY: ""


services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ontoprompt}
      POSTGRES_USER: ${POSTGRES_USER:-ontoprompt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ontoprompt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ontoprompt} -d $${POSTGRES_DB:-ontoprompt}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    environment:
      # deploy-prod.sh derives this from the bundled REDIS_URL. With an
      # external REDIS_URL it is only a private password for this unused local
      # container and is deliberately not bound to provider credentials.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ontopromptredis123}
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:alpine
    command: ["-js", "--store_dir", "/data", "-m", "8222"]
    volumes: [nats_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/ontoprompt123}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  browser:
    image: openontology-browser:local
    build:
      context: ./docker/browser
      args:
        BROWSER_BASE_IMAGE: ${BROWSER_IMAGE:-chromedp/headless-shell@sha256:2d349b544a1ea6b5b5fd7c0fe99215ff662339c57407ee2e8c0a11af93516b04}
    command: ["--no-sandbox", "--disable-dev-shm-usage"]
    user: "10001:10001"
    read_only: true
    shm_size: 2gb
    # Chromium runs without its own sandbox in this image; keep the container
    # itself least-privileged as a compensating control.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=512m,nosuid,nodev
    healthcheck:
      # The browser image intentionally has no curl/wget. Bash's TCP socket
      # support verifies the real CDP endpoint without adding another package.
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222 && printf 'GET /json/version HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'webSocketDebuggerUrl' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # WeKnora v0.9.0 is the shared knowledge-base service behind the super
  # assistant. It runs as an isolated five-service stack with its own ParadeDB,
  # Redis and document reader; no platform database or graph volume is shared.
  # Graph retrieval is disabled (NEO4J_ENABLE is unset) so the stack has no
  # WeKnora-specific Neo4j; the platform Neo4j above is unrelated. The app is
  # reachable only as http://weknora-app:8080 on the private compose network.
  # The public entry is the gateway service below.
  #
  # The formal app always runs with registration disabled. A separate
  # one-shot profile (`weknora-bootstrap`) starts the same app image once with
  # registration temporarily open, registers the administrator account, and is
  # removed before the formal app starts. deploy-prod.sh then runs
  # `bootstrap --verify`, which logs in as the promoted system admin and
  # persists auth.registration_mode=invite_only through the official settings
  # API (env alone can be overridden by the DB row). Models, knowledge bases
  # and MCP endpoints are configured in the native WeKnora web UI and are not
  # deployment inputs.
  weknora-db:
    image: ${WEKNORA_POSTGRES_IMAGE:?weknora postgres image is required}
    environment:
      POSTGRES_DB: ${WEKNORA_DB_NAME:?weknora db name is required}
      POSTGRES_USER: ${WEKNORA_DB_USER:?weknora db user is required}
      POSTGRES_PASSWORD: ${WEKNORA_DB_PASSWORD:?weknora db password is required}
    volumes:
      - weknora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - weknora_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m

  weknora-redis:
    image: ${WEKNORA_REDIS_IMAGE:?weknora redis image is required}
    environment:
      WEKNORA_REDIS_PASSWORD: ${WEKNORA_REDIS_PASSWORD:?weknora redis password is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${WEKNORA_REDIS_PASSWORD}\""]
    volumes:
      - weknora_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${WEKNORA_REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - weknora_internal
    restart: always

  weknora-docreader:
    image: ${WEKNORA_DOCREADER_IMAGE:?weknora docreader image is required}
    expose:
      - "50051"
    volumes:
      - weknora_docreader_tmp:/tmp/docreader
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      MAX_FILE_SIZE_MB: ${WEKNORA_MAX_FILE_SIZE_MB:-50}
      SSRF_WHITELIST_EXTRA: weknora-app
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - weknora_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Formal app: registration stays closed for the whole public lifetime.
  weknora-app:
    <<: *weknora-app-base
    environment:
      <<: *weknora-app-environment
      DISABLE_REGISTRATION: "true"

  # Temporary initializer. It is profile-gated so a normal compose up never
  # starts a registration-open HTTP surface; deploy-prod.sh removes it before
  # the formal app and public gateway start.
  weknora-app-init:
    <<: *weknora-app-base
    profiles: [weknora-bootstrap]
    environment:
      <<: *weknora-app-environment
      DISABLE_REGISTRATION: "false"
    restart: "no"

  weknora-ui:
    image: ${WEKNORA_UI_IMAGE:?weknora ui image is required}
    expose:
      - "80"
    environment:
      MAX_FILE_SIZE_MB: ${WEKNORA_MAX_FILE_SIZE_MB:-50}
      DEFAULT_LOCALE: ${WEKNORA_DEFAULT_LOCALE:-zh-CN}
      APP_HOST: weknora-app
      APP_PORT: "8080"
      APP_SCHEME: http
    depends_on:
      weknora-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - weknora_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # One-shot account bootstrap / verify. deploy-prod.sh runs it against
  # weknora-app-init first, then again with --verify after the formal app is
  # healthy. It only registers/logs in the administrator and persists the
  # closed registration mode; it creates no model, knowledge base, MCP
  # endpoint or state file. It is the only WeKnora container that sees the
  # admin password.
  weknora-bootstrap:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    profiles: [weknora-bootstrap]
    command: python -m app.super_assistant.weknora.bootstrap
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WEKNORA_BOOTSTRAP_BASE_URL: http://weknora-app-init:8080
      WEKNORA_BASE_URL: http://weknora-app:8080
      WEKNORA_ADMIN_USER: ${WEKNORA_ADMIN_USER:?weknora admin user is required}
      WEKNORA_ADMIN_EMAIL: ${WEKNORA_ADMIN_EMAIL:-admin@weknora.local}
      WEKNORA_ADMIN_PASSWORD: ${WEKNORA_ADMIN_PASSWORD:?weknora admin password is required}
      WEKNORA_TIMEOUT_SECONDS: ${WEKNORA_TIMEOUT_SECONDS:-15}
    networks:
      - weknora_internal
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,nosuid,nodev

  # Public native-web entry. Only the UI is proxied; /mcp/ is explicitly 404.
  # Production reuses the platform self-signed certificate volume, so a fresh
  # deploy has both HTTP 8089 and HTTPS 8444 available without a second cert.
  # The gateway deliberately does not depend on backend, so the native
  # knowledge UI has no reverse dependency on platform startup.
  weknora-gateway:
    image: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${WEKNORA_HTTP_PORT:-8089}:80"
      - "${WEKNORA_HTTPS_PORT:-8444}:443"
    volumes:
      - ./docker/weknora/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/weknora/weknora-proxy.inc:/etc/nginx/weknora-proxy.inc:ro
      - frontend_ssl_certs:/etc/nginx/certs:ro
    depends_on:
      weknora-ui:
        condition: service_healthy
      weknora-app:
        condition: service_healthy
      frontend_ssl_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - weknora_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Kaneo owns its database and native account. Bootstrap completes privately
  # before the public gateway is opened; HTTP only redirects to HTTPS.
  kaneo-db:
    image: ${KANEO_POSTGRES_IMAGE:?kaneo_postgres_image is required}
    environment:
      POSTGRES_DB: ${KANEO_DB_NAME:-kaneo}
      POSTGRES_USER: ${KANEO_DB_USER:-kaneo}
      POSTGRES_PASSWORD: ${KANEO_DB_PASSWORD:?kaneo_db_password is required}
    volumes:
      - kaneo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kaneo_internal
    restart: unless-stopped

  kaneo-app:
    image: ${KANEO_APP_IMAGE:?kaneo_app_image is required}
    environment:
      NODE_ENV: production
      KANEO_CLIENT_URL: ${KANEO_WEB_URL:?kaneo_web_url is required}
      KANEO_API_URL: ${KANEO_WEB_URL:?kaneo_web_url is required}/api
      POSTGRES_HOST: kaneo-db
      POSTGRES_DB: ${KANEO_DB_NAME:-kaneo}
      POSTGRES_USER: ${KANEO_DB_USER:-kaneo}
      POSTGRES_PASSWORD: ${KANEO_DB_PASSWORD:?kaneo_db_password is required}
      AUTH_SECRET: ${KANEO_AUTH_SECRET:?kaneo_auth_secret is required}
      DISABLE_REGISTRATION: "true"
      DISABLE_GUEST_ACCESS: "true"
      DISABLE_EMAIL_OTP_SIGN_IN: "true"
      TRUSTED_PROXIES: 127.0.0.0/8,::1/128
    volumes:
      - kaneo_data:/var/lib/kaneo
    depends_on:
      kaneo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 20
    networks:
      - kaneo_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  kaneo-bootstrap:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    command: ["/bin/sh", "-ec", "python -m app.super_assistant.kaneo.bootstrap && python -m app.super_assistant.kaneo.bootstrap --verify"]
    environment:
      KANEO_BASE_URL: http://kaneo-app:5173
      KANEO_WEB_URL: ${KANEO_WEB_URL:?kaneo_web_url is required}
      KANEO_ADMIN_USER: ${KANEO_ADMIN_USER:-admin}
      KANEO_ADMIN_EMAIL: ${KANEO_ADMIN_EMAIL:-admin@kaneo.local}
      KANEO_ADMIN_PASSWORD: ${KANEO_ADMIN_PASSWORD:?kaneo_admin_password is required}
      KANEO_TIMEOUT_SECONDS: ${KANEO_TIMEOUT_SECONDS:-15}
    depends_on:
      kaneo-app:
        condition: service_healthy
    networks:
      - kaneo_internal
    restart: "no"
    security_opt:
      - no-new-privileges:true

  kaneo-gateway:
    image: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${KANEO_HTTP_PORT:-8090}:80"
      - "${KANEO_HTTPS_PORT:-8445}:443"
    environment:
      KANEO_WEB_URL: ${KANEO_WEB_URL:?kaneo_web_url is required}
    volumes:
      - ./docker/kaneo/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/kaneo/kaneo-proxy.inc:/etc/nginx/kaneo-proxy.inc:ro
      - frontend_ssl_certs:/etc/nginx/certs:ro
    depends_on:
      kaneo-app:
        condition: service_healthy
      kaneo-bootstrap:
        condition: service_completed_successfully
      frontend_ssl_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - kaneo_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Integrated-dataset metadata transport. The image is the already verified
  # official v0.6.53 release digest and is intentionally profile-gated: the
  # automatic deployment starts it only when no explicit external DBX endpoint
  # is configured. It has no published ports and is reachable only by backend
  # on the internal dbx_bridge network.
  dbx:
    image: docker.cnb.cool/dbxio.com/dbx@sha256:b661f7e35deed06d9611dcda79c44ffcc8e4fd0f44308028ea77f7f18b36638c
    pull_policy: missing
    profiles: [integrated-dbx]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    environment:
      DBX_PASSWORD: ${INTEGRATED_DBX_PASSWORD:?integrated dbx password is required}
      DBX_BIND_ADDR: 0.0.0.0
      DBX_DATA_DIR: /app/data
    volumes:
      - dbx_data:/app/data
    networks:
      - dbx_bridge

  # 可选 Hindsight 长期记忆栈（profile `hindsight`，由 deploy-prod.sh 按
  # .env 的 HINDSIGHT_ENABLED 开关）。它不是 backend 的硬依赖：记忆调用失败
  # 只降级记忆特性，聊天与全局 readiness 不受影响，backend 不得把它列为
  # healthy 依赖（其 LLM 回调 backend，构成环）。生产镜像一律 @sha256 钉扎。
  # HINDSIGHT_POSTGRES_IMAGE 默认 pgvector pg17 的多架构 index digest
  # sha256:cf134a76…：amd64+arm64 平台清单已经公共镜像源（pull-through）的
  # OCI index 元数据核验，且本机 arm64 从 Docker Hub 实拉成功；维护环境到
  # registry-1.docker.io 直连不可达，amd64 服务器实拉与「当前 pg17 tag 头
  # digest sha256:7d0a4146…」的官方重取仍是待办——拉取失败时重取并在 .env
  # 覆盖，禁止退回浮动 tag。API（8888）只在 compose 内网；管理 UI（9999 控制
  # 面）经 HINDSIGHT_WEB_PORT（默认 19999）发布到宿主，入口由 deploy-prod.sh
  # 默认推导为 HINDSIGHT_WEB_URL，控制面本身由 HINDSIGHT_CP_ACCESS_KEY 登录
  # 保护（官方机制，未设 key 时控制面完全无认证，生产必须设置）。
  hindsight-db:
    image: ${HINDSIGHT_POSTGRES_IMAGE:-pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f}
    profiles: [hindsight]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - ': "$${POSTGRES_PASSWORD:?HINDSIGHT_DB_PASSWORD is required}"; exec docker-entrypoint.sh postgres'
    environment:
      POSTGRES_DB: ${HINDSIGHT_DB_NAME:-hindsight}
      POSTGRES_USER: ${HINDSIGHT_DB_USER:-hindsight}
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:-}
    volumes:
      - hindsight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - hindsight_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m

  # 一次性缓存卷属主修正：镜像以 uid 1000（hindsight 用户）运行，而新建命名
  # 卷默认 root 属主；不先 chown 的话 embedding 模型下载会 EACCES。有 egress
  # 时由 Hindsight 首启自行下载；无 egress 生产按 docs 预填同一卷后置
  # HINDSIGHT_HF_OFFLINE=1。
  hindsight-model-init:
    image: ${ALPINE_IMAGE:-alpine:3.20}
    profiles: [hindsight]
    command: ["sh", "-c", "mkdir -p /cache/huggingface && chown -R 1000:1000 /cache"]
    volumes:
      - hindsight_model_cache:/cache
    restart: "no"
    security_opt:
      - no-new-privileges:true

  hindsight:
    image: ${HINDSIGHT_IMAGE:-ghcr.io/vectorize-io/hindsight:1.2.0@sha256:19d0c08f3df79acac29384826419a1ca158129e81ec527cdcbd8c97ff4ef76da}
    profiles: [hindsight]
    stop_grace_period: 75s
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - ': "$${HINDSIGHT_API_TENANT_API_KEY:?HINDSIGHT_API_KEY is required}"; : "$${HINDSIGHT_API_LLM_API_KEY:?HINDSIGHT_SERVICE_TOKEN is required}"; exec /app/start-all.sh'
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HINDSIGHT_API_DATABASE_URL: postgresql://${HINDSIGHT_DB_USER:-hindsight}:${HINDSIGHT_DB_PASSWORD:-}@hindsight-db:5432/${HINDSIGHT_DB_NAME:-hindsight}
      # 租户鉴权：backend 必须携带同一 HINDSIGHT_API_KEY（Bearer）；该 key
      # 不是任何真实模型 key。
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_KEY:-}
      # LLM 走平台内部 OpenAI 兼容代理（实际 POST {base}/chat/completions）；
      # key 与 backend HINDSIGHT_SERVICE_TOKEN 同值（内部 service token）。
      # LLM 懒加载：backend 滚动重启不影响 Hindsight 存活。
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: http://backend:8000/api/v2/super-assistant/internal/memory/v1
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_SERVICE_TOKEN:-}
      # Hindsight 1.2.0 禁止 bank 级 llm_model 覆盖；固定平台别名，真实模型由
      # 平台记忆网关按用户 setting 解析（见 docs/operations/configuration.md）。
      HINDSIGHT_API_LLM_MODEL: oo-memory-default
      # embedding 固定字段：多语 intfloat/multilingual-e5-small（ONNX CPU，
      # 384 维，E5 非对称前缀）。模型不在镜像内：首启经 HuggingFace egress
      # 下载并持久化在 hindsight_model_cache 卷；离线环境需预填该卷。
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: onnx
      HINDSIGHT_API_EMBEDDINGS_ONNX_MODEL_ID: intfloat/multilingual-e5-small
      HINDSIGHT_API_EMBEDDINGS_ONNX_FILE: onnx/model.onnx
      HINDSIGHT_API_EMBEDDINGS_ONNX_DIMENSIONS: "384"
      HINDSIGHT_API_EMBEDDINGS_ONNX_QUERY_PREFIX: "query: "
      HINDSIGHT_API_EMBEDDINGS_ONNX_PASSAGE_PREFIX: "passage: "
      # rerank 保持镜像预载默认（hindsight-ai/hs-rerank-1）；中文效果未验证，
      # 属于效果门禁，部署侧不盲目更换模型。
      # 离线/无 egress 环境预填模型缓存后置 1（huggingface_hub 缓存优先）。
      HF_HOME: /hindsight-model-cache
      HF_HUB_OFFLINE: ${HINDSIGHT_HF_OFFLINE:-0}
      # 管理 UI（Control Plane，容器 9999）的官方访问密钥登录：未设置时控制面
      # 对所有可达者完全无认证；生产端口已发布，deploy-prod.sh 强制生成该值。
      HINDSIGHT_CP_ACCESS_KEY: ${HINDSIGHT_CP_ACCESS_KEY:-}
      # CP 的 BFF 在服务端调数据面 API（同容器 localhost:8888）；数据面已启用
      # ApiKeyTenantExtension，必须携带与 backend 相同的 HINDSIGHT_API_KEY，
      # 否则控制台只能登录、无法检索记忆。
      HINDSIGHT_CP_DATAPLANE_API_KEY: ${HINDSIGHT_API_KEY:-}
    ports:
      # 管理 UI 发布到宿主（默认 19999）；API 8888 保持仅内网。入口 URL 由
      # deploy-prod.sh 从 PUBLIC_TLS_IP + HINDSIGHT_WEB_PORT 默认推导。
      - "${HINDSIGHT_WEB_PORT:-19999}:9999"
    volumes:
      - hindsight_model_cache:/hindsight-model-cache
    depends_on:
      hindsight-db:
        condition: service_healthy
      hindsight-model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8888/health/ready', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    # app.* 日志与 backend 同口径轮转，避免长期运行吃满磁盘。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - hindsight_internal
    mem_limit: 2g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=512m,nosuid,nodev

  # Python 脚本流水线的执行网关（Jupyter Kernel Gateway）。用户脚本在其内核
  # 中执行，因此刻意不挂 env_file、不注入任何平台凭据环境变量，也不暴露
  # 宿主机端口——仅 backend 经 compose 内网访问。
  python_kernel_gateway:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    command: jupyter kernelgateway --KernelGatewayApp.ip=0.0.0.0 --KernelGatewayApp.port=8088 --KernelGatewayApp.auth_token=${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
    # This service executes user-authored scripts. Keep it least-privileged
    # even though the application still needs a dedicated sandbox for
    # untrusted process plugins.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,nosuid,nodev
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    # CI must be able to build/validate the immutable image without production
    # secrets.  Runtime deployment is still fail-closed: deploy-prod.sh requires
    # .env and the application rejects insecure production defaults at startup.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *platform-runtime-weknora-secret-blocks
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Empty is intentional and means same-origin only. Existing production
      # .env files therefore do not need a breaking CORS migration.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Retained only so historical local:// objects remain readable during
      # migration. New object writes always require MinIO.
      STORAGE_LOCAL_DIR: /uploads/object-storage
      DATABASE_URL: ${DATABASE_URL:-postgresql://ontoprompt:ontoprompt@db:5432/ontoprompt}
      REDIS_URL: ${REDIS_URL:-redis://:ontopromptredis123@redis:6379/0}
      # 流水线任务派发通道，仅 compose 内网可达，不进入生产依赖清单。
      NATS_URL: nats://nats:4222
      # 用户进程插件在独立 rootless runner 上线前保持关闭；禁止回退到
      # backend/pipeline_executor 内直接 spawn 用户 entrypoint。
      SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE: ${SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE:-disabled}
      ASSISTANT_ACTION_EXECUTION_ENABLED: ${ASSISTANT_ACTION_EXECUTION_ENABLED:-true}
      ASSISTANT_BROWSER_PROTECTED_ORIGINS: ${ASSISTANT_BROWSER_PROTECTED_ORIGINS:-}
      AGENT_QUERY_STATEMENT_TIMEOUT_MS: ${AGENT_QUERY_STATEMENT_TIMEOUT_MS:-3000}
      AGENT_QUERY_LOCK_TIMEOUT_MS: ${AGENT_QUERY_LOCK_TIMEOUT_MS:-1000}
      AGENT_QUERY_WORK_MEM_MIB: ${AGENT_QUERY_WORK_MEM_MIB:-4}
      AGENT_QUERY_TEMP_FILE_LIMIT_MIB: ${AGENT_QUERY_TEMP_FILE_LIMIT_MIB:-32}
      N8N_TIMEOUT_SECONDS: ${N8N_TIMEOUT_SECONDS:-30}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      # WeKnora 只暴露正式 app 的内网地址；DB/Redis/签名密钥只交给 WeKnora
      # 自身与 one-shot bootstrap，不进入常驻 backend/executor 环境（管理员
      # 凭据是下方中继的唯一例外）。
      WEKNORA_BASE_URL: http://weknora-app:8080
      WEKNORA_WEB_URL: ${WEKNORA_WEB_URL:?weknora web url is required}
      WEKNORA_TIMEOUT_SECONDS: ${WEKNORA_TIMEOUT_SECONDS:-15}
      # WeKnora 一键免登录中继（super_assistant/weknora/sso.py）：backend 需要
      # 管理员邮箱/密码做服务端登录换取会话——显式覆盖上方掩码锚点的空值
      # （YAML 显式键优先于 merge 键）；其余运行时容器仍被锚点掩码。凭据仅
      # 用于该跳转，不进日志/接口/前端。
      WEKNORA_ADMIN_EMAIL: ${WEKNORA_ADMIN_EMAIL:-admin@weknora.local}
      WEKNORA_ADMIN_PASSWORD: ${WEKNORA_ADMIN_PASSWORD:?weknora_admin_password is required}
      KANEO_BASE_URL: http://kaneo-app:5173
      KANEO_WEB_URL: ${KANEO_WEB_URL:?kaneo_web_url is required}
      KANEO_TIMEOUT_SECONDS: ${KANEO_TIMEOUT_SECONDS:-15}
      # Kaneo 一键免登录中继（super_assistant/kaneo/sso.py）：backend 需要管理
      # 员邮箱/密码做服务端 sign-in 换取会话 cookie——显式覆盖上方掩码锚点的
      # 空值（YAML 显式键优先于 merge 键）；其余运行时容器仍被锚点掩码。
      # 凭据仅用于该跳转，不进日志/接口/前端。
      KANEO_ADMIN_EMAIL: ${KANEO_ADMIN_EMAIL:-admin@kaneo.local}
      KANEO_ADMIN_PASSWORD: ${KANEO_ADMIN_PASSWORD:?kaneo_admin_password is required}
      # 通用平台内网 MCP 地址（CSV）。WeKnora 的 MCP 端点由原生 UI 手工登记，
      # 平台只读取 app 的 /mcp 前缀，不需要 WeKnora MCP token。
      SUPER_ASSISTANT_MCP_INTERNAL_BASE_URLS: http://weknora-app:8080/mcp
      # 可选 Hindsight 长期记忆（profile `hindsight` + HINDSIGHT_ENABLED）。
      # 默认 compose 内网地址；未启用时快速失败、记忆特性降级，聊天不受影响。
      # 有意不加入 depends_on：Hindsight 的 LLM 回调 backend，属循环依赖。
      HINDSIGHT_BASE_URL: ${HINDSIGHT_BASE_URL:-http://hindsight:8888}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
      HINDSIGHT_TIMEOUT_SECONDS: ${HINDSIGHT_TIMEOUT_SECONDS:-2}
      HINDSIGHT_NAMESPACE: ${HINDSIGHT_NAMESPACE:-openontology}
      HINDSIGHT_SERVICE_TOKEN: ${HINDSIGHT_SERVICE_TOKEN:-}
      # 可选：管理员专用的 Hindsight 原生 Web 入口（服务器 .env 值，空=未启用；
      # 非密钥，其余 env_file 服务亦会继承但不使用）。仅 backend 显式映射并
      # 使用；生产不发布任何 UI 端口。
      HINDSIGHT_WEB_URL: ${HINDSIGHT_WEB_URL:-}
      UPLOADS_DIR: ${UPLOADS_DIR:-/uploads}
      API_HUB_DATA_DIR: /api-hub-data
      STEWARD_WORKSPACE_ROOT: /uploads/steward-sessions
      STEWARD_BROWSER_CDP_URL: http://browser:9222
      STEWARD_BROWSER_ALLOW_PRIVATE_NETWORKS: "false"
      STEWARD_BROWSER_HTTP_LEASE_SECONDS: ${STEWARD_BROWSER_HTTP_LEASE_SECONDS:-30}
      STEWARD_BROWSER_HTTP_FRAME_INTERVAL_MS: ${STEWARD_BROWSER_HTTP_FRAME_INTERVAL_MS:-500}
      STEWARD_BROWSER_MAX_SESSIONS: ${STEWARD_BROWSER_MAX_SESSIONS:-8}
      STEWARD_BROWSER_MAX_SESSIONS_PER_USER: ${STEWARD_BROWSER_MAX_SESSIONS_PER_USER:-3}
      STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS: ${STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS:-900}
      STEWARD_BROWSER_REAPER_INTERVAL_SECONDS: ${STEWARD_BROWSER_REAPER_INTERVAL_SECONDS:-30}
      # 外部托管的 n8n 实例必须能解析该地址；默认 compose 内网地址仅供
      # n8n 与后端同网部署时使用，跨网部署在 .env 里覆盖为平台公网 origin。
      STEWARD_INTERNAL_PROXY_BASE_URL: ${STEWARD_INTERNAL_PROXY_BASE_URL:-http://backend:8000/api-hub/internal/interfaces}
      PIPELINE_FILE_GATEWAY_BASE_URL: ${PIPELINE_FILE_GATEWAY_BASE_URL:-http://backend:8000/api/v2/file-transfer}
      PIPELINE_FILE_PUBLIC_APP_BASE_URL: ${PIPELINE_FILE_PUBLIC_APP_BASE_URL:-http://localhost:5173}
      PIPELINE_FILE_PUBLIC_API_BASE_URL: ${PIPELINE_FILE_PUBLIC_API_BASE_URL:-http://localhost:8000}
      # 远程助手邀请函/回连契约下发给外部 agent 的平台 API 公网地址
      #（deploy-prod.sh 未显式配置时从部署健康地址自动推导）
      SUPER_ASSISTANT_PUBLIC_API_BASE_URL: ${SUPER_ASSISTANT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      PYTHON_KERNEL_GATEWAY_URL: http://python_kernel_gateway:8088
      PYTHON_KERNEL_GATEWAY_AUTH_TOKEN: ${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
      # app.* 应用日志级别（main.py 兜底 handler）：生产如需关闭 INFO 审计
      # 输出（发布/调用记录），覆盖为 WARNING。
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      # 语音听写模型目录（宿主机经 docker compose exec backend python
      # scripts/download_voice_model.py 预下载；缺失时转写接口 503）
      VOICE_MODEL_DIR: /voice-models
      VOICE_MAX_DURATION_SECONDS: ${VOICE_MAX_DURATION_SECONDS:-120}
      VOICE_MAX_BODY_MB: ${VOICE_MAX_BODY_MB:-8}
      VOICE_MAX_CONCURRENT: ${VOICE_MAX_CONCURRENT:-2}
      VOICE_MODEL_DOWNLOAD_BASE: ${VOICE_MODEL_DOWNLOAD_BASE:-https://huggingface.co}
    # app.* 日志走 stderr → json-file；无上限轮转会在长期运行中吃满磁盘
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      # CDP availability participates in deep readiness and deployment
      # preflight, but does not prevent the API process from starting so an
      # operator can still inspect diagnostics when Chromium is unhealthy.
      browser:
        condition: service_started
      # The formal WeKnora app must be healthy before the API can serve tools.
      weknora-app:
        condition: service_healthy
      kaneo-app:
        condition: service_healthy
      kaneo-bootstrap:
        condition: service_completed_successfully
    volumes:
      - uploads:/uploads
      - api_hub_data:/api-hub-data
      - voice_models:/voice-models
    networks:
      - default
      - dbx_bridge
      - weknora_internal
      - kaneo_internal
      - hindsight_internal
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Container hardening is defense in depth; user plugins still require the
    # dedicated rootless runner described in the commercial release gate.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,nosuid,nodev
    healthcheck:
      # Liveness must stay dependency-free.  Deep readiness is checked once by
      # deploy-prod.sh via /api/health; probing every dependency every 15s can
      # amplify a slow downstream service and leak client connections.
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health/live', timeout=5); r.close()\""]
      interval: 15s
      timeout: 10s
      retries: 20
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped


  # 流水线调度/手动异步触发的执行者：经 NATS JetStream 消费，与 Web 进程隔离。
  # 进程被打断的执行由数据库租约（最长 6 小时）+ API 侧对账器收口。
  pipeline_executor:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *platform-runtime-weknora-secret-blocks
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Retained only so historical local:// objects remain readable during
      # migration. New object writes always require MinIO.
      STORAGE_LOCAL_DIR: /uploads/object-storage
      DATABASE_URL: ${DATABASE_URL:-postgresql://ontoprompt:ontoprompt@db:5432/ontoprompt}
      REDIS_URL: ${REDIS_URL:-redis://:ontopromptredis123@redis:6379/0}
      # 流水线任务派发通道，仅 compose 内网可达，不进入生产依赖清单。
      NATS_URL: nats://nats:4222
      # 与 backend 保持一致：runner 未部署时 fail-closed。
      SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE: ${SUPER_ASSISTANT_PROCESS_PLUGIN_RUNNER_MODE:-disabled}
      ASSISTANT_ACTION_EXECUTION_ENABLED: ${ASSISTANT_ACTION_EXECUTION_ENABLED:-true}
      ASSISTANT_BROWSER_PROTECTED_ORIGINS: ${ASSISTANT_BROWSER_PROTECTED_ORIGINS:-}
      AGENT_QUERY_STATEMENT_TIMEOUT_MS: ${AGENT_QUERY_STATEMENT_TIMEOUT_MS:-3000}
      AGENT_QUERY_LOCK_TIMEOUT_MS: ${AGENT_QUERY_LOCK_TIMEOUT_MS:-1000}
      AGENT_QUERY_WORK_MEM_MIB: ${AGENT_QUERY_WORK_MEM_MIB:-4}
      AGENT_QUERY_TEMP_FILE_LIMIT_MIB: ${AGENT_QUERY_TEMP_FILE_LIMIT_MIB:-32}
      N8N_TIMEOUT_SECONDS: ${N8N_TIMEOUT_SECONDS:-30}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      # WeKnora 只暴露正式 app 的内网地址；管理员/DB/Redis/签名密钥只交给
      # WeKnora 自身与 one-shot bootstrap，不进入常驻 backend/executor 环境。
      WEKNORA_BASE_URL: http://weknora-app:8080
      WEKNORA_WEB_URL: ${WEKNORA_WEB_URL:?weknora web url is required}
      WEKNORA_TIMEOUT_SECONDS: ${WEKNORA_TIMEOUT_SECONDS:-15}
      KANEO_BASE_URL: http://kaneo-app:5173
      KANEO_WEB_URL: ${KANEO_WEB_URL:?kaneo_web_url is required}
      KANEO_TIMEOUT_SECONDS: ${KANEO_TIMEOUT_SECONDS:-15}
      # 通用平台内网 MCP 地址（CSV）。WeKnora 的 MCP 端点由原生 UI 手工登记，
      # 平台只读取 app 的 /mcp 前缀，不需要 WeKnora MCP token。
      SUPER_ASSISTANT_MCP_INTERNAL_BASE_URLS: http://weknora-app:8080/mcp
      # 反思链路在 executor 进程内运行，与 backend 共享同一可选记忆配置。
      HINDSIGHT_BASE_URL: ${HINDSIGHT_BASE_URL:-http://hindsight:8888}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
      HINDSIGHT_TIMEOUT_SECONDS: ${HINDSIGHT_TIMEOUT_SECONDS:-2}
      HINDSIGHT_NAMESPACE: ${HINDSIGHT_NAMESPACE:-openontology}
      HINDSIGHT_SERVICE_TOKEN: ${HINDSIGHT_SERVICE_TOKEN:-}
      UPLOADS_DIR: ${UPLOADS_DIR:-/uploads}
      API_HUB_DATA_DIR: /api-hub-data
      STEWARD_WORKSPACE_ROOT: /uploads/steward-sessions
      STEWARD_BROWSER_CDP_URL: http://browser:9222
      STEWARD_BROWSER_ALLOW_PRIVATE_NETWORKS: "false"
      STEWARD_BROWSER_HTTP_LEASE_SECONDS: ${STEWARD_BROWSER_HTTP_LEASE_SECONDS:-30}
      STEWARD_BROWSER_HTTP_FRAME_INTERVAL_MS: ${STEWARD_BROWSER_HTTP_FRAME_INTERVAL_MS:-500}
      STEWARD_BROWSER_MAX_SESSIONS: ${STEWARD_BROWSER_MAX_SESSIONS:-8}
      STEWARD_BROWSER_MAX_SESSIONS_PER_USER: ${STEWARD_BROWSER_MAX_SESSIONS_PER_USER:-3}
      STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS: ${STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS:-900}
      STEWARD_BROWSER_REAPER_INTERVAL_SECONDS: ${STEWARD_BROWSER_REAPER_INTERVAL_SECONDS:-30}
      # 外部托管的 n8n 实例必须能解析该地址；默认 compose 内网地址仅供
      # n8n 与后端同网部署时使用，跨网部署在 .env 里覆盖为平台公网 origin。
      STEWARD_INTERNAL_PROXY_BASE_URL: ${STEWARD_INTERNAL_PROXY_BASE_URL:-http://backend:8000/api-hub/internal/interfaces}
      PIPELINE_FILE_GATEWAY_BASE_URL: ${PIPELINE_FILE_GATEWAY_BASE_URL:-http://backend:8000/api/v2/file-transfer}
      PIPELINE_FILE_PUBLIC_APP_BASE_URL: ${PIPELINE_FILE_PUBLIC_APP_BASE_URL:-http://localhost:5173}
      PIPELINE_FILE_PUBLIC_API_BASE_URL: ${PIPELINE_FILE_PUBLIC_API_BASE_URL:-http://localhost:8000}
      # 远程助手邀请函/回连契约下发给外部 agent 的平台 API 公网地址
      #（deploy-prod.sh 未显式配置时从部署健康地址自动推导）
      SUPER_ASSISTANT_PUBLIC_API_BASE_URL: ${SUPER_ASSISTANT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      # executor 会执行整条流水线（含 python 脚本引擎），需要内核网关地址
      PYTHON_KERNEL_GATEWAY_URL: http://python_kernel_gateway:8088
      PYTHON_KERNEL_GATEWAY_AUTH_TOKEN: ${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
      # 任务实例控制面由 task_worker 独占消费（本进程无 docker.sock）
      TASK_INSTANCES_CONTROL_EXCLUDE: "1"
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      weknora-app:
        condition: service_healthy
      kaneo-app:
        condition: service_healthy
      kaneo-bootstrap:
        condition: service_completed_successfully
    volumes:
      - uploads:/uploads
      - api_hub_data:/api-hub-data
    networks:
      - default
      - weknora_internal
      - kaneo_internal
      - hindsight_internal
    command: python -m app.data_channel.pipeline_tasks.nats_executor
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,nosuid,nodev
    healthcheck:
      # executor 没有进程内 ping 接口；主循环每 5 秒刷新心跳文件 mtime。
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/nats_executor.heartbeat')<30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # 任务实例 agent 执行体：消费 task_instances.control，为每个 agent 节点
  # 起一个 openontology-task-agent 容器（只读 rootfs + bind-mount 工作区 +
  # 模型凭据容器环境注入）。镜像构建：docker build -t openontology-task-agent:local docker/task-agent
  task_worker:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *platform-runtime-weknora-secret-blocks
      ENVIRONMENT: ${ENVIRONMENT:-production}
      STORAGE_LOCAL_DIR: /uploads/object-storage
      DATABASE_URL: ${DATABASE_URL:-postgresql://ontoprompt:ontoprompt@db:5432/ontoprompt}
      REDIS_URL: ${REDIS_URL:-redis://:ontopromptredis123@redis:6379/0}
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      UPLOADS_DIR: ${UPLOADS_DIR:-/uploads}
      # 容器执行体模式 + 执行镜像/网络（egress 默认 bridge，见设计 §6.5）；
      # EXCLUDE 显式归零：共享 .env 的排除只作用于让出方 pipeline_executor
      TASK_INSTANCES_EXECUTOR: docker
      TASK_INSTANCES_CONTROL_EXCLUDE: "0"
      TASK_AGENT_IMAGE: ${TASK_AGENT_IMAGE:-openontology-task-agent:local}
      TASK_AGENT_NETWORK: ${TASK_AGENT_NETWORK:-bridge}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - uploads:/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    command: python -m app.data_channel.pipeline_tasks.nats_executor
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,nosuid,nodev
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/nats_executor.heartbeat')<30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # 自签证书一次性生成：裸 IP 无域名场景的 HTTPS（语音听写等浏览器
  # 安全上下文能力的入口）。证书持久化在卷里，跨部署稳定不变，
  # 浏览器只需在第一次访问时手动信任。
  frontend_ssl_init:
    image: alpine:3.20
    volumes:
      - frontend_ssl_certs:/certs
    environment:
      # SAN 追加的公网 IP（CN 同值）；换服务器时在 .env 覆盖
      PUBLIC_TLS_IP: ${PUBLIC_TLS_IP:-64.83.14.139}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /certs/server.crt ] && [ -f /certs/server.key ]; then
          echo "frontend ssl cert already present, skip generation"
          exit 0
        fi
        apk add --no-cache openssl >/dev/null
        openssl req -x509 -nodes -newkey rsa:2048 -days 3650           -keyout /certs/server.key -out /certs/server.crt           -subj "/CN=$${PUBLIC_TLS_IP}"           -addext "subjectAltName=DNS:localhost,IP:127.0.0.1,IP:$${PUBLIC_TLS_IP}"
        chmod 600 /certs/server.key
        echo "self-signed cert generated for $$PUBLIC_TLS_IP"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${PUBLIC_PORT:-80}:80"
      # 裸 IP 自签 HTTPS 入口（浏览器首次访问需信任一次）
      - "${PUBLIC_HTTPS_PORT:-8443}:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend_ssl_init:
        condition: service_completed_successfully
    volumes:
      - frontend_ssl_certs:/etc/nginx/certs:ro
    healthcheck:
      # BusyBox resolves localhost to ::1 first, while this Nginx image listens
      # on IPv4.  Pin the probe to IPv4 so a healthy public frontend is not
      # permanently misreported as unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  kaneo_postgres_data:
  kaneo_data:
  frontend_ssl_certs:
  voice_models:
  postgres_data:
  neo4j_data:
  minio_data:
  nats_data:
  uploads:
  api_hub_data:
  dbx_data:
  # WeKnora keeps its own database, cache, file and docreader-temp volumes.
  # None of these is shared with the platform services. Graph retrieval is off,
  # so there is no WeKnora-specific Neo4j volume and no integration-state
  # volume (account bootstrap stores nothing on disk).
  weknora_postgres_data:
  weknora_redis_data:
  weknora_data:
  weknora_docreader_tmp:
  # Hindsight keeps its own database volume plus the HuggingFace model cache
  # (embedding model downloads once, then survives redeploys).
  hindsight_postgres_data:
  hindsight_model_cache:

networks:
  kaneo_internal:
    driver: bridge
  # A normal bridge is required: dbx metadata must reach external MySQL/
  # PostgreSQL source databases. Exposure is limited by not publishing ports;
  # backend reaches dbx by service name on this dedicated network.
  dbx_bridge:
    driver: bridge
  # Isolated WeKnora stack. It is a normal bridge (the app needs outbound model
  # calls), but only the gateway publishes host ports; app, docreader, MCP,
  # ParadeDB and Redis have no host port.
  weknora_internal:
    driver: bridge
  # Isolated optional Hindsight stack. Normal bridge (first start downloads the
  # embedding model from HuggingFace and the service calls back into backend);
  # no service on it publishes any host port.
  hindsight_internal:
    driver: bridge
