services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ontoprompt}
      POSTGRES_USER: ${POSTGRES_USER:-ontoprompt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ontoprompt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ontoprompt} -d $${POSTGRES_DB:-ontoprompt}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    environment:
      # deploy-prod.sh derives this from the bundled REDIS_URL. With an
      # external REDIS_URL it is only a private password for this unused local
      # container and is deliberately not bound to provider credentials.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ontopromptredis123}
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:alpine
    command: ["-js", "--store_dir", "/data", "-m", "8222"]
    volumes: [nats_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/ontoprompt123}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  browser:
    image: openontology-browser:local
    build:
      context: ./docker/browser
      args:
        BROWSER_BASE_IMAGE: ${BROWSER_IMAGE:-chromedp/headless-shell:latest}
    command: ["--no-sandbox", "--disable-dev-shm-usage"]
    shm_size: 2gb
    healthcheck:
      # The browser image intentionally has no curl/wget. Bash's TCP socket
      # support verifies the real CDP endpoint without adding another package.
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222 && printf 'GET /json/version HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'webSocketDebuggerUrl' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Python 脚本流水线的执行网关（Jupyter Kernel Gateway）。用户脚本在其内核
  # 中执行，因此刻意不挂 env_file、不注入任何平台凭据环境变量，也不暴露
  # 宿主机端口——仅 backend 经 compose 内网访问。
  python_kernel_gateway:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    command: jupyter kernelgateway --KernelGatewayApp.ip=0.0.0.0 --KernelGatewayApp.port=8088 --KernelGatewayApp.auth_token=${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    # CI must be able to build/validate the immutable image without production
    # secrets.  Runtime deployment is still fail-closed: deploy-prod.sh requires
    # .env and the application rejects insecure production defaults at startup.
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Empty is intentional and means same-origin only. Existing production
      # .env files therefore do not need a breaking CORS migration.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Retained only so historical local:// objects remain readable during
      # migration. New object writes always require MinIO.
      STORAGE_LOCAL_DIR: /uploads/object-storage
      DATABASE_URL: ${DATABASE_URL:-postgresql://ontoprompt:ontoprompt@db:5432/ontoprompt}
      REDIS_URL: ${REDIS_URL:-redis://:ontopromptredis123@redis:6379/0}
      # 流水线任务派发通道，仅 compose 内网可达，不进入生产依赖清单。
      NATS_URL: nats://nats:4222
      N8N_TIMEOUT_SECONDS: ${N8N_TIMEOUT_SECONDS:-30}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      UPLOADS_DIR: ${UPLOADS_DIR:-/uploads}
      API_HUB_DATA_DIR: /api-hub-data
      STEWARD_WORKSPACE_ROOT: /uploads/steward-sessions
      STEWARD_BROWSER_CDP_URL: http://browser:9222
      STEWARD_BROWSER_HTTP_LEASE_SECONDS: ${STEWARD_BROWSER_HTTP_LEASE_SECONDS:-30}
      STEWARD_BROWSER_HTTP_FRAME_INTERVAL_MS: ${STEWARD_BROWSER_HTTP_FRAME_INTERVAL_MS:-500}
      STEWARD_BROWSER_MAX_SESSIONS: ${STEWARD_BROWSER_MAX_SESSIONS:-8}
      STEWARD_BROWSER_MAX_SESSIONS_PER_USER: ${STEWARD_BROWSER_MAX_SESSIONS_PER_USER:-3}
      STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS: ${STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS:-900}
      STEWARD_BROWSER_REAPER_INTERVAL_SECONDS: ${STEWARD_BROWSER_REAPER_INTERVAL_SECONDS:-30}
      # 外部托管的 n8n 实例必须能解析该地址；默认 compose 内网地址仅供
      # n8n 与后端同网部署时使用，跨网部署在 .env 里覆盖为平台公网 origin。
      STEWARD_INTERNAL_PROXY_BASE_URL: ${STEWARD_INTERNAL_PROXY_BASE_URL:-http://backend:8000/api-hub/internal/interfaces}
      PIPELINE_FILE_GATEWAY_BASE_URL: ${PIPELINE_FILE_GATEWAY_BASE_URL:-http://backend:8000/api/v2/file-transfer}
      PIPELINE_FILE_PUBLIC_APP_BASE_URL: ${PIPELINE_FILE_PUBLIC_APP_BASE_URL:-http://localhost:5173}
      PIPELINE_FILE_PUBLIC_API_BASE_URL: ${PIPELINE_FILE_PUBLIC_API_BASE_URL:-http://localhost:8000}
      # 远程助手邀请函/回连契约下发给外部 agent 的平台 API 公网地址
      #（deploy-prod.sh 未显式配置时从部署健康地址自动推导）
      SUPER_ASSISTANT_PUBLIC_API_BASE_URL: ${SUPER_ASSISTANT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      PYTHON_KERNEL_GATEWAY_URL: http://python_kernel_gateway:8088
      PYTHON_KERNEL_GATEWAY_AUTH_TOKEN: ${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      # CDP availability participates in deep readiness and deployment
      # preflight, but does not prevent the API process from starting so an
      # operator can still inspect diagnostics when Chromium is unhealthy.
      browser:
        condition: service_started
    volumes:
      - uploads:/uploads
      - api_hub_data:/api-hub-data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      # Liveness must stay dependency-free.  Deep readiness is checked once by
      # deploy-prod.sh via /api/health; probing every dependency every 15s can
      # amplify a slow downstream service and leak client connections.
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health/live', timeout=5); r.close()\""]
      interval: 15s
      timeout: 10s
      retries: 20
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped


  # 流水线调度/手动异步触发的执行者：经 NATS JetStream 消费，与 Web 进程隔离。
  # 进程被打断的执行由数据库租约（最长 6 小时）+ API 侧对账器收口。
  pipeline_executor:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Retained only so historical local:// objects remain readable during
      # migration. New object writes always require MinIO.
      STORAGE_LOCAL_DIR: /uploads/object-storage
      DATABASE_URL: ${DATABASE_URL:-postgresql://ontoprompt:ontoprompt@db:5432/ontoprompt}
      REDIS_URL: ${REDIS_URL:-redis://:ontopromptredis123@redis:6379/0}
      # 流水线任务派发通道，仅 compose 内网可达，不进入生产依赖清单。
      NATS_URL: nats://nats:4222
      N8N_TIMEOUT_SECONDS: ${N8N_TIMEOUT_SECONDS:-30}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      UPLOADS_DIR: ${UPLOADS_DIR:-/uploads}
      API_HUB_DATA_DIR: /api-hub-data
      STEWARD_WORKSPACE_ROOT: /uploads/steward-sessions
      STEWARD_BROWSER_CDP_URL: http://browser:9222
      STEWARD_BROWSER_HTTP_LEASE_SECONDS: ${STEWARD_BROWSER_HTTP_LEASE_SECONDS:-30}
      STEWARD_BROWSER_HTTP_FRAME_INTERVAL_MS: ${STEWARD_BROWSER_HTTP_FRAME_INTERVAL_MS:-500}
      STEWARD_BROWSER_MAX_SESSIONS: ${STEWARD_BROWSER_MAX_SESSIONS:-8}
      STEWARD_BROWSER_MAX_SESSIONS_PER_USER: ${STEWARD_BROWSER_MAX_SESSIONS_PER_USER:-3}
      STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS: ${STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS:-900}
      STEWARD_BROWSER_REAPER_INTERVAL_SECONDS: ${STEWARD_BROWSER_REAPER_INTERVAL_SECONDS:-30}
      # 外部托管的 n8n 实例必须能解析该地址；默认 compose 内网地址仅供
      # n8n 与后端同网部署时使用，跨网部署在 .env 里覆盖为平台公网 origin。
      STEWARD_INTERNAL_PROXY_BASE_URL: ${STEWARD_INTERNAL_PROXY_BASE_URL:-http://backend:8000/api-hub/internal/interfaces}
      PIPELINE_FILE_GATEWAY_BASE_URL: ${PIPELINE_FILE_GATEWAY_BASE_URL:-http://backend:8000/api/v2/file-transfer}
      PIPELINE_FILE_PUBLIC_APP_BASE_URL: ${PIPELINE_FILE_PUBLIC_APP_BASE_URL:-http://localhost:5173}
      PIPELINE_FILE_PUBLIC_API_BASE_URL: ${PIPELINE_FILE_PUBLIC_API_BASE_URL:-http://localhost:8000}
      # 远程助手邀请函/回连契约下发给外部 agent 的平台 API 公网地址
      #（deploy-prod.sh 未显式配置时从部署健康地址自动推导）
      SUPER_ASSISTANT_PUBLIC_API_BASE_URL: ${SUPER_ASSISTANT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      # executor 会执行整条流水线（含 python 脚本引擎），需要内核网关地址
      PYTHON_KERNEL_GATEWAY_URL: http://python_kernel_gateway:8088
      PYTHON_KERNEL_GATEWAY_AUTH_TOKEN: ${PYTHON_KERNEL_GATEWAY_AUTH_TOKEN:-dev-python-gateway-token}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - uploads:/uploads
      - api_hub_data:/api-hub-data
    command: python -m app.data_channel.pipeline_tasks.nats_executor
    healthcheck:
      # executor 没有进程内 ping 接口；主循环每 5 秒刷新心跳文件 mtime。
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/nats_executor.heartbeat')<30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${PUBLIC_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # BusyBox resolves localhost to ::1 first, while this Nginx image listens
      # on IPv4.  Pin the probe to IPv4 so a healthy public frontend is not
      # permanently misreported as unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  minio_data:
  nats_data:
  uploads:
  api_hub_data:
