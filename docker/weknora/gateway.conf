# Public gateway for the WeKnora native web UI.
#
# Only the official UI service is reachable from here. The WeKnora app and its
# MCP surface stay on the private compose network: the app has no published
# port and every /mcp/ path is rejected at this edge. The UI itself proxies
# /api/ (and other native paths) to the app over the private network.
#
# One sanctioned exception: /sso/entry proxies the platform backend's one-click
# SSO ticket consume route, so the session handoff happens on the WeKnora
# origin (mirrors the Kaneo gateway relay).
#
# TLS uses the platform's frontend_ssl_certs volume in production or a
# locally-generated volume in docker-compose.local.yml.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;

    # Liveness for the edge process only. Deployment readiness must separately
    # verify bootstrap state, MCP discovery and the closed registration mode;
    # a fixed 200 here is never accepted as WeKnora readiness.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # The native UI also exposes public MCP endpoints; this deployment keeps
    # MCP private and reachable only by the platform over the compose network.
    location = /mcp {
        return 404;
    }

    location /mcp/ {
        return 404;
    }

    location /api/v1/local-browser/internal {
        return 404;
    }

    # 一键免登录中继：backend 校验一次性票据并服务端登录 WeKnora，登录
    # 响应经 302 的 #oidc_result= fragment 在本（WeKnora）origin 交给原生
    # 前端落盘。上游地址用变量 + Docker 内嵌 DNS 解析，backend 容器晚于
    # 网关创建时 nginx 仍可启动。
    location = /sso/entry {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $weknora_sso_backend backend:8000;
        proxy_pass http://$weknora_sso_backend/api/v2/super-assistant/weknora/sso/consume$is_args$args;
        include /etc/nginx/weknora-proxy.inc;
    }

    location / {
        proxy_pass http://weknora-ui:80;
        include /etc/nginx/weknora-proxy.inc;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:weknora_ssl:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location = /mcp {
        return 404;
    }

    location /mcp/ {
        return 404;
    }

    location /api/v1/local-browser/internal {
        return 404;
    }

    # 一键免登录中继：backend 校验一次性票据并服务端登录 WeKnora，登录
    # 响应经 302 的 #oidc_result= fragment 在本（WeKnora）origin 交给原生
    # 前端落盘。上游地址用变量 + Docker 内嵌 DNS 解析，backend 容器晚于
    # 网关创建时 nginx 仍可启动。
    location = /sso/entry {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $weknora_sso_backend backend:8000;
        proxy_pass http://$weknora_sso_backend/api/v2/super-assistant/weknora/sso/consume$is_args$args;
        include /etc/nginx/weknora-proxy.inc;
    }

    location / {
        proxy_pass http://weknora-ui:80;
        include /etc/nginx/weknora-proxy.inc;
    }
}
