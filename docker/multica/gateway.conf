# Public gateway for the Multica web UI.
#
# Only the official Next.js web service is reachable from here: the web
# container proxies /api and WebSocket traffic to the Multica API container
# server-side (REMOTE_API_URL), so the browser needs this single HTTPS origin.
# The API container itself publishes no host port and stays on the private
# compose network.
#
# One sanctioned exception: /sso/entry proxies the platform backend's one-click
# entry consume route, so the session handoff happens on the Multica origin
# (mirrors the WeKnora/Kaneo gateway relays).
#
# TLS uses the platform's frontend_ssl_certs volume (same certificate as the
# frontend/WeKnora/Kaneo gateways), so the public origin is the server IP plus
# MULTICA_HTTPS_PORT (default 8446). The loopback web port
# (MULTICA_WEB_PORT/MULTICA_WEB_BIND_ADDR) remains available for SSH tunnels
# and same-host reverse proxies.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Host port 80 is deliberately not published; this listener only serves
    # the container-local healthcheck endpoint.
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:multica_ssl:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # 一键直达中继：backend 校验一次性票据并服务端登录 Multica，会话
    # Set-Cookie 以本（Multica）origin 的第一方响应下发（与 Kaneo 网关的
    # /sso/entry 中继同构）。上游地址用变量 + Docker 内嵌 DNS 解析，backend
    # 容器晚于网关创建时 nginx 仍可启动。
    location = /sso/entry {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $multica_sso_backend backend:8000;
        proxy_pass http://$multica_sso_backend/api/v2/super-assistant/multica/sso/consume$is_args$args;
        include /etc/nginx/multica-proxy.inc;
    }

    location / {
        proxy_pass http://multica-web:3000;
        include /etc/nginx/multica-proxy.inc;
    }
}
