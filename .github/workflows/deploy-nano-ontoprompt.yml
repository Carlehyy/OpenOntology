name: Deploy nano-ontoprompt
on:
  push:
    branches: [nano-ontoprompt]
  workflow_dispatch:
    inputs:
      bootstrap_production_env:
        description: 'Confirm this is a fresh install with no persistent platform data'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  statuses: write
jobs:
  changes:
    # 按改动家族分流，不确定则全量。未知路径、空 diff、手工触发，以及改到
    # 本工作流或分类器本身时，全部验证与部署开关都打开。文档/测试元数据/
    # 纯测试源码不进入部署归档，跳过部署不会放过运行时风险。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_backend: ${{ steps.filter.outputs.run_backend }}
      run_frontend_tests: ${{ steps.filter.outputs.run_frontend_tests }}
      run_frontend_build: ${{ steps.filter.outputs.run_frontend_build }}
      run_docker: ${{ steps.filter.outputs.run_docker }}
      run_deploy: ${{ steps.filter.outputs.run_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check previous push was released or needed no deployment
        id: baseline
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: actions/github-script@v7
        with:
          script: |
            const before = context.payload.before
            if (!/^[0-9a-f]{40}$/.test(before ?? '')) return
            try {
              const { data } = await github.rest.repos.getCombinedStatusForRef({
                ...context.repo, ref: before,
              })
              const status = data.statuses.find(item => item.context === 'openontology/deploy')
              if (status?.state === 'success' && [
                'Production deployment succeeded',
                'Verification succeeded (no deployment needed)',
              ].includes(status.description)) {
                core.setOutput('ready', 'true')
              }
            } catch (error) {
              core.warning(`Could not confirm the previous push status (${error.status ?? 'request failed'})`)
            }

      - name: Classify deployment changes
        id: filter
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          BASELINE_READY: ${{ steps.baseline.outputs.ready }}
        run: |
          set -Eeuo pipefail
          # A concurrent or failed predecessor may leave cumulative changes
          # outside this push's diff. Only narrow the gates on a known baseline.
          if [[ "$BASELINE_READY" == 'true' && "$BEFORE" =~ ^[0-9a-f]{40}$ ]] \
              && git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA"; then
            git diff --name-only --no-renames "$BEFORE" "$GITHUB_SHA" \
              | bash scripts/ci/classify-deploy-changes.sh --stdin
          else
            bash scripts/ci/classify-deploy-changes.sh --full
          fi

  verify-backend:
    needs: changes
    if: needs.changes.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # xdist 并行 + 测试环境低 bcrypt 轮次 + pytest-split 按时长六分片后，单片
    # 回归的墙钟由 runner 侧方差主导（--dist loadfile 整文件打包 + 重文件族
    # 在 CI 放大）：配平表预测约 5 分钟/片，实测 5-13 分钟、重负载时 30+
    # 分钟（09:25 run shard 3 匀速跑满 25 分钟被取消，无单测卡死）。分片配平
    # 数据见 backend/.test_durations；新增测试须全量跑一次 --store-durations
    # 再合入（shard 1 的时长覆盖守卫强制拦截漏记）。上限 40 分钟：覆盖实测
    # 最坏分布，同时仍能掐断真正卡死的任务（真卡死不会被 40 分钟放过来）。
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openontology_ci
          POSTGRES_USER: openontology_ci
          POSTGRES_PASSWORD: openontology_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openontology_ci -d openontology_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen --group dev
        working-directory: backend

      # 新增测试缺时长记录会让 pytest-split 配平失真（已两次导致单片撞
      # timeout 被 cancel、deploy 被跳过），在回归前用收集集差集强制拦截
      - name: Test durations coverage guard
        if: matrix.shard == 1
        run: |
          uv run python - <<'PY'
          import json, subprocess
          collected = subprocess.run(
              ["uv", "run", "pytest", "--collect-only", "-q",
               "--ignore", "tests/v2/perf"],
              capture_output=True, text=True, check=True,
          ).stdout
          ids = {line.strip() for line in collected.splitlines() if "::" in line}
          known = set(json.load(open(".test_durations", encoding="utf-8")))
          missing = sorted(ids - known)
          assert not missing, (
              f"{len(missing)} 个测试缺时长记录：全量跑一次 "
              f"`pytest --store-durations [--clean-durations]` 再合入。"
              f"示例：{missing[:5]}"
          )
          print(f"durations guard OK: {len(ids)} 个测试全部有时长记录")
          PY
        working-directory: backend

      # --store-durations 走默认路径：读入库的 backend/.test_durations 做配平
      # 分片，执行后把本分片实测时长写回（未执行条目保留旧值，结果仍是全表），
      # 随后复制为不带点头的分片文件供 durations-refresh 合并——upload-artifact
      # 对点开头文件有吞没行为，命名必须避开。!cancelled()：shard 1 守卫失败时
      # 回归仍要执行——守卫失败恰恰意味着时长表缺录，正是需要实测数据自愈的
      # 场景。runner 工作区一次性的，覆写 .test_durations 不影响仓库。
      - name: Backend regression suite
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest -q --disable-warnings -n auto --dist loadfile
          --ignore tests/v2/perf --splits=6 --group=${{ matrix.shard }}
          --splitting-algorithm=least_duration
          --store-durations
        working-directory: backend

      - name: Stage shard durations for self-heal
        if: ${{ !cancelled() }}
        run: cp .test_durations "test-durations.shard${{ matrix.shard }}.json"
        working-directory: backend

      # 性能套件测量耗时，保持串行运行以避免并行负载干扰读数。
      - name: Backend performance suite (informational)
        if: matrix.shard == 1
        continue-on-error: true
        run: uv run pytest -q --disable-warnings tests/v2/perf
        working-directory: backend

      - name: Fresh database migration
        if: matrix.shard == 1
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://openontology_ci:openontology_ci@127.0.0.1:5432/openontology_ci
        run: |
          uv run alembic upgrade head
          test "$(uv run alembic heads | grep -c '(head)')" -eq 1
          uv run alembic downgrade 0054_fact_lineage_indexes
          uv run alembic upgrade head
        working-directory: backend

      - name: Ontology assistant PostgreSQL acceptance
        if: matrix.shard == 1
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://openontology_ci:openontology_ci@127.0.0.1:5432/openontology_ci
          OPENONTOLOGY_ONTOLOGY_ASSISTANT_E2E: "1"
        run: |
          mkdir -p ../.artifacts/ontology-assistant
          uv run python scripts/ontology_assistant_postgres_e2e.py --report ../.artifacts/ontology-assistant/query-postgres.json
          uv run python scripts/ontology_action_confirmation_postgres_e2e.py --report ../.artifacts/ontology-assistant/action-postgres.json
        working-directory: backend

      - name: Upload ontology assistant acceptance evidence
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: ontology-assistant-postgres-${{ github.run_id }}
          path: .artifacts/ontology-assistant/
          if-no-files-found: warn
          retention-days: 14

      - name: Operations reports PostgreSQL acceptance
        if: matrix.shard == 1
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://openontology_ci:openontology_ci@127.0.0.1:5432/openontology_ci
          OPENONTOLOGY_OPERATIONS_REPORTS_E2E: "1"
        run: uv run python scripts/operations_reports_postgres_e2e.py --report ../.artifacts/operations-reports/query-postgres.json
        working-directory: backend

      - name: Upload operations reports acceptance evidence
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: operations-reports-postgres-${{ github.run_id }}
          path: .artifacts/operations-reports/query-postgres.json
          if-no-files-found: warn
          retention-days: 14

      - name: Persisted ciphertext secret-split E2E
        if: matrix.shard == 1
        env:
          OPENONTOLOGY_RUNTIME_SECRET_E2E: "1"
          ENVIRONMENT: test
          DATABASE_URL: postgresql://openontology_ci:openontology_ci@127.0.0.1:5432/openontology_ci
        run: |
          mkdir -p ../.artifacts/runtime-secret-migration
          uv run python scripts/runtime_secret_split_postgres_e2e.py --self-test
          uv run python scripts/runtime_secret_split_postgres_e2e.py \
            --report ../.artifacts/runtime-secret-migration/report.json
        working-directory: backend

      - name: Upload runtime-secret migration evidence
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-secret-migration-${{ github.run_id }}
          path: .artifacts/runtime-secret-migration/report.json
          if-no-files-found: error
          retention-days: 14

      # 分片实测时长（含回归失败时的数据）：durations-refresh 的自愈原料。
      # continue-on-error + warn：上传问题绝不影响验证结论。
      - name: Upload shard test durations
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: durations-shard-${{ matrix.shard }}
          path: backend/test-durations.shard${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 3

  verify-frontend-static:
    needs: changes
    if: needs.changes.outputs.run_frontend_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Frontend E2E classification gate
        run: npm run test:e2e:classification

      - name: Frontend feature-boundary gate
        run: npm run check:feature-boundaries

      # 像素尺寸断言规范：禁止对 boundingBox 宽高做精确相等断言。
      - name: Frontend E2E assertion-convention gate
        run: npm run check:e2e-assertions

      - name: Frontend component-convergence gate
        run: npm run check:component-convergence

      - name: Frontend color-token gate
        run: npm run check:color-tokens

      - name: Frontend lint
        run: npm run lint

  verify-frontend-build:
    needs: changes
    if: needs.changes.outputs.run_frontend_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend production build
        run: npm run build
        env:
          # 烧入 HTTPS 入口（裸 IP 自签，缺省与 compose 的 PUBLIC_TLS_IP /
          # PUBLIC_HTTPS_PORT 兜底一致，可用仓库变量覆盖）：SPA 在同主机普通
          # HTTP 页面启动时自动跳转，解锁麦克风等安全上下文能力。主机名不
          # 匹配（localhost / 局域网 / E2E）不生效；机器客户端不经 SPA 不受
          # 影响。换服务器 IP 时除 compose .env 外需同步更新这里（或设置
          # PROD_PUBLIC_TLS_IP / PROD_PUBLIC_HTTPS_PORT 变量）。
          VITE_HTTPS_UPGRADE_HOST: ${{ vars.PROD_PUBLIC_TLS_IP || '64.83.14.139' }}
          VITE_HTTPS_UPGRADE_PORT: ${{ vars.PROD_PUBLIC_HTTPS_PORT || '8443' }}

      # 部署镜像直接使用本 job 构建的 dist，保证上线产物与通过门禁的产物一致，
      # 服务器端不再重复执行 vite build。
      - name: Upload frontend dist for deployment
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  verify-frontend-e2e:
    needs: changes
    if: needs.changes.outputs.run_frontend_tests == 'true'
    runs-on: ubuntu-latest
    # One worker per runner. Retain the existing budget while measuring shard skew.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Frontend offline E2E suite
        run: npm run test:e2e:mocked -- --shard=${{ matrix.shard }}/2

      - name: Upload frontend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-${{ github.run_id }}-attempt-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: .artifacts/playwright
          if-no-files-found: ignore
          retention-days: 14

  verify-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'openontology/deploy',
              description: 'Verification and deployment are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate documentation and repository hygiene
        run: |
          node scripts/ci/check-markdown-links.mjs --self-test
          node scripts/ci/check-markdown-links.mjs
          bash scripts/ci/test-deploy-guards.sh
          bash scripts/ci/check-repository-hygiene.sh

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: config/uv.lock

      - name: Install configuration-center dependencies
        run: uv sync --frozen --group dev
        working-directory: config

      - name: Configuration-center regression suite
        run: uv run pytest -q
        working-directory: config

      - name: Production dependency configuration gate
        # 生产依赖清单不再进入 Git：runner 上由 Repository secrets/variables
        # 原子物化（0600），校验逻辑与 tracked 时代完全一致。
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          PROD_NEO4J_URI: ${{ secrets.PROD_NEO4J_URI }}
          PROD_NEO4J_PASSWORD: ${{ secrets.PROD_NEO4J_PASSWORD }}
          PROD_NEO4J_AUTH: ${{ secrets.PROD_NEO4J_AUTH }}
          PROD_MINIO_ENDPOINT: ${{ secrets.PROD_MINIO_ENDPOINT }}
          PROD_MINIO_ACCESS_KEY: ${{ secrets.PROD_MINIO_ACCESS_KEY }}
          PROD_MINIO_SECRET_KEY: ${{ secrets.PROD_MINIO_SECRET_KEY }}
          PROD_N8N_API_URL: ${{ secrets.PROD_N8N_API_URL }}
          PROD_N8N_API_KEY: ${{ secrets.PROD_N8N_API_KEY }}
          PROD_POSTGRES_DB: ${{ vars.PROD_POSTGRES_DB }}
          PROD_POSTGRES_USER: ${{ vars.PROD_POSTGRES_USER }}
          PROD_NEO4J_USER: ${{ vars.PROD_NEO4J_USER }}
          PROD_PUBLIC_PORT: ${{ vars.PROD_PUBLIC_PORT }}
          PROD_MINIO_USE_SSL: ${{ vars.PROD_MINIO_USE_SSL }}
          PROD_WEKNORA_WEB_URL: ${{ vars.PROD_WEKNORA_WEB_URL }}
          PROD_WEKNORA_ADMIN_USER: ${{ vars.PROD_WEKNORA_ADMIN_USER }}
          PROD_WEKNORA_ADMIN_EMAIL: ${{ vars.PROD_WEKNORA_ADMIN_EMAIL }}
          PROD_WEKNORA_APP_IMAGE: ${{ vars.PROD_WEKNORA_APP_IMAGE }}
          PROD_WEKNORA_UI_IMAGE: ${{ vars.PROD_WEKNORA_UI_IMAGE }}
          PROD_WEKNORA_DOCREADER_IMAGE: ${{ vars.PROD_WEKNORA_DOCREADER_IMAGE }}
          PROD_WEKNORA_POSTGRES_IMAGE: ${{ vars.PROD_WEKNORA_POSTGRES_IMAGE }}
          PROD_WEKNORA_REDIS_IMAGE: ${{ vars.PROD_WEKNORA_REDIS_IMAGE }}
          PROD_KANEO_WEB_URL: ${{ vars.PROD_KANEO_WEB_URL }}
          PROD_KANEO_ADMIN_USER: ${{ vars.PROD_KANEO_ADMIN_USER }}
          PROD_KANEO_ADMIN_EMAIL: ${{ vars.PROD_KANEO_ADMIN_EMAIL }}
          PROD_KANEO_APP_IMAGE: ${{ vars.PROD_KANEO_APP_IMAGE }}
          PROD_KANEO_POSTGRES_IMAGE: ${{ vars.PROD_KANEO_POSTGRES_IMAGE }}
          # Optional Hindsight memory profile: every key is optional; unset
          # values are skipped and deploy-prod.sh generates server-side values.
          PROD_HINDSIGHT_DB_PASSWORD: ${{ secrets.PROD_HINDSIGHT_DB_PASSWORD }}
          PROD_HINDSIGHT_API_KEY: ${{ secrets.PROD_HINDSIGHT_API_KEY }}
          PROD_HINDSIGHT_SERVICE_TOKEN: ${{ secrets.PROD_HINDSIGHT_SERVICE_TOKEN }}
          PROD_HINDSIGHT_IMAGE: ${{ vars.PROD_HINDSIGHT_IMAGE }}
          PROD_HINDSIGHT_POSTGRES_IMAGE: ${{ vars.PROD_HINDSIGHT_POSTGRES_IMAGE }}
          # Optional Multica deployment-level default: the full five-value set
          # (all-five-or-none; a partial set fails the deployment) plus digest
          # image overrides. The bundled stack itself is enabled by default and
          # toggled server-side via MULTICA_ENABLED in .env.
          PROD_MULTICA_DEFAULT_BASE_URL: ${{ vars.PROD_MULTICA_DEFAULT_BASE_URL }}
          PROD_MULTICA_DEFAULT_WEB_URL: ${{ vars.PROD_MULTICA_DEFAULT_WEB_URL }}
          PROD_MULTICA_DEFAULT_WORKSPACE_ID: ${{ vars.PROD_MULTICA_DEFAULT_WORKSPACE_ID }}
          PROD_MULTICA_DEFAULT_WORKSPACE_NAME: ${{ vars.PROD_MULTICA_DEFAULT_WORKSPACE_NAME }}
          PROD_MULTICA_DEFAULT_PAT: ${{ secrets.PROD_MULTICA_DEFAULT_PAT }}
          PROD_MULTICA_DEV_VERIFICATION_CODE: ${{ secrets.PROD_MULTICA_DEV_VERIFICATION_CODE }}
          PROD_MULTICA_SSO_EMAIL: ${{ vars.PROD_MULTICA_SSO_EMAIL }}
          PROD_MULTICA_BACKEND_IMAGE: ${{ vars.PROD_MULTICA_BACKEND_IMAGE }}
          PROD_MULTICA_WEB_IMAGE: ${{ vars.PROD_MULTICA_WEB_IMAGE }}
          PROD_MULTICA_POSTGRES_IMAGE: ${{ vars.PROD_MULTICA_POSTGRES_IMAGE }}
        run: |
          bash scripts/ci/materialize-production-dependencies.sh
          test -s deploy/production.dependencies.env
          trap 'rm -f .env deploy/production.dependencies.env' EXIT
          APP_DIR="${GITHUB_WORKSPACE}" \
            SKIP_GIT=1 \
            BOOTSTRAP_PRODUCTION_ENV=1 \
            DEPLOY_VALIDATE_ONLY=1 \
            HEALTH_URL=http://127.0.0.1/ \
            bash deploy/deploy-prod.sh

  verify-docker-build:
    runs-on: ubuntu-latest
    # Includes the real replica PG/MySQL acceptance after the image canaries;
    # the extra wall clock is bounded by the isolated 7 GB runner.
    timeout-minutes: 45
    # COPY dist 只依赖同一提交的前端构建，可与静态门禁、E2E 和后端回归并行。
    needs: [changes, verify-frontend-build]
    if: >-
      !cancelled() && needs.changes.outputs.run_docker == 'true'
      && needs.verify-frontend-build.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend/dist

      - name: Verify retained Debezium image before building
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          python3 scripts/ci/debezium-image.py check --metadata-only

      - name: Build Docker images
        # Synthetic credentials are confined to the disposable build/canary job.
        env: &service-canary-env
          INTEGRATED_DBX_PASSWORD: ci-only-dbx-compose-interpolation
          WEKNORA_APP_IMAGE: wechatopenai/weknora-app:v0.9.0@sha256:25b20959b7456f7842ef55ed4feff3694dbd0c6f8af4117c1fb3c5dec6bdf14d
          WEKNORA_UI_IMAGE: wechatopenai/weknora-ui:v0.9.0@sha256:df26705d866997db07f3da78dabedc4f594b383566a3996810c166a5c6bee393
          WEKNORA_DOCREADER_IMAGE: wechatopenai/weknora-docreader:v0.9.0@sha256:8c71ec3cc2e291829c3938d2c7dc5f921c1d10551c8774bf844c83bc4aa3cb84
          WEKNORA_POSTGRES_IMAGE: paradedb/paradedb:v0.25.11-pg17@sha256:78d65750f0f88a56548526201bcab9910f83b90fe929cdbf979890f3f80b0f95
          WEKNORA_REDIS_IMAGE: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
          WEKNORA_DB_NAME: ci_weknora
          WEKNORA_DB_USER: ci_weknora
          WEKNORA_DB_PASSWORD: ci-only-weknora-db-password
          WEKNORA_REDIS_PASSWORD: ci-only-weknora-redis-password
          WEKNORA_JWT_SECRET: ci-only-weknora-jwt-secret-for-build
          WEKNORA_SYSTEM_AES_KEY: ci-only-weknora-aes-key-32-bytes
          WEKNORA_SYSTEM_SIGNING_KEY: ci-only-weknora-signing-key-for-build
          WEKNORA_WEB_URL: https://weknora.ci.invalid
          WEKNORA_ADMIN_USER: ci_admin
          WEKNORA_ADMIN_PASSWORD: ci-only-WeKnora-Admin-2026!
          KANEO_APP_IMAGE: ghcr.io/usekaneo/kaneo:2.49.0@sha256:cd1826b1aba3ce736015cadf6f6c975d923aac00f4b6aaa7aedb29bc722dae49
          KANEO_POSTGRES_IMAGE: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          KANEO_DB_NAME: ci_kaneo
          KANEO_DB_USER: ci_kaneo
          KANEO_DB_PASSWORD: ci-only-kaneo-db-password
          KANEO_AUTH_SECRET: ci-only-kaneo-auth-secret-for-build
          KANEO_WEB_URL: https://kaneo.ci.invalid
          KANEO_ADMIN_USER: ci_admin
          KANEO_ADMIN_PASSWORD: ci-only-Kaneo-Admin-2026!
          GRAFANA_IMAGE: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
          GRAFANA_ADMIN_PASSWORD: ci-only-Grafana-Admin-2026!
          # The Multica profile services interpolate their verified digest-pinned
          # defaults from the compose file itself, so no synthetic Multica
          # variable is needed here. CI only builds: the profile is never
          # activated in this job, so no Multica image is pulled or started.
        run: |
          set -Eeuo pipefail
          docker compose -f docker-compose.prod.yml build
          # Rebuild the replica image with the server archive modes (umask 077):
          # both the donor and the final non-root runtime must read the sources.
          trap 'chmod -R go+rX backend/app backend/integrated_runtime' EXIT
          chmod -R go-rwx backend/app backend/integrated_runtime
          docker compose -f docker-compose.prod.yml build integrated_replica_executor
          replica_image="$(docker compose -f docker-compose.prod.yml build --print integrated_replica_executor | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"]["integrated_replica_executor"]["tags"][0])')"
          docker run --rm --network none --read-only --tmpfs /tmp:size=256m,nosuid,nodev \
            -e ENVIRONMENT=test --entrypoint python "$replica_image" \
            -c 'import os; assert os.geteuid() == 10001; from app.data_channel.integrated import cdc_executor, replica_executor; print("non-root executor imports passed")'

      - name: WeKnora isolated service and native MCP canary
        env: *service-canary-env
        run: |
          set -Eeuo pipefail
          evidence="${GITHUB_WORKSPACE}/.artifacts/weknora-canary"
          mkdir -p "$evidence"
          chmod 700 "$evidence"
          export CANARY_EVIDENCE="$evidence"
          export CANARY_COMPOSE="$evidence/compose.json"
          export CANARY_SCRIPT="${GITHUB_WORKSPACE}/backend/scripts/weknora_service_e2e.py"
          export CANARY_BACKEND_IMAGE="$(docker compose -f docker-compose.prod.yml build --print backend | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"]["backend"]["tags"][0])')"
          docker compose -f docker-compose.prod.yml --profile weknora-bootstrap config --format json \
            | python3 -c '
          import json, os, sys
          config = json.load(sys.stdin)
          names = {"weknora-db", "weknora-redis", "weknora-docreader", "weknora-app-init", "weknora-app", "weknora-ui", "weknora-bootstrap"}
          config["services"] = {key: value for key, value in config["services"].items() if key in names}
          bootstrap = config["services"]["weknora-bootstrap"]
          bootstrap.pop("build", None)
          bootstrap.pop("profiles", None)
          bootstrap["image"] = os.environ["CANARY_BACKEND_IMAGE"]
          bootstrap["environment"].update({"ENVIRONMENT": "test", "OPENONTOLOGY_WEKNORA_E2E": "1", "SUPER_ASSISTANT_MCP_INTERNAL_BASE_URLS": "http://weknora-app:8080/mcp", "WEKNORA_E2E_REPORT": "/canary/report.json"})
          bootstrap["volumes"] = [
              {"type": "bind", "source": os.environ["CANARY_EVIDENCE"], "target": "/canary"},
              {"type": "bind", "source": os.environ["CANARY_SCRIPT"], "target": "/app/scripts/weknora_service_e2e.py", "read_only": True},
          ]
          config.pop("name", None)
          volumes = {mount["source"] for service in config["services"].values() for mount in service.get("volumes", []) if mount["type"] == "volume"}
          config["volumes"] = {key: {field: value for field, value in config["volumes"][key].items() if field != "name"} for key in volumes}
          config["networks"] = {"weknora_internal": {"driver": "bridge"}}
          assert not any(service.get("ports") for service in config["services"].values())
          json.dump(config, open(os.environ["CANARY_COMPOSE"], "w"))
          '
          canary() { docker compose -p "weknora-canary-${GITHUB_RUN_ID}" -f "$CANARY_COMPOSE" --profile weknora-bootstrap "$@"; }
          trap 'canary down --volumes --remove-orphans >/dev/null' EXIT
          canary up -d --wait --wait-timeout 300 weknora-app-init
          canary run --rm --no-deps weknora-bootstrap python -m app.super_assistant.weknora.bootstrap
          canary rm -sf weknora-app-init
          canary up -d --wait --wait-timeout 300 weknora-app weknora-ui
          canary run --rm --no-deps weknora-bootstrap python -m app.super_assistant.weknora.bootstrap --verify
          canary run --rm --no-deps --user "$(id -u):$(id -g)" weknora-bootstrap python scripts/weknora_service_e2e.py

      - name: Upload WeKnora canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weknora-canary-${{ github.run_id }}
          path: .artifacts/weknora-canary/report.json
          if-no-files-found: warn
          retention-days: 14

      # Kaneo canary mirrors the WeKnora slice pattern: only kaneo-db/kaneo-app/
      # kaneo-bootstrap are started on an isolated project and network; no other
      # service (and no public port) participates. DISABLE_REGISTRATION stays
      # true everywhere because an empty Kaneo instance still allows creating
      # the first administrator.
      - name: Kaneo isolated service and bootstrap canary
        env: *service-canary-env
        run: |
          set -Eeuo pipefail
          evidence="${GITHUB_WORKSPACE}/.artifacts/kaneo-canary"
          mkdir -p "$evidence"
          chmod 700 "$evidence"
          export CANARY_EVIDENCE="$evidence"
          export CANARY_COMPOSE="$evidence/compose.json"
          export CANARY_SCRIPT="${GITHUB_WORKSPACE}/backend/scripts/kaneo_service_e2e.py"
          export CANARY_BACKEND_IMAGE="$(docker compose -f docker-compose.prod.yml build --print backend | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"]["backend"]["tags"][0])')"
          docker compose -f docker-compose.prod.yml --profile kaneo-bootstrap config --format json \
            | python3 -c '
          import json, os, sys
          config = json.load(sys.stdin)
          names = {"kaneo-db", "kaneo-app", "kaneo-bootstrap"}
          config["services"] = {key: value for key, value in config["services"].items() if key in names}
          bootstrap = config["services"]["kaneo-bootstrap"]
          bootstrap.pop("build", None)
          bootstrap.pop("profiles", None)
          bootstrap["image"] = os.environ["CANARY_BACKEND_IMAGE"]
          bootstrap["environment"].update({"ENVIRONMENT": "test", "OPENONTOLOGY_KANEO_E2E": "1", "KANEO_E2E_REPORT": "/canary/report.json"})
          bootstrap["volumes"] = [
              {"type": "bind", "source": os.environ["CANARY_EVIDENCE"], "target": "/canary"},
              {"type": "bind", "source": os.environ["CANARY_SCRIPT"], "target": "/app/scripts/kaneo_service_e2e.py", "read_only": True},
          ]
          config.pop("name", None)
          volumes = {mount["source"] for service in config["services"].values() for mount in service.get("volumes", []) if mount["type"] == "volume"}
          config["volumes"] = {key: {field: value for field, value in config["volumes"][key].items() if field != "name"} for key in volumes}
          config["networks"] = {"kaneo_internal": {"driver": "bridge"}}
          assert not any(service.get("ports") for service in config["services"].values())
          json.dump(config, open(os.environ["CANARY_COMPOSE"], "w"))
          '
          canary() { docker compose -p "kaneo-canary-${GITHUB_RUN_ID}" -f "$CANARY_COMPOSE" --profile kaneo-bootstrap "$@"; }
          trap 'canary down --volumes --remove-orphans >/dev/null' EXIT
          canary up -d --wait --wait-timeout 420 kaneo-app
          canary run --rm --no-deps kaneo-bootstrap python -m app.super_assistant.kaneo.bootstrap
          canary run --rm --no-deps kaneo-bootstrap python -m app.super_assistant.kaneo.bootstrap --verify
          canary run --rm --no-deps --user "$(id -u):$(id -g)" kaneo-bootstrap python scripts/kaneo_service_e2e.py --create
          # Restart the private stack to prove the created workspace/project/task
          # fixtures persist in the Kaneo database before re-reading their IDs.
          canary stop kaneo-app kaneo-db
          canary up -d --wait --wait-timeout 420 kaneo-app
          canary run --rm --no-deps --user "$(id -u):$(id -g)" kaneo-bootstrap python scripts/kaneo_service_e2e.py --verify-persisted

      - name: Upload Kaneo canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaneo-canary-${{ github.run_id }}
          path: .artifacts/kaneo-canary/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Integrated replica acceptance (real PG/MySQL)
        env: *service-canary-env
        run: |
          set -Eeuo pipefail
          bash scripts/ci/test-integrated-replica-acceptance.sh

      - name: Upload integrated replica acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-replica-acceptance-${{ github.run_id }}
          path: .artifacts/ci-replicaacceptance
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: [changes, verify-backend, verify-frontend-static, verify-frontend-build, verify-frontend-e2e, verify-gates, verify-docker-build]
    # 只有分类器打开 run_deploy 且所有要求的验证通过才上线。
    if: >-
      !cancelled() && needs.changes.result == 'success'
      && needs.verify-gates.result == 'success'
      && needs.changes.outputs.run_deploy == 'true'
      && (needs.changes.outputs.run_backend != 'true'
          || needs.verify-backend.result == 'success')
      && (needs.changes.outputs.run_frontend_tests != 'true'
          || (needs.verify-frontend-static.result == 'success'
              && needs.verify-frontend-e2e.result == 'success'))
      && (needs.changes.outputs.run_frontend_build != 'true'
          || needs.verify-frontend-build.result == 'success')
      && (needs.changes.outputs.run_docker != 'true'
          || needs.verify-docker-build.result == 'success')
    # Hold the same lock from source replacement through migrations/readiness.
    # An older validation finishing late must not evict the current tip's job.
    concurrency:
      group: deploy-nano-ontoprompt
      cancel-in-progress: false
      queue: max
    outputs:
      superseded: ${{ steps.tip.outputs.superseded }}
      release_result: ${{ steps.release.outcome }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    # 服务器低配盘的冷构建实测约 28 分钟，服务初始化、迁移与重启另需约
    # 15 分钟；run 44684037622 在 Multica 首次启动时撞上 SSH 45 分钟上限。
    # SSH 预算为 60 分钟，job 另留 15 分钟供归档上传、校验和清理使用。
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Check production branch tip under the deployment lock
        id: tip
        uses: actions/github-script@v7
        with:
          script: |
            const branch = 'nano-ontoprompt'
            const ref = `refs/heads/${branch}`
            if (context.ref !== ref) {
              throw new Error(`Production deployment requires ${ref}`)
            }
            const { execFileSync } = require('node:child_process')
            const remote = execFileSync('git', ['ls-remote', '--exit-code', 'origin', ref], {
              encoding: 'utf8', timeout: 30000,
            }).trim()
            const [tip, remoteRef] = remote.split('\t')
            if (!/^[0-9a-f]{40}$/.test(tip) || remoteRef !== ref) {
              throw new Error('Could not confirm the production branch tip')
            }
            if (tip === context.sha) {
              core.setOutput('current', 'true')
              return
            }

            // An absent/cancelled replacement (e.g. a skip-CI push) must not
            // turn a skipped release into a silent success.
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'deploy-nano-ontoprompt.yml', branch, head_sha: tip,
            })
            const replacement = data.workflow_runs.find(run =>
              run.head_sha === tip && ['push', 'workflow_dispatch'].includes(run.event)
              && (['queued', 'in_progress', 'pending', 'requested', 'waiting'].includes(run.status)
                  || run.conclusion === 'success'))
            if (!replacement) {
              throw new Error(`Production branch advanced to ${tip}, with no pending or successful deployment workflow`)
            }
            core.notice(`Superseded by ${tip} (workflow run ${replacement.id}); no production changes made`)
            core.setOutput('superseded', 'true')

      - name: Download frontend dist
        if: steps.tip.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend/dist

      - name: Check deployment secrets
        if: steps.tip.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD secret is required}"
          APP_DIR="${DEPLOY_APP_DIR:-/opt/openontology}"
          bash "${GITHUB_WORKSPACE}/scripts/ci/validate-deploy-app-dir.sh" "${APP_DIR}"
          if [ -n "${DEPLOY_HOST}" ]; then echo "DEPLOY_HOST configured: yes"; else echo "DEPLOY_HOST configured: no"; fi
          if [ -n "${DEPLOY_USER}" ]; then echo "DEPLOY_USER configured: yes"; else echo "DEPLOY_USER configured: no"; fi
          if [ -n "${DEPLOY_PASSWORD}" ]; then echo "DEPLOY_PASSWORD configured: yes"; else echo "DEPLOY_PASSWORD configured: no"; fi
          echo "DEPLOY_APP_DIR validated: yes"

      - name: Trust deployment host
        if: steps.tip.outputs.current == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Materialize production dependency manifest
        if: steps.tip.outputs.current == 'true'
        # 归档脚本与远端替换继续要求 deploy/production.dependencies.env 存在；
        # 在 runner 上从 Repository secrets/variables 物化，仓库本体不再携带。
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          PROD_NEO4J_URI: ${{ secrets.PROD_NEO4J_URI }}
          PROD_NEO4J_PASSWORD: ${{ secrets.PROD_NEO4J_PASSWORD }}
          PROD_NEO4J_AUTH: ${{ secrets.PROD_NEO4J_AUTH }}
          PROD_MINIO_ENDPOINT: ${{ secrets.PROD_MINIO_ENDPOINT }}
          PROD_MINIO_ACCESS_KEY: ${{ secrets.PROD_MINIO_ACCESS_KEY }}
          PROD_MINIO_SECRET_KEY: ${{ secrets.PROD_MINIO_SECRET_KEY }}
          PROD_N8N_API_URL: ${{ secrets.PROD_N8N_API_URL }}
          PROD_N8N_API_KEY: ${{ secrets.PROD_N8N_API_KEY }}
          PROD_POSTGRES_DB: ${{ vars.PROD_POSTGRES_DB }}
          PROD_POSTGRES_USER: ${{ vars.PROD_POSTGRES_USER }}
          PROD_NEO4J_USER: ${{ vars.PROD_NEO4J_USER }}
          PROD_PUBLIC_PORT: ${{ vars.PROD_PUBLIC_PORT }}
          PROD_MINIO_USE_SSL: ${{ vars.PROD_MINIO_USE_SSL }}
          PROD_WEKNORA_WEB_URL: ${{ vars.PROD_WEKNORA_WEB_URL }}
          PROD_WEKNORA_ADMIN_USER: ${{ vars.PROD_WEKNORA_ADMIN_USER }}
          PROD_WEKNORA_ADMIN_EMAIL: ${{ vars.PROD_WEKNORA_ADMIN_EMAIL }}
          PROD_WEKNORA_APP_IMAGE: ${{ vars.PROD_WEKNORA_APP_IMAGE }}
          PROD_WEKNORA_UI_IMAGE: ${{ vars.PROD_WEKNORA_UI_IMAGE }}
          PROD_WEKNORA_DOCREADER_IMAGE: ${{ vars.PROD_WEKNORA_DOCREADER_IMAGE }}
          PROD_WEKNORA_POSTGRES_IMAGE: ${{ vars.PROD_WEKNORA_POSTGRES_IMAGE }}
          PROD_WEKNORA_REDIS_IMAGE: ${{ vars.PROD_WEKNORA_REDIS_IMAGE }}
          PROD_KANEO_WEB_URL: ${{ vars.PROD_KANEO_WEB_URL }}
          PROD_KANEO_ADMIN_USER: ${{ vars.PROD_KANEO_ADMIN_USER }}
          PROD_KANEO_ADMIN_EMAIL: ${{ vars.PROD_KANEO_ADMIN_EMAIL }}
          PROD_KANEO_APP_IMAGE: ${{ vars.PROD_KANEO_APP_IMAGE }}
          PROD_KANEO_POSTGRES_IMAGE: ${{ vars.PROD_KANEO_POSTGRES_IMAGE }}
          # Optional Hindsight memory profile: every key is optional; unset
          # values are skipped and deploy-prod.sh generates server-side values.
          PROD_HINDSIGHT_DB_PASSWORD: ${{ secrets.PROD_HINDSIGHT_DB_PASSWORD }}
          PROD_HINDSIGHT_API_KEY: ${{ secrets.PROD_HINDSIGHT_API_KEY }}
          PROD_HINDSIGHT_SERVICE_TOKEN: ${{ secrets.PROD_HINDSIGHT_SERVICE_TOKEN }}
          PROD_HINDSIGHT_IMAGE: ${{ vars.PROD_HINDSIGHT_IMAGE }}
          PROD_HINDSIGHT_POSTGRES_IMAGE: ${{ vars.PROD_HINDSIGHT_POSTGRES_IMAGE }}
          # Optional Multica deployment-level default: the full five-value set
          # (all-five-or-none; a partial set fails the deployment) plus digest
          # image overrides. The bundled stack itself is enabled by default and
          # toggled server-side via MULTICA_ENABLED in .env.
          PROD_MULTICA_DEFAULT_BASE_URL: ${{ vars.PROD_MULTICA_DEFAULT_BASE_URL }}
          PROD_MULTICA_DEFAULT_WEB_URL: ${{ vars.PROD_MULTICA_DEFAULT_WEB_URL }}
          PROD_MULTICA_DEFAULT_WORKSPACE_ID: ${{ vars.PROD_MULTICA_DEFAULT_WORKSPACE_ID }}
          PROD_MULTICA_DEFAULT_WORKSPACE_NAME: ${{ vars.PROD_MULTICA_DEFAULT_WORKSPACE_NAME }}
          PROD_MULTICA_DEFAULT_PAT: ${{ secrets.PROD_MULTICA_DEFAULT_PAT }}
          PROD_MULTICA_DEV_VERIFICATION_CODE: ${{ secrets.PROD_MULTICA_DEV_VERIFICATION_CODE }}
          PROD_MULTICA_SSO_EMAIL: ${{ vars.PROD_MULTICA_SSO_EMAIL }}
          PROD_MULTICA_BACKEND_IMAGE: ${{ vars.PROD_MULTICA_BACKEND_IMAGE }}
          PROD_MULTICA_WEB_IMAGE: ${{ vars.PROD_MULTICA_WEB_IMAGE }}
          PROD_MULTICA_POSTGRES_IMAGE: ${{ vars.PROD_MULTICA_POSTGRES_IMAGE }}
        run: |
          bash scripts/ci/materialize-production-dependencies.sh
          test -s deploy/production.dependencies.env

      - name: Generate backend runtime source manifest
        if: steps.tip.outputs.current == 'true'
        # The manifest is generated from Git objects at the exact workflow SHA,
        # never from an arbitrary dirty worktree. It is packaged into the
        # deployment archive below so the existing archive digest binds it.
        run: |
          : "${GITHUB_SHA:?GITHUB_SHA is required}"
          printf '%s' "${GITHUB_SHA}" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "GITHUB_SHA must be a full lowercase commit"; exit 1; }
          HEAD_SHA="$(git rev-parse HEAD)"
          test "${HEAD_SHA}" = "${GITHUB_SHA}" \
            || { echo "checkout HEAD ${HEAD_SHA} does not match GITHUB_SHA ${GITHUB_SHA}"; exit 1; }
          python3 deploy/runtime_source_attestation.py generate \
            --repo "${GITHUB_WORKSPACE}" \
            --commit "${GITHUB_SHA}" \
            --output deploy/runtime-source-manifest.json
          test -s deploy/runtime-source-manifest.json
          echo "runtime source manifest sha256: $(sha256sum deploy/runtime-source-manifest.json | awk '{print $1}') (commit ${GITHUB_SHA})"

      - name: Upload source to server
        if: steps.tip.outputs.current == 'true'
        timeout-minutes: 10
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD secret is required}"
          APP_DIR="${DEPLOY_APP_DIR:-/opt/openontology}"
          bash "${GITHUB_WORKSPACE}/scripts/ci/validate-deploy-app-dir.sh" "${APP_DIR}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          bash scripts/ci/create-deployment-archive.sh /tmp/openontology.tar.gz
          ARCHIVE_SHA256="$(sha256sum /tmp/openontology.tar.gz | awk '{print $1}')"
          printf '%s' "${ARCHIVE_SHA256}" | grep -Eq '^[0-9a-f]{64}$' || { echo "deployment archive sha256 malformed"; exit 1; }
          echo "deployment package sha256: ${ARCHIVE_SHA256} (commit ${GITHUB_SHA})"
          REMOTE_ARCHIVE="/tmp/openontology.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tar.gz"
          sshpass -p "${DEPLOY_PASSWORD}" scp -o StrictHostKeyChecking=yes -o ConnectTimeout=20 /tmp/openontology.tar.gz "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_ARCHIVE}"
          # Keep the persistent .env in place throughout source replacement.
          # An interrupted upload can remove code, but can never strand or
          # restore a stale copy of the encryption authority from /tmp.
          sshpass -p "${DEPLOY_PASSWORD}" ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- '${APP_DIR}' '${REMOTE_ARCHIVE}' '${ARCHIVE_SHA256}'" <<'REMOTE_SOURCE_SWAP'
          set -Eeuo pipefail
          APP_DIR="$1"
          REMOTE_ARCHIVE="$2"
          EXPECTED_SHA256="$3"
          umask 077
          trap 'rm -f "$REMOTE_ARCHIVE"' EXIT
          chmod 600 "$REMOTE_ARCHIVE"
          ACTUAL_SHA256="$(sha256sum "${REMOTE_ARCHIVE}" | awk '{print $1}')"
          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "deployment archive sha256 mismatch (expected ${EXPECTED_SHA256}, got ${ACTUAL_SHA256}); refusing to extract"
            exit 1
          fi
          echo "deployment archive sha256 verified: ${ACTUAL_SHA256}"
          tar -tzf "$REMOTE_ARCHIVE" >/dev/null
          if [ -L "$APP_DIR" ]; then
            echo "DEPLOY_APP_DIR must be a real directory, not a symlink"
            exit 1
          fi
          if [ -L "$APP_DIR/.env" ]; then
            echo "production .env must be a regular file, not a symlink"
            exit 1
          fi
          mkdir -p "$APP_DIR"
          find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf -- {} +
          tar --extract --gzip --file "$REMOTE_ARCHIVE" \
            --directory "$APP_DIR" --no-same-permissions --no-same-owner
          # The restrictive umask protects the dependency manifest and other
          # extracted files, but the prebuilt frontend assets are copied into
          # the image with host modes preserved and must stay readable by the
          # unprivileged nginx worker.
          chmod -R a+rX "$APP_DIR/frontend/dist"
          test -f "$APP_DIR/deploy/production.dependencies.env"
          chmod 600 "$APP_DIR/deploy/production.dependencies.env"
          if [ -f "$APP_DIR/.env" ] && [ ! -L "$APP_DIR/.env" ]; then
            chmod 600 "$APP_DIR/.env"
          fi
          REMOTE_SOURCE_SWAP

      - name: Deploy over SSH
        id: release
        if: steps.tip.outputs.current == 'true'
        timeout-minutes: 60
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
          BOOTSTRAP_PRODUCTION_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_production_env && '1' || '0' }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD secret is required}"
          APP_DIR="${DEPLOY_APP_DIR:-/opt/openontology}"
          bash "${GITHUB_WORKSPACE}/scripts/ci/validate-deploy-app-dir.sh" "${APP_DIR}"
          if [ -n "${DEPLOY_HEALTH_URL}" ]; then
            HEALTH_URL="${DEPLOY_HEALTH_URL}"
          else
            PUBLIC_PORT="$(
              awk -F= '$1 == "PUBLIC_PORT" {
                value = substr($0, index($0, "=") + 1)
              } END {
                sub(/\r$/, "", value)
                print value
              }' deploy/production.dependencies.env
            )"
            PUBLIC_PORT="${PUBLIC_PORT:-80}"
            case "${PUBLIC_PORT}" in
              *[!0-9]*)
                echo "PUBLIC_PORT must be an integer between 1 and 65535"
                exit 1
                ;;
            esac
            if [ "${PUBLIC_PORT}" -lt 1 ] || [ "${PUBLIC_PORT}" -gt 65535 ]; then
              echo "PUBLIC_PORT must be an integer between 1 and 65535"
              exit 1
            fi
            if [ "${PUBLIC_PORT}" -eq 80 ]; then
              HEALTH_URL="http://${DEPLOY_HOST}/"
            else
              HEALTH_URL="http://${DEPLOY_HOST}:${PUBLIC_PORT}/"
            fi
          fi
          case "${HEALTH_URL}" in
            http://*|https://*) ;;
            *)
              echo "DEPLOY_HEALTH_URL must use an HTTP(S) URL"
              exit 1
              ;;
          esac
          if [[ "${HEALTH_URL}" == *"'"* || "${HEALTH_URL}" =~ [[:space:]] ]]; then
            echo "DEPLOY_HEALTH_URL must not contain quotes or whitespace"
            exit 1
          fi
          printf '%s' "${GITHUB_SHA}" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "GITHUB_SHA must be a full lowercase commit"; exit 1; }
          sshpass -p "${DEPLOY_PASSWORD}" ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '${APP_DIR}' && APP_DIR='${APP_DIR}' SKIP_GIT=1 EXPECTED_RUNTIME_COMMIT='${GITHUB_SHA}' BOOTSTRAP_PRODUCTION_ENV='${BOOTSTRAP_PRODUCTION_ENV}' HEALTH_URL='${HEALTH_URL}' bash deploy/deploy-prod.sh"

      - name: Remove runner deployment archive
        if: ${{ always() }}
        run: rm -f /tmp/openontology.tar.gz deploy/production.dependencies.env deploy/runtime-source-manifest.json

  durations-refresh:
    # 时长表自愈：合并 verify-backend 各分片的实测时长，仅当测试集键集发生
    # 结构变化（新增缺录/已删残留）时回写 .test_durations 并维护一个滚动 PR。
    # 刻意独立于 deploy/report 关键路径：本 job 任何失败都不阻塞部署（job 级
    # continue-on-error），且未列入 report 的结果聚合。分支推送不触发部署
    # 工作流（on.push 仅 nano-ontoprompt），PR 合并才随正常流程生效。
    needs: [changes, verify-backend]
    if: ${{ !cancelled() && needs.changes.outputs.run_backend == 'true' && needs.verify-backend.result != 'skipped' }}
    concurrency:
      group: deployment-test-durations-refresh
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download shard durations
        uses: actions/download-artifact@v4
        with:
          pattern: durations-shard-*
          path: shard-durations
          merge-multiple: true

      - name: Merge shard durations and detect structural drift
        id: merge
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import glob, json, os, sys
          files = sorted(glob.glob('shard-durations/test-durations.shard*.json'))
          if len(files) != 6:
              print(f'分片时长不完整（{len(files)}/6，可能有分片未跑到回归），跳过自愈')
              sys.exit(0)
          merged = {}
          for path in files:
              merged.update(json.load(open(path, encoding='utf-8')))
          committed = json.load(open('backend/.test_durations', encoding='utf-8'))
          added = sorted(set(merged) - set(committed))
          removed = sorted(set(committed) - set(merged))
          if not added and not removed:
              print('时长表键集无结构变化（纯数值漂移不回写），跳过')
              sys.exit(0)
          with open('backend/.test_durations', 'w', encoding='utf-8') as f:
              json.dump(merged, f, indent=2, sort_keys=True)
              f.write('\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('refresh=true\n')
          print(f'结构变化：新增缺录 {len(added)} / 已删残留 {len(removed)}，回写 {len(merged)} 条实测时长')
          PY

      - name: Open rolling refresh PR
        if: steps.merge.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name "openontology-ci"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B chore/durations-auto-refresh
          git add backend/.test_durations
          git commit -m "ci(test): 自动回写 CI 实测测试时长表（测试集结构变化触发）"
          git push --force origin chore/durations-auto-refresh
          gh pr create \
            --head chore/durations-auto-refresh \
            --base nano-ontoprompt \
            --title "ci(test): 自动回写测试时长表（结构变化）" \
            --body "verify-backend 六分片实测时长的自动合并回写。仅当测试集键集出现结构变化（新增缺录/已删残留）时更新；合并后时长守卫与分片配平恢复一致。纯数值漂移不触发本 PR。" \
            || echo "滚动 PR 已存在，分支已强推更新"

  report:
    if: ${{ always() }}
    needs: [changes, verify-backend, verify-frontend-static, verify-frontend-build, verify-frontend-e2e, verify-gates, verify-docker-build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment result
        uses: actions/github-script@v7
        env:
          JOBS: ${{ toJSON(needs) }}
        with:
          script: |
            const jobs = JSON.parse(process.env.JOBS)
            const flags = jobs.changes.outputs ?? {}
            const required = {
              'verify-gates': true,
              'verify-backend': flags.run_backend === 'true',
              'verify-frontend-static': flags.run_frontend_tests === 'true',
              'verify-frontend-build': flags.run_frontend_build === 'true',
              'verify-frontend-e2e': flags.run_frontend_tests === 'true',
              'verify-docker-build': flags.run_docker === 'true',
            }
            const verified = jobs.changes.result === 'success'
              && ['run_backend', 'run_frontend_tests', 'run_frontend_build', 'run_docker', 'run_deploy']
                .every(flag => ['true', 'false'].includes(flags[flag]))
              && Object.entries(required).every(([id, needed]) => !needed || jobs[id].result === 'success')
            const deploy = jobs.deploy
            let description
            if (verified && flags.run_deploy === 'false' && deploy.result === 'skipped') {
              description = 'Verification succeeded (no deployment needed)'
            } else if (verified && flags.run_deploy === 'true' && deploy.result === 'success') {
              if (deploy.outputs.release_result === 'success') {
                description = 'Production deployment succeeded'
              } else if (deploy.outputs.superseded === 'true') {
                description = 'Verification succeeded (superseded; not deployed)'
              }
            }
            const summary = Object.entries(jobs).map(([id, job]) => `${id}=${job.result}`).join(', ')
            const failing = Object.entries(jobs)
              .filter(([id, job]) => job.result !== 'success' && (id in required ? required[id] : true))
              .map(([id, job]) => `${id}=${job.result}`)
              .join(', ')
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: description ? 'success' : 'failure',
              context: 'openontology/deploy',
              description: description || (failing || 'No release result recorded').slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            if (description) core.notice(description)
            else core.setFailed(summary)
