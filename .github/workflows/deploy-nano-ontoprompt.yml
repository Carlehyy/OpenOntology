name: Deploy nano-ontoprompt
on:
  push:
    branches: [nano-ontoprompt]
  workflow_dispatch:
    inputs:
      bootstrap_production_env:
        description: 'Confirm this is a fresh install with no persistent platform data'
        required: true
        default: false
        type: boolean
concurrency:
  group: deploy-nano-ontoprompt
  # A deployment may include a contract/drop migration. Queue a later push so
  # it cannot interrupt the remote host between migration and readiness.
  cancel-in-progress: false
permissions:
  contents: read
  statuses: write
jobs:
  changes:
    # 仅当改动全部落在文档类路径（docs/ 与根目录 *.md）时跳过代码验证与部署；
    # 这些文件不进入部署归档，跳过不丢失任何运行时风险识别。手动触发始终全量。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "code=true" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ]; then
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          if [ -n "$changed" ] && ! grep -vEq '^(docs/|[^/]+\.md$)' <<<"$changed"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify-backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # xdist 并行 + 测试环境低 bcrypt 轮次 + pytest-split 按时长六分片后，单片
    # 回归的墙钟由 runner 侧方差主导（--dist loadfile 整文件打包 + 重文件族
    # 在 CI 放大）：配平表预测约 5 分钟/片，实测 5-13 分钟、重负载时 30+
    # 分钟（09:25 run shard 3 匀速跑满 25 分钟被取消，无单测卡死）。分片配平
    # 数据见 backend/.test_durations；新增测试须全量跑一次 --store-durations
    # 再合入（shard 1 的时长覆盖守卫强制拦截漏记）。上限 40 分钟：覆盖实测
    # 最坏分布，同时仍能掐断真正卡死的任务（真卡死不会被 40 分钟放过来）。
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openontology_ci
          POSTGRES_USER: openontology_ci
          POSTGRES_PASSWORD: openontology_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openontology_ci -d openontology_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen --group dev
        working-directory: backend

      # 新增测试缺时长记录会让 pytest-split 配平失真（已两次导致单片撞
      # timeout 被 cancel、deploy 被跳过），在回归前用收集集差集强制拦截
      - name: Test durations coverage guard
        if: matrix.shard == 1
        run: |
          uv run python - <<'PY'
          import json, subprocess
          collected = subprocess.run(
              ["uv", "run", "pytest", "--collect-only", "-q",
               "--ignore", "tests/v2/perf"],
              capture_output=True, text=True, check=True,
          ).stdout
          ids = {line.strip() for line in collected.splitlines() if "::" in line}
          known = set(json.load(open(".test_durations", encoding="utf-8")))
          missing = sorted(ids - known)
          assert not missing, (
              f"{len(missing)} 个测试缺时长记录：全量跑一次 "
              f"`pytest --store-durations [--clean-durations]` 再合入。"
              f"示例：{missing[:5]}"
          )
          print(f"durations guard OK: {len(ids)} 个测试全部有时长记录")
          PY
        working-directory: backend

      # !cancelled()：shard 1 时长守卫失败时回归仍要执行——本 job 末尾会把
      # 分片实测时长上传给 durations-refresh 自愈（守卫失败恰恰意味着时长表
      # 缺录，正是需要实测数据开自愈 PR 的场景）。--store-durations 写入的是
      # 分片私有文件，不会触碰入库的 backend/.test_durations。
      - name: Backend regression suite
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest -q --disable-warnings -n auto --dist loadfile
          --ignore tests/v2/perf --splits=6 --group=${{ matrix.shard }}
          --splitting-algorithm=least_duration
          --store-durations --durations-path .test_durations.shard${{ matrix.shard }}
        working-directory: backend

      # 性能套件测量耗时，保持串行运行以避免并行负载干扰读数。
      - name: Backend performance suite (informational)
        if: matrix.shard == 1
        continue-on-error: true
        run: uv run pytest -q --disable-warnings tests/v2/perf
        working-directory: backend

      - name: Fresh database migration
        if: matrix.shard == 1
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://openontology_ci:openontology_ci@127.0.0.1:5432/openontology_ci
        run: |
          uv run alembic upgrade head
          test "$(uv run alembic heads | grep -c '(head)')" -eq 1
          uv run alembic downgrade 0054_fact_lineage_indexes
          uv run alembic upgrade head
        working-directory: backend

      - name: Persisted ciphertext secret-split E2E
        if: matrix.shard == 1
        env:
          OPENONTOLOGY_RUNTIME_SECRET_E2E: "1"
          ENVIRONMENT: test
          DATABASE_URL: postgresql://openontology_ci:openontology_ci@127.0.0.1:5432/openontology_ci
        run: |
          mkdir -p ../.artifacts/runtime-secret-migration
          uv run python scripts/runtime_secret_split_postgres_e2e.py --self-test
          uv run python scripts/runtime_secret_split_postgres_e2e.py \
            --report ../.artifacts/runtime-secret-migration/report.json
        working-directory: backend

      - name: Upload runtime-secret migration evidence
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-secret-migration-${{ github.run_id }}
          path: .artifacts/runtime-secret-migration/report.json
          if-no-files-found: error
          retention-days: 14

      # 分片实测时长（含回归失败时的数据）：durations-refresh 的自愈原料。
      # continue-on-error + warn：上传问题绝不影响验证结论。
      - name: Upload shard test durations
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: durations-shard-${{ matrix.shard }}
          path: backend/.test_durations.shard${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 3

  verify-frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 15 分钟余量过薄：同一提交在快慢不同的 runner 上实测 11m39s ~ >15m，
    # 慢机器会随机撞顶导致部署被跳过（MYW-73 首次部署即如此）。提到 25 分钟。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend unit tests
        run: npm run test:unit
        working-directory: frontend

      - name: Frontend E2E classification gate
        run: npm run test:e2e:classification
        working-directory: frontend

      - name: Frontend feature-boundary gate
        run: npm run check:feature-boundaries
        working-directory: frontend

      # 像素尺寸断言规范：禁止对 boundingBox 宽高做精确相等断言
      # （CI Linux 浮点舍入差会误报，先例 6596ffa7）。
      - name: Frontend E2E assertion-convention gate
        run: npm run check:e2e-assertions
        working-directory: frontend

      - name: Frontend component-convergence gate
        run: npm run check:component-convergence
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend production build
        run: npm run build
        working-directory: frontend

      # 部署镜像直接使用本 job 构建的 dist，保证上线产物与通过门禁的产物一致，
      # 服务器端不再重复执行 vite build。
      - name: Upload frontend dist for deployment
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Frontend offline E2E suite
        run: npm run test:e2e:mocked
        working-directory: frontend

      - name: Upload frontend test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-${{ github.run_id }}
          path: .artifacts/playwright
          if-no-files-found: ignore
          retention-days: 14

  verify-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'openontology/deploy',
              description: 'Verification and deployment are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate documentation and repository hygiene
        run: |
          node scripts/ci/check-markdown-links.mjs --self-test
          node scripts/ci/check-markdown-links.mjs
          bash scripts/ci/test-deploy-guards.sh
          bash scripts/ci/check-repository-hygiene.sh

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: config/uv.lock

      - name: Install configuration-center dependencies
        run: uv sync --frozen --group dev
        working-directory: config

      - name: Configuration-center regression suite
        run: uv run pytest -q
        working-directory: config

      - name: Production dependency configuration gate
        # 生产依赖清单不再进入 Git：runner 上由 Repository secrets/variables
        # 原子物化（0600），校验逻辑与 tracked 时代完全一致。
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          PROD_NEO4J_URI: ${{ secrets.PROD_NEO4J_URI }}
          PROD_NEO4J_PASSWORD: ${{ secrets.PROD_NEO4J_PASSWORD }}
          PROD_NEO4J_AUTH: ${{ secrets.PROD_NEO4J_AUTH }}
          PROD_MINIO_ENDPOINT: ${{ secrets.PROD_MINIO_ENDPOINT }}
          PROD_MINIO_ACCESS_KEY: ${{ secrets.PROD_MINIO_ACCESS_KEY }}
          PROD_MINIO_SECRET_KEY: ${{ secrets.PROD_MINIO_SECRET_KEY }}
          PROD_N8N_API_URL: ${{ secrets.PROD_N8N_API_URL }}
          PROD_N8N_API_KEY: ${{ secrets.PROD_N8N_API_KEY }}
          PROD_POSTGRES_DB: ${{ vars.PROD_POSTGRES_DB }}
          PROD_POSTGRES_USER: ${{ vars.PROD_POSTGRES_USER }}
          PROD_NEO4J_USER: ${{ vars.PROD_NEO4J_USER }}
          PROD_PUBLIC_PORT: ${{ vars.PROD_PUBLIC_PORT }}
          PROD_MINIO_USE_SSL: ${{ vars.PROD_MINIO_USE_SSL }}
        run: |
          bash scripts/ci/materialize-production-dependencies.sh
          test -s deploy/production.dependencies.env
          trap 'rm -f .env deploy/production.dependencies.env' EXIT
          APP_DIR="${GITHUB_WORKSPACE}" \
            SKIP_GIT=1 \
            BOOTSTRAP_PRODUCTION_ENV=1 \
            DEPLOY_VALIDATE_ONLY=1 \
            HEALTH_URL=http://127.0.0.1/ \
            bash deploy/deploy-prod.sh

  verify-docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 前端镜像改为预构建形态（COPY dist），需要 verify-frontend 产出的 dist；
    # 该依赖仍早于关键路径上的 verify-backend，不延长整体墙钟。
    needs: [changes, verify-frontend]
    if: always() && needs.changes.outputs.code == 'true' && needs.verify-frontend.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend/dist

      - name: Build Docker images
        run: docker compose -f docker-compose.prod.yml build

  deploy:
    needs: [changes, verify-backend, verify-frontend, verify-gates, verify-docker-build]
    # 文档类改动不进入部署归档，跳过部署不会放过任何运行时变更；其余改动必须
    # 四个验证 job 全部成功才允许部署。
    if: >-
      always() && needs.verify-gates.result == 'success'
      && needs.changes.outputs.code == 'true'
      && needs.verify-backend.result == 'success'
      && needs.verify-frontend.result == 'success'
      && needs.verify-docker-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend/dist

      - name: Check deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD secret is required}"
          APP_DIR="${DEPLOY_APP_DIR:-/opt/openontology}"
          bash "${GITHUB_WORKSPACE}/scripts/ci/validate-deploy-app-dir.sh" "${APP_DIR}"
          if [ -n "${DEPLOY_HOST}" ]; then echo "DEPLOY_HOST configured: yes"; else echo "DEPLOY_HOST configured: no"; fi
          if [ -n "${DEPLOY_USER}" ]; then echo "DEPLOY_USER configured: yes"; else echo "DEPLOY_USER configured: no"; fi
          if [ -n "${DEPLOY_PASSWORD}" ]; then echo "DEPLOY_PASSWORD configured: yes"; else echo "DEPLOY_PASSWORD configured: no"; fi
          echo "DEPLOY_APP_DIR validated: yes"

      - name: Trust deployment host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Materialize production dependency manifest
        # 归档脚本与远端替换继续要求 deploy/production.dependencies.env 存在；
        # 在 runner 上从 Repository secrets/variables 物化，仓库本体不再携带。
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          PROD_NEO4J_URI: ${{ secrets.PROD_NEO4J_URI }}
          PROD_NEO4J_PASSWORD: ${{ secrets.PROD_NEO4J_PASSWORD }}
          PROD_NEO4J_AUTH: ${{ secrets.PROD_NEO4J_AUTH }}
          PROD_MINIO_ENDPOINT: ${{ secrets.PROD_MINIO_ENDPOINT }}
          PROD_MINIO_ACCESS_KEY: ${{ secrets.PROD_MINIO_ACCESS_KEY }}
          PROD_MINIO_SECRET_KEY: ${{ secrets.PROD_MINIO_SECRET_KEY }}
          PROD_N8N_API_URL: ${{ secrets.PROD_N8N_API_URL }}
          PROD_N8N_API_KEY: ${{ secrets.PROD_N8N_API_KEY }}
          PROD_POSTGRES_DB: ${{ vars.PROD_POSTGRES_DB }}
          PROD_POSTGRES_USER: ${{ vars.PROD_POSTGRES_USER }}
          PROD_NEO4J_USER: ${{ vars.PROD_NEO4J_USER }}
          PROD_PUBLIC_PORT: ${{ vars.PROD_PUBLIC_PORT }}
          PROD_MINIO_USE_SSL: ${{ vars.PROD_MINIO_USE_SSL }}
        run: |
          bash scripts/ci/materialize-production-dependencies.sh
          test -s deploy/production.dependencies.env

      - name: Upload source to server
        timeout-minutes: 10
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD secret is required}"
          APP_DIR="${DEPLOY_APP_DIR:-/opt/openontology}"
          bash "${GITHUB_WORKSPACE}/scripts/ci/validate-deploy-app-dir.sh" "${APP_DIR}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          bash scripts/ci/create-deployment-archive.sh /tmp/openontology.tar.gz
          REMOTE_ARCHIVE="/tmp/openontology.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tar.gz"
          sshpass -p "${DEPLOY_PASSWORD}" scp -o StrictHostKeyChecking=yes -o ConnectTimeout=20 /tmp/openontology.tar.gz "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_ARCHIVE}"
          # Keep the persistent .env in place throughout source replacement.
          # An interrupted upload can remove code, but can never strand or
          # restore a stale copy of the encryption authority from /tmp.
          sshpass -p "${DEPLOY_PASSWORD}" ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- '${APP_DIR}' '${REMOTE_ARCHIVE}'" <<'REMOTE_SOURCE_SWAP'
          set -Eeuo pipefail
          APP_DIR="$1"
          REMOTE_ARCHIVE="$2"
          umask 077
          trap 'rm -f "$REMOTE_ARCHIVE"' EXIT
          chmod 600 "$REMOTE_ARCHIVE"
          tar -tzf "$REMOTE_ARCHIVE" >/dev/null
          if [ -L "$APP_DIR" ]; then
            echo "DEPLOY_APP_DIR must be a real directory, not a symlink"
            exit 1
          fi
          if [ -L "$APP_DIR/.env" ]; then
            echo "production .env must be a regular file, not a symlink"
            exit 1
          fi
          mkdir -p "$APP_DIR"
          find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf -- {} +
          tar --extract --gzip --file "$REMOTE_ARCHIVE" \
            --directory "$APP_DIR" --no-same-permissions --no-same-owner
          # The restrictive umask protects the dependency manifest and other
          # extracted files, but the prebuilt frontend assets are copied into
          # the image with host modes preserved and must stay readable by the
          # unprivileged nginx worker.
          chmod -R a+rX "$APP_DIR/frontend/dist"
          test -f "$APP_DIR/deploy/production.dependencies.env"
          chmod 600 "$APP_DIR/deploy/production.dependencies.env"
          if [ -f "$APP_DIR/.env" ] && [ ! -L "$APP_DIR/.env" ]; then
            chmod 600 "$APP_DIR/.env"
          fi
          REMOTE_SOURCE_SWAP

      - name: Deploy over SSH
        timeout-minutes: 25
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
          BOOTSTRAP_PRODUCTION_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_production_env && '1' || '0' }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD secret is required}"
          APP_DIR="${DEPLOY_APP_DIR:-/opt/openontology}"
          bash "${GITHUB_WORKSPACE}/scripts/ci/validate-deploy-app-dir.sh" "${APP_DIR}"
          if [ -n "${DEPLOY_HEALTH_URL}" ]; then
            HEALTH_URL="${DEPLOY_HEALTH_URL}"
          else
            PUBLIC_PORT="$(
              awk -F= '$1 == "PUBLIC_PORT" {
                value = substr($0, index($0, "=") + 1)
              } END {
                sub(/\r$/, "", value)
                print value
              }' deploy/production.dependencies.env
            )"
            PUBLIC_PORT="${PUBLIC_PORT:-80}"
            case "${PUBLIC_PORT}" in
              *[!0-9]*)
                echo "PUBLIC_PORT must be an integer between 1 and 65535"
                exit 1
                ;;
            esac
            if [ "${PUBLIC_PORT}" -lt 1 ] || [ "${PUBLIC_PORT}" -gt 65535 ]; then
              echo "PUBLIC_PORT must be an integer between 1 and 65535"
              exit 1
            fi
            if [ "${PUBLIC_PORT}" -eq 80 ]; then
              HEALTH_URL="http://${DEPLOY_HOST}/"
            else
              HEALTH_URL="http://${DEPLOY_HOST}:${PUBLIC_PORT}/"
            fi
          fi
          case "${HEALTH_URL}" in
            http://*|https://*) ;;
            *)
              echo "DEPLOY_HEALTH_URL must use an HTTP(S) URL"
              exit 1
              ;;
          esac
          if [[ "${HEALTH_URL}" == *"'"* || "${HEALTH_URL}" =~ [[:space:]] ]]; then
            echo "DEPLOY_HEALTH_URL must not contain quotes or whitespace"
            exit 1
          fi
          sshpass -p "${DEPLOY_PASSWORD}" ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '${APP_DIR}' && APP_DIR='${APP_DIR}' SKIP_GIT=1 BOOTSTRAP_PRODUCTION_ENV='${BOOTSTRAP_PRODUCTION_ENV}' HEALTH_URL='${HEALTH_URL}' bash deploy/deploy-prod.sh"

      - name: Remove runner deployment archive
        if: ${{ always() }}
        run: rm -f /tmp/openontology.tar.gz deploy/production.dependencies.env

  durations-refresh:
    # 时长表自愈：合并 verify-backend 各分片的实测时长，仅当测试集键集发生
    # 结构变化（新增缺录/已删残留）时回写 .test_durations 并维护一个滚动 PR。
    # 刻意独立于 deploy/report 关键路径：本 job 任何失败都不阻塞部署（job 级
    # continue-on-error），且未列入 report 的结果聚合。分支推送不触发部署
    # 工作流（on.push 仅 nano-ontoprompt），PR 合并才随正常流程生效。
    needs: [changes, verify-backend]
    if: ${{ always() && needs.changes.outputs.code == 'true' && needs.verify-backend.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download shard durations
        uses: actions/download-artifact@v4
        with:
          pattern: durations-shard-*
          path: shard-durations
          merge-multiple: true

      - name: Merge shard durations and detect structural drift
        id: merge
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import glob, json, os, sys
          files = sorted(glob.glob('shard-durations/.test_durations.shard*'))
          if len(files) != 6:
              print(f'分片时长不完整（{len(files)}/6，可能有分片未跑到回归），跳过自愈')
              sys.exit(0)
          merged = {}
          for path in files:
              merged.update(json.load(open(path, encoding='utf-8')))
          committed = json.load(open('backend/.test_durations', encoding='utf-8'))
          added = sorted(set(merged) - set(committed))
          removed = sorted(set(committed) - set(merged))
          if not added and not removed:
              print('时长表键集无结构变化（纯数值漂移不回写），跳过')
              sys.exit(0)
          with open('backend/.test_durations', 'w', encoding='utf-8') as f:
              json.dump(merged, f, indent=2, sort_keys=True)
              f.write('\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('refresh=true\n')
          print(f'结构变化：新增缺录 {len(added)} / 已删残留 {len(removed)}，回写 {len(merged)} 条实测时长')
          PY

      - name: Open rolling refresh PR
        if: steps.merge.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name "openontology-ci"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B chore/durations-auto-refresh
          git add backend/.test_durations
          git commit -m "ci(test): 自动回写 CI 实测测试时长表（测试集结构变化触发）"
          git push --force origin chore/durations-auto-refresh
          gh pr create \
            --head chore/durations-auto-refresh \
            --base nano-ontoprompt \
            --title "ci(test): 自动回写测试时长表（结构变化）" \
            --body "verify-backend 六分片实测时长的自动合并回写。仅当测试集键集出现结构变化（新增缺录/已删残留）时更新；合并后时长守卫与分片配平恢复一致。纯数值漂移不触发本 PR。" \
            || echo "滚动 PR 已存在，分支已强推更新"

  report:
    if: ${{ always() }}
    needs: [changes, verify-backend, verify-frontend, verify-gates, verify-docker-build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment result
        uses: actions/github-script@v7
        with:
          script: |
            const code = '${{ needs.changes.outputs.code }}'
            const results = {
              'verify-backend': '${{ needs.verify-backend.result }}',
              'verify-frontend': '${{ needs.verify-frontend.result }}',
              'verify-gates': '${{ needs.verify-gates.result }}',
              'verify-docker-build': '${{ needs.verify-docker-build.result }}',
              deploy: '${{ needs.deploy.result }}',
            }
            // 文档类改动（code=false）下代码验证与部署被有意跳过，只要文档与
            // 卫生门禁通过即为成功；代码改动则要求全部 job 成功。
            const succeeded = results['verify-gates'] === 'success'
              && (code === 'false'
                ? results.deploy === 'skipped'
                : Object.values(results).every((r) => r === 'success'))
            const summary = Object.entries(results).map(([k, v]) => `${k}=${v}`).join(', ')
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'openontology/deploy',
              description: succeeded
                ? 'Verification and deployment succeeded'
                : summary.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            if (!succeeded) {
              core.setFailed(summary)
            }
