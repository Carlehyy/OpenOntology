# auth_request_set 在 access 阶段赋值，map 到 proxy_pass 内容阶段才求值。
# 缺失/异常身份在网关拒绝；不硬编码共享管理员用户名。
map $grafana_user $oo_grafana_safe_upstream {
    ""                              127.0.0.1:18080;
    "~^[[:space:]]|[[:space:]]$"     127.0.0.1:18080;
    "~[[:cntrl:]]"                  127.0.0.1:18080;
    default                         grafana:3000;
}

server {
    listen 127.0.0.1:18080;
    server_name _;
    access_log off;

    location / {
        default_type text/html;
        charset utf-8;
        return 401 '<p>看板会话已过期，请返回平台刷新页面后重试。</p>';
    }
}
