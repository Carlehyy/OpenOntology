# 响应压缩（http 级：80/443 两个 server 及其全部 location 共享生效）。
# JSON 接口与大体积静态资源在慢链路上的传输量下降约一个数量级。
#
# - gzip_proxied any：/api/ 响应经 proxy_pass 来自 backend，nginx 默认
#   不压缩代理响应，必须显式放开，否则 gzip_types 对接口不生效；
# - SSE（text/event-stream）与二进制下载（octet-stream 等）不在
#   gzip_types 中，保持原样直传，流式响应不会被压缩缓冲破坏；
# - 低于 gzip_min_length 的响应（如 189B 的总览摘要）压缩得不偿失，
#   直接明文返回；
# - text/html 由 gzip on 隐式覆盖，写入 gzip_types 会触发重复告警。
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
