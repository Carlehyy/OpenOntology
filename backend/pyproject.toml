[project]
name = "openontology-backend"
version = "0.1.0"
description = "OpenOntology platform backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.49.0",
  "sqlalchemy==2.0.35",
  "alembic==1.13.3",
  "psycopg2-binary==2.9.9",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "python-multipart==0.0.12",
  "cryptography==43.0.1",
  "celery==5.4.0",
  "redis==5.1.1",
  "httpx==0.27.2",
  "playwright==1.60.0",
  "requests==2.32.4",
  "pydantic-settings==2.5.2",
  "pydantic[email]==2.13.4",
  "markitdown==0.0.1a3",
  "python-docx==1.1.2",
  "python-pptx==1.0.2",
  "pyjwt==2.13.0",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "reportlab==4.2.5",
  "openai==1.51.0",
  "anthropic==0.37.1",
  "rdflib==7.0.0",
  "pyyaml==6.0.2",
  "aiofiles==24.1.0",
  "python-dotenv==1.0.1",
  "json-repair==0.61.1",
  "neo4j==5.26.0",
  "minio==7.2.12",
  "pymongo==4.10.1",
  "pymysql==1.1.1",
  "pyarrow==18.1.0",
  "pandas==3.0.3",
  "python-crontab==3.2.0",
  "apscheduler==3.11.3",
  "mcp>=1.28.1,<2",
  "jupyter-kernel-gateway==3.0.1",
  "ipykernel==6.29.5",
  "websocket-client==1.8.0",
  "nats-py>=2.15.0",
  "statsmodels==0.14.6",
  # 助手评估（OpenJudge）运行时所需的轻量依赖；py-openjudge 本体在
  # Dockerfile 中以 --no-deps 精确安装（见 backend/Dockerfile 注释）。
  # dashscope：openjudge.models 包级 __init__ 聚合导入 QwenVLModel 所必需；
  # scikit-learn：openjudge.graders.agent.utils 的 TfidfVectorizer 所必需
  # （numpy/scipy 已随 statsmodels/pandas 在依赖树内）。
  "loguru==0.7.3",
  "tqdm==4.67.1",
  "dashscope==1.23.6",
  "scikit-learn==1.7.2",
  # tenacity：openjudge.generator（SimpleRubricsGenerator 评分标准生成）所必需；
  # 约束与 py-openjudge 0.2.1 声明一致（>=9.1,<10）。
  "tenacity==9.1.2",
]

[dependency-groups]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "pytest-split>=0.11.0",
  "pytest-xdist==3.6.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
